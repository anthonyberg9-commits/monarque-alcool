 équilibrées de fruits mûrs, caramel et noisette."}, {"type": "text", "text": "Finale : Douce et légèrement boisée."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, Jameson est parfait pour être dégusté pur, sur glace, ou dans des cocktails comme l'Irish Coffee ou le Jameson Ginger & Lime."}]}, {"id": 153, "name": "Johnny walker double black", "category": "Whisky", "abv": 40.0, "blocks": [{"type": "text", "text": "Johnnie Walker Double Black est un blended scotch whisky inspiré du célèbre Johnnie Walker Black Label, mais avec une intensité accrue. Ce whisky est vieilli dans des fûts de chêne intensément carbonisés, ce qui lui confère un caractère fumé et corsé."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de clou de girofle, fumée, raisins secs et pomme."}, {"type": "text", "text": "En bouche : Saveurs de vanille, orange, épices et une touche de caramel."}, {"type": "text", "text": "Finale : Riche, douce et fumée, avec des nuances boisées."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, le Double Black est idéal pour les amateurs de whiskies au profil audacieux. Il peut être dégusté pur, sur glace, ou dans un cocktail comme le Highball avec soda, citron et romarin."}]}, {"id": 154, "name": "Johnnie walker green", "category": "Whisky", "abv": 43.0, "blocks": [{"type": "text", "text": "Johnnie Walker Green Label est un blended malt scotch whisky unique, composé exclusivement de whiskies de malt provenant de différentes régions d'Écosse, notamment le Speyside, les Highlands, les Lowlands et les îles. Chaque whisky utilisé dans cet assemblage est vieilli pendant au moins 15 ans, ce qui lui confère une complexité et une profondeur remarquables."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de fruits frais, herbe coupée, fumée légère et vanille."}, {"type": "text", "text": "En bouche : Saveurs équilibrées de miel, agrumes, épices et une touche de tourbe."}, {"type": "text", "text": "Finale : Longue et douce, avec des nuances boisées et fumées."}, {"type": "text", "text": "Avec un taux d'alcool de 43 %, le Green Label est idéal pour les amateurs de whiskies complexes et harmonieux."}]}, {"id": 155, "name": "Johnnie walker red", "category": "Whisky", "abv": 40.0, "blocks": [{"type": "text", "text": "Johnnie Walker Red Label est un blended scotch whisky emblématique, connu pour son caractère vibrant et audacieux. C'est le whisky le plus vendu de la gamme Johnnie Walker, apprécié pour sa polyvalence et sa capacité à se marier parfaitement dans des cocktails."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de clou de girofle, cannelle et une touche de fruits frais."}, {"type": "text", "text": "En bouche : Saveurs épicées, avec des nuances de poivre noir, caramel et une légère fumée."}, {"type": "text", "text": "Finale : Chaleureuse et persistante, avec des accents boisés."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, le Red Label est idéal pour les cocktails comme le Scotch Highball ou le Rusty Nail, mais il peut aussi être dégusté sur glace."}]}, {"id": 156, "name": "Lagavulin 16 ans", "category": "Whisky", "abv": 43.0, "blocks": [{"type": "text", "text": "Le Lagavulin 16 ans est un single malt écossais emblématique, produit sur l'île d'Islay, réputée pour ses whiskies tourbés et fumés. Ce whisky est vieilli pendant 16 ans dans des fûts de chêne, ce qui lui confère une profondeur et une complexité remarquables."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de tourbe intense, algues marines, et une touche de fruits secs."}, {"type": "text", "text": "En bouche : Saveurs riches de fumée, vanille, figues et épices."}, {"type": "text", "text": "Finale : Longue et persistante, avec des nuances boisées et iodées."}, {"type": "text", "text": "Avec un taux d'alcool de 43 %, le Lagavulin 16 ans est idéal pour être dégusté pur ou avec une goutte d'eau pour révéler ses arômes."}]}, {"id": 157, "name": "Lagavulin distiller's edition", "category": "Whisky", "abv": 43.0, "blocks": [{"type": "text", "text": "Le Lagavulin Distiller's Edition est une version spéciale du célèbre Lagavulin 16 ans, offrant une expérience encore plus riche et complexe grâce à une double maturation. Ce whisky est vieilli dans des fûts de chêne, puis affiné dans des fûts de sherry Pedro Ximénez, ce qui lui confère des saveurs sucrées et profondes qui complètent parfaitement son caractère tourbé."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Tourbe intense, fruits secs, raisins et une touche de vanille."}, {"type": "text", "text": "En bouche : Saveurs de fumée côtière, caramel salé, toffee et une douceur fruitée."}, {"type": "text", "text": "Finale : Longue et persistante, avec des nuances épicées et boisées."}, {"type": "text", "text": "Avec un taux d'alcool de 43 %, le Lagavulin Distiller's Edition est idéal pour les amateurs de whiskies tourbés et équilibrés."}]}, {"id": 158, "name": "Laphroaig lore", "category": "Whisky", "abv": 48.0, "blocks": [{"type": "text", "text": "Laphroaig Lore est un single malt écossais produit sur l'île d'Islay, connu pour être l'une des expressions les plus riches et complexes de la distillerie Laphroaig. Ce whisky est un assemblage de malts vieillis entre 7 et 21 ans, utilisant des fûts de chêne européen, des fûts de bourbon et des fûts de sherry Oloroso, ainsi que des quarter casks."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Tourbe intense, embruns marins, chocolat noir et une touche de cendre."}, {"type": "text", "text": "En bouche : Saveurs vives de chocolat amer, cendre, épices et une pointe de piment."}, {"type": "text", "text": "Finale : Courte et sèche, avec une douceur persistante en arrière-goût."}, {"type": "text", "text": "Avec un taux d'alcool de 48 %, ce whisky est idéal pour les amateurs de saveurs tourbées et audacieuses."}]}, {"id": 159, "name": "Laphroaig quarter cask", "category": "Whisky", "abv": 48.0, "blocks": [{"type": "text", "text": "Le Laphroaig Quarter Cask est un single malt écossais produit sur l'île d'Islay, célèbre pour ses whiskies tourbés et fumés. Ce whisky est unique grâce à sa double maturation : il est vieilli dans des fûts de chêne américain ayant contenu du bourbon, puis transféré dans des \"Quarter Casks\", des petits fûts qui augmentent le contact avec le bois, intensifiant ainsi ses saveurs."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Tourbe intense, vanille, noix de coco et une touche de banane."}, {"type": "text", "text": "En bouche : Saveurs riches de fumée, caramel, épices et une douceur fruitée."}, {"type": "text", "text": "Finale : Longue et persistante, avec des nuances boisées et fumées."}, {"type": "text", "text": "Avec un taux d'alcool de 48 %, ce whisky est idéal pour les amateurs de saveurs audacieuses et complexes."}]}, {"id": 160, "name": "Lot 40", "category": "Whisky", "abv": 43.0, "blocks": [{"type": "text", "text": "Lot No. 40 est un whisky canadien emblématique, produit par la distillerie Hiram Walker à Windsor, en Ontario. Ce whisky est élaboré à partir de 100 % de seigle, distillé dans un alambic en cuivre traditionnel, et vieilli dans des fûts de chêne blanc vierge. Il est souvent considéré comme l'une des meilleures expressions de whisky de seigle en Amérique du Nord."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de fruits noirs, épices de boulangerie, vanille et toffee."}, {"type": "text", "text": "En bouche : Saveurs audacieuses de fruits secs, épices chaudes et une touche florale"}, {"type": "text", "text": "Finale : Douce et persistante, avec des nuances de fruits séchés et d'épices."}, {"type": "text", "text": "Avec un taux d'alcool de 43 %, Lot No. 40 est idéal pour être dégusté pur, sur glace, ou dans des cocktails comme le Manhattan ou le Whisky Sour."}]}, {"id": 161, "name": "Macallan double cask 12 ans", "category": "Whisky", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Macallan Double Cask 12 ans est un single malt écossais produit dans la région du Speyside. Ce whisky est vieilli pendant 12 ans dans une combinaison de fûts de chêne américain et européen ayant contenu du xérès, ce qui lui confère un équilibre parfait entre douceur et complexité."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de vanille, caramel et agrumes."}, {"type": "text", "text": "En bouche : Saveurs de fruits secs, miel et épices douces."}, {"type": "text", "text": "Finale : Longue et chaleureuse, avec des nuances boisées et légèrement sucrées."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, ce whisky est idéal pour être dégusté pur ou avec une goutte d'eau pour révéler ses arômes."}]}, {"id": 162, "name": "Michter's rye", "category": "Whisky", "abv": null, "blocks": [{"type": "text", "text": "Michter's US★1 Kentucky Straight Rye est un whisky américain haut de gamme produit avec soin au Kentucky. Ce rye est élaboré à partir de grains de seigle soigneusement sélectionnés, et vieilli dans des fûts de chêne blanc américain flambés. Chaque bouteille provient d'un fût unique, garantissant un profil aromatique unique."}]}, {"id": 163, "name": "Détails clés", "category": "Whisky", "abv": 42.4, "blocks": [{"type": "text", "text": "Degré d'alcool : 42,4 % (84,8 proof)."}, {"type": "text", "text": "Notes de dégustation : Épices marquées avec des nuances poivrées, agrumes, caramel au beurre et chêne."}, {"type": "text", "text": "Production : Distillé et mis en bouteille au Kentucky, avec un vieillissement dans des entrepôts chauffés pour une extraction optimale des saveurs."}, {"type": "text", "text": "Idéal pour être savouré pur ou dans des cocktails classiques comme l'Old Fashioned ou le Manhattan."}]}, {"id": 164, "name": "Monkey shoulder", "category": "Whisky", "abv": 40.0, "blocks": [{"type": "text", "text": "Monkey Shoulder est un blended malt scotch whisky produit par William Grant & Sons en Écosse. Ce whisky est unique car il est composé uniquement de whiskies de malt provenant de distilleries du Speyside,( un assemblage de trois single malts provenant des distilleries Balvenie, Glenfiddich et Kininvie,) toutes situées dans la région du Speyside en Écosse ce qui lui confère un profil riche et équilibré. Il est conçu pour être polyvalent, parfait pour les cocktails ou dégusté pur."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de vanille, marmelade d'orange et crème brûlée."}, {"type": "text", "text": "En bouche : Saveurs de malt doux, fruits secs, épices légères et une touche de chêne."}, {"type": "text", "text": "Finale : Douce et persistante, avec des nuances de caramel et de noisette."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, Monkey Shoulder est idéal pour des cocktails comme le Whisky Sour ou le Old Fashioned."}]}, {"id": 165, "name": "Nikka Taketsuru pure malt", "category": "Whisky", "abv": 43.0, "blocks": [{"type": "text", "text": "Le Nikka Taketsuru Pure Malt est un whisky japonais emblématique, nommé en l'honneur de Masataka Taketsuru, le fondateur de la maison Nikka et pionnier du whisky japonais. Ce whisky est un assemblage de malts provenant des distilleries Yoichi et Miyagikyo, offrant un équilibre parfait entre douceur et complexité."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de fruits mûrs, vanille, et une touche de chocolat noir."}, {"type": "text", "text": "En bouche : Saveurs de caramel, épices douces, et une subtile influence boisée."}, {"type": "text", "text": "Finale : Longue et élégante, avec des nuances de fruits secs et de chêne."}, {"type": "text", "text": "Avec un taux d'alcool de 43 %, ce whisky est idéal pour être dégusté pur ou avec une goutte d'eau pour révéler ses arômes."}]}, {"id": 166, "name": "Nikka myiagikyo", "category": "Whisky", "abv": 45.0, "blocks": [{"type": "text", "text": "Le Nikka Miyagikyo Single Malt est un whisky japonais raffiné, produit dans la vallée de Miyagi, au nord de l'île de Honshu. Cette région est réputée pour son air pur et ses eaux de source de qualité, qui contribuent à la finesse de ce whisky."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de banane, réglisse, miel, chocolat et épices de boulangerie."}, {"type": "text", "text": "En bouche : Saveurs équilibrées de fruits mûrs, caramel, gingembre et une touche de bois brûlé."}, {"type": "text", "text": "Finale : Longue et élégante, avec des nuances de tabac frais, noix grillées et fruits compotés."}, {"type": "text", "text": "Avec un taux d'alcool de 45 %, ce whisky est idéal pour être dégusté pur ou avec des glaçons. Il est souvent vieilli dans des fûts de sherry, ce qui lui confère une profondeur aromatique unique."}]}, {"id": 167, "name": "Oban 14", "category": "Whisky", "abv": 43.0, "blocks": [{"type": "text", "text": "Le Oban 14 ans est un single malt écossais emblématique, produit dans la région des Highlands, à la distillerie Oban, située près de la côte ouest de l'Écosse. Ce whisky est apprécié pour son équilibre entre des saveurs fruitées et fumées, avec une touche maritime qui reflète son emplacement côtier."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de bruyère, fumée légère, sel marin et agrumes."}, {"type": "text", "text": "En bouche : Saveurs riches de figues séchées, orange, malt sucré et une pointe de fumée."}, {"type": "text", "text": "Finale : Longue et élégante, avec des nuances de sel et de bois."}, {"type": "text", "text": "Avec un taux d'alcool de 43 %, le Oban 14 ans est idéal pour être dégusté pur ou avec une goutte d'eau pour révéler ses arômes."}]}, {"id": 168, "name": "Oban double maturation", "category": "Whisky", "abv": 43.0, "blocks": [{"type": "text", "text": "L'Oban Double Maturation, également connue sous le nom de Distillers Edition, est une version spéciale du célèbre Oban 14 ans. Ce whisky subit une double maturation, avec une finition dans des fûts de xérès Fino Montilla, ce qui lui confère une complexité et une richesse supplémentaires."}, {"type": "text", "text": "( Le Fino Montilla est un vin fortifié emblématique de la région de Montilla-Moriles, située en Andalousie, Espagne. Ce vin est élaboré principalement à partir du cépage Pedro Ximénez .)"}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes d'agrumes, de fumée légère, et une touche de fruits secs."}, {"type": "text", "text": "En bouche : Saveurs équilibrées de caramel, épices, et une douceur fruitée provenant du xérès."}, {"type": "text", "text": "Finale : Longue et élégante, avec des nuances boisées et légèrement salées."}, {"type": "text", "text": "Avec un taux d'alcool de 43 %, ce whisky est idéal pour les amateurs de single malts complexes et raffinés."}]}, {"id": 169, "name": "Sazerac Rye", "category": "Whisky", "abv": 45.0, "blocks": [{"type": "text", "text": "Sazerac Rye est un whisky emblématique américain, souvent surnommé \"The One and Only New Orleans Original\". Ce rye whiskey est profondément enraciné dans l'histoire de la Nouvelle-Orléans, où il a joué un rôle clé dans la création du cocktail Sazerac, considéré comme le premier cocktail américain."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de clou de girofle, vanille, anis et poivre."}, {"type": "text", "text": "En bouche : Saveurs subtiles d'épices, d'agrumes confits et une touche de réglisse."}, {"type": "text", "text": "Finale : Douce et persistante, avec des nuances de bonbons épicés."}, {"type": "text", "text": "Avec un taux d'alcool de 45 %, le Sazerac Rye est idéal pour être dégusté pur ou dans des cocktails classiques comme le Sazerac Cocktail."}]}, {"id": 170, "name": "Tobermory", "category": "Whisky", "abv": 46.3, "blocks": [{"type": "text", "text": "Le Tobermory 12 ans est un single malt écossais raffiné, produit par la distillerie Tobermory, située sur l'île de Mull en Écosse. Ce whisky non tourbé reflète le caractère floral et fruité de la région, tout en ajoutant une complexité subtile grâce à son vieillissement dans des fûts de chêne."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de miel, agrumes, pommes vertes et un soupçon de vanille."}, {"type": "text", "text": "En bouche : Saveurs de malt sucré, caramel, épices douces et une touche de chêne."}, {"type": "text", "text": "Finale : Longue et équilibrée, avec des nuances boisées et légèrement épicées."}, {"type": "text", "text": "Avec un taux d'alcool de 46,3 %, le Tobermory 12 ans est parfait pour être dégusté pur ou avec une goutte d'eau."}]}, {"id": 171, "name": "Waterford argot", "category": "Whisky", "abv": 47.0, "blocks": [{"type": "text", "text": "Le Waterford Argot est un single malt irlandais produit par la distillerie Waterford, connue pour son approche innovante et axée sur le terroir. Ce whisky est surnommé le \"petit frère\" de The Cuvée, une autre expression emblématique de la distillerie. Le nom \"Argot\" fait référence à un langage secret, réservé aux initiés, et reflète le caractère audacieux et créatif de ce whisky."}, {"type": "heading", "text": "Caractéristiques principales"}, {"type": "text", "text": "Vieillissement : Maturation dans quatre types de fûts différents :"}, {"type": "text", "text": "37 % de fûts de chêne américain de premier remplissage."}, {"type": "text", "text": "19 % de fûts de chêne américain vierge."}, {"type": "text", "text": "19 % de fûts de chêne français supérieur."}, {"type": "text", "text": "23 % de fûts ayant contenu du vin doux naturel."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes d'amande, écorce d'orange, pomme compotée, chocolat blanc et toffee."}, {"type": "text", "text": "En bouche : Saveurs de poivre blanc, granola, pamplemousse, barbecue fumé et peau de pomme verte."}, {"type": "text", "text": "Finale : Longue et gourmande, avec des épices séchées et une douce chaleur."}, {"type": "text", "text": "Avec un taux d'alcool de 47 %, le Waterford Argot est vibrant et accessible, tout en conservant la complexité typique des single malts de la distillerie."}]}, {"id": 172, "name": "Wild turkey", "category": "Whisky", "abv": 40.5, "blocks": [{"type": "text", "text": "Wild Turkey est un bourbon américain produit par la distillerie Wild Turkey à Lawrenceburg, Kentucky. Ce whisky est embouteillé à 40,5 % d'alcool et est conçu pour offrir une expérience plus douce et accessible par rapport au célèbre Wild Turkey 101."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de vanille, caramel, sucre d'orge et cerise."}, {"type": "text", "text": "En bouche : Saveurs de miel, épices douces, et une touche de chêne brûlé."}, {"type": "text", "text": "Finale : Longue et épicée, avec des nuances boisées et légèrement sucrées."}, {"type": "text", "text": "Le Wild Turkey est idéal pour les cocktails comme le Kentucky Mule ou le Whiskey Sour, mais il peut également être dégusté pur."}]}, {"id": 173, "name": "Woodford reserve", "category": "Whisky", "abv": 45.2, "blocks": [{"type": "text", "text": "Woodford Reserve est un bourbon américain emblématique, produit dans la distillerie historique de Woodford County, Kentucky. Ce bourbon est réputé pour son équilibre parfait et sa complexité, avec plus de 200 notes aromatiques détectables, allant des grains audacieux et du bois aux arômes sucrés, épicés, fruités et floraux."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de vanille, caramel, fruits secs et une touche de cacao."}, {"type": "text", "text": "En bouche : Saveurs riches de miel, épices douces, agrumes et chêne."}, {"type": "text", "text": "Finale : Longue et chaleureuse, avec des nuances boisées et légèrement sucrées."}, {"type": "text", "text": "Avec un taux d'alcool de 45,2 %, le Woodford Reserve est idéal pour être dégusté pur, sur glace ou dans des cocktails classiques comme l'Old Fashioned ou le Mint Julep."}]}, {"id": 174, "name": "Calvados pays d'auge Boulard", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": null, "blocks": [{"type": "text", "text": "Le Calvados Pays d'Auge Boulard est une référence prestigieuse parmi les calvados, produit exclusivement dans la région du Pays d'Auge en Normandie. Ce calvados est élaboré à partir des meilleurs cidres, puis distillé deux fois pour obtenir une complexité et une authenticité remarquables."}, {"type": "heading", "text": "Caractéristiques principales"}, {"type": "text", "text": "Appellation : AOC Calvados Pays d'Auge."}, {"type": "text", "text": "Processus : Double distillation pour une richesse aromatique."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de pomme mûre, vanille et une touche boisée."}, {"type": "text", "text": "En bouche : Saveurs équilibrées de fruits frais, épices douces et caramel."}, {"type": "text", "text": "Finale : Longue et élégante, avec des nuances de chêne et de pomme."}, {"type": "text", "text": "La maison Boulard, fondée en 1825, est pionnière dans l'art du calvados et propose également des éditions limitées innovantes, affinées dans des fûts de bourbon, de whisky américain ou même de chêne japonais Mizunara."}]}, {"id": 175, "name": "Roger groult 3 ans", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Roger Groult 3 ans est un calvados AOC Pays d'Auge, produit en Normandie par la célèbre maison Roger Groult, reconnue pour son savoir-faire artisanal transmis depuis cinq générations. Ce calvados est élaboré à partir de pommes à cidre soigneusement sélectionnées, distillé deux fois au feu de bois, puis vieilli pendant 3 ans dans des fûts de chêne."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes fraîches et fruitées de pomme acidulée, avec une touche crémeuse."}, {"type": "text", "text": "En bouche : Saveurs tendres de pomme cuite, vanille et une pointe de noisette."}, {"type": "text", "text": "Finale : Douce et légèrement mentholée, avec une belle fraîcheur."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, ce calvados est idéal pour être dégusté pur, en digestif, ou utilisé dans des cocktails."}]}, {"id": 176, "name": "Roger groult 8 ans", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 41.0, "blocks": [{"type": "text", "text": "Le Roger Groult 8 ans est un calvados AOC Pays d'Auge, produit en Normandie par la maison Roger Groult, reconnue pour son savoir-faire artisanal transmis depuis cinq générations. Ce calvados est élaboré à partir de pommes à cidre soigneusement sélectionnées, distillé deux fois au feu de bois, puis vieilli pendant 8 ans dans des fûts de chêne, ce qui lui confère une grande complexité aromatique."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de pomme confite, cannelle, vanille et une touche de miel."}, {"type": "text", "text": "En bouche : Saveurs riches et rondes de fruits mûrs, caramel et épices douces."}, {"type": "text", "text": "Finale : Longue et élégante, avec des nuances boisées et légèrement épicées."}, {"type": "text", "text": "Avec un taux d'alcool de 41 %, ce calvados est idéal pour être dégusté pur, en digestif, ou utilisé dans des cocktails sophistiqués."}]}, {"id": 177, "name": "Roger groult 12 ans", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 41.0, "blocks": [{"type": "text", "text": "Le Roger Groult 12 ans est un calvados AOC Pays d'Auge, produit en Normandie par la maison Roger Groult, reconnue pour son savoir-faire artisanal et son respect des traditions. Ce calvados est élaboré à partir de pommes à cidre soigneusement sélectionnées, distillé deux fois au feu de bois, puis vieilli pendant 12 ans dans des fûts de chêne, ce qui lui confère une grande richesse aromatique."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes florales, fruits à chair blanche, et épices douces."}, {"type": "text", "text": "En bouche : Saveurs équilibrées de fruits mûrs, caramel, et une touche boisée."}, {"type": "text", "text": "Finale : Longue et élégante, avec des nuances légèrement confites."}, {"type": "text", "text": "Avec un taux d'alcool de 41 %, ce calvados est idéal pour être dégusté pur, en digestif, ou accompagné de desserts au chocolat."}]}, {"id": 178, "name": "Roger groult hydromel", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 44.6, "blocks": [{"type": "text", "text": "Le Roger Groult Hydromel est une édition spéciale de calvados AOC Pays d'Auge, produite par la maison Roger Groult en Normandie. Ce calvados est unique car il est affiné dans des fûts ayant contenu de l'hydromel, ce qui lui confère des saveurs distinctives et une grande rondeur."}, {"type": "heading", "text": "Caractéristiques principales"}, {"type": "text", "text": "Vieillissement : Affinage en fûts d'hydromel après plusieurs années en fûts de chêne."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de fruits secs, pomme mûre, miel et une touche florale."}, {"type": "text", "text": "En bouche : Saveurs riches de pommeau, caramel, et une douceur miellée."}, {"type": "text", "text": "Finale : Longue et gourmande, avec des nuances boisées et légèrement épicées."}, {"type": "text", "text": "Avec un taux d'alcool de 44,6 %, cette expression est idéale pour les amateurs de calvados recherchant une expérience unique."}]}, {"id": 179, "name": "Lauriston fine Domfrontais", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": null, "blocks": [{"type": "text", "text": "Le Lauriston Fine Domfrontais est un calvados produit dans la région du Domfrontais, en Normandie. Ce calvados se distingue par l'utilisation d'un mélange de pommes et de poires, ce qui lui confère une douceur et une complexité uniques. La maison Comte Louis de Lauriston, qui produit ce calvados, est réputée pour son respect des traditions et son savoir-faire artisanal."}, {"type": "heading", "text": "Caractéristiques principales"}, {"type": "text", "text": "Appellation : AOC Calvados Domfrontais."}, {"type": "text", "text": "Composition : Mélange de pommes et de poires. ( cidre )"}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes fruitées de pomme et de poire, avec une touche florale."}, {"type": "text", "text": "En bouche : Saveurs fraîches et équilibrées, avec une douceur naturelle et une pointe d'épices."}, {"type": "text", "text": "Finale : Légère et élégante, avec des nuances boisées."}, {"type": "text", "text": "Ce calvados est idéal pour être dégusté pur, en apéritif ou en digestif, et peut également être utilisé dans des cocktails."}]}, {"id": 180, "name": "Lauriston 100% poire", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Lauriston 100% Poire est une eau-de-vie unique produite dans la région du Domfrontais, en Normandie, sous l'appellation Calvados Domfrontais. Ce spiritueux est élaboré exclusivement à partir de poiré (cidre de poire), distillé en alambic à colonne, ce qui lui confère une fraîcheur et une élégance remarquables."}, {"type": "heading", "text": "Caractéristiques principales"}, {"type": "text", "text": "Couleur : Or clair."}, {"type": "text", "text": "Au nez : Arômes frais et fruités de poires mûres et de fruits blancs comme la pêche."}, {"type": "text", "text": "En bouche : Saveurs délicates, juteuses et équilibrées, avec une belle vivacité."}, {"type": "text", "text": "Finale : Élégante et persistante, avec une touche légèrement acidulée."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, cette eau-de-vie est idéale pour être dégustée pure, en apéritif ou en digestif."}]}, {"id": 181, "name": "Marie Jo Rosemont", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 42.0, "blocks": [{"type": "text", "text": "La Marie-Jo Rosemont est une eau-de-vie de pomme produite par la Distillerie de Montréal, située au Québec. Cette eau-de-vie est élaborée à partir de pommes soigneusement sélectionnées, offrant une expérience gustative unique et raffinée. 42%."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes fruitées de pomme fraîche et une touche florale."}, {"type": "text", "text": "En bouche : Saveurs équilibrées de pomme mûre, caramel et une pointe de vanille."}, {"type": "text", "text": "Finale : Douce et élégante, avec des nuances boisées."}, {"type": "text", "text": "La Marie-Jo Rosemont est idéale pour être dégustée pure ou utilisée dans des cocktails créatifs."}]}, {"id": 182, "name": "Cognac 1^er^ cru ambré pierre ferrand", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Pierre Ferrand 1er Cru Ambré est un cognac raffiné produit dans la région de la Grande Champagne, considérée comme le terroir le plus prestigieux pour le cognac. Ce spiritueux est élaboré à partir de raisins Ugni Blanc et vieilli pendant environ 10 ans dans des fûts de chêne français, ce qui lui confère une complexité et une douceur remarquables."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes d'orange, de fleurs (rose, violette) et une touche de vanille."}, {"type": "text", "text": "En bouche : Saveurs équilibrées de fruits secs, miel, caramel et une pointe boisée."}, {"type": "text", "text": "Finale : Longue et élégante, avec des nuances florales et légèrement épicées."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, ce cognac est idéal pour être dégusté pur ou utilisé dans des cocktails sophistiqués."}]}, {"id": 183, "name": "Cognac beaulon XO", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Château de Beaulon XO Premier est un cognac d'exception, produit dans la région des Fins Bois en France. Ce cognac est élaboré à partir de cépages rares tels que la Folle Blanche, le Colombard, et le Montils, qui apportent une richesse aromatique unique. Vieilli pendant 12 ans, il dépasse les exigences minimales pour un XO, offrant une profondeur et une complexité remarquables."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de pain grillé, amande, pêche de vigne et cannelle."}, {"type": "text", "text": "En bouche : Saveurs riches et fruitées d'orange fraîche, avec une finale longue et élégante."}, {"type": "text", "text": "Finale : Complexe et séduisante, avec une touche boisée et épicée."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, ce cognac est idéal pour être dégusté pur, en digestif, ou accompagné de desserts raffinés."}]}, {"id": 184, "name": "Cognac camus ile de ré", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Camus Île de Ré est un cognac unique, produit par la maison Camus, qui met en valeur le terroir exceptionnel de l'Île de Ré, située au large de la côte ouest de la France. Ce cognac se distingue par son caractère maritime, influencé par le climat océanique et les sols calcaires de l'île. Il est élaboré principalement à partir du cépage Ugni Blanc, qui est le cépage dominant utilisé pour la production de cognac"}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes fraîches et marines, avec des touches de fruits secs et de vanille."}, {"type": "text", "text": "En bouche : Saveurs équilibrées de fruits mûrs, caramel, et une subtile salinité."}, {"type": "text", "text": "Finale : Longue et élégante, avec des nuances boisées et légèrement iodées."}, {"type": "text", "text": "Le Camus Île de Ré est disponible en plusieurs expressions, comme le Fine Island ou le Double Matured, chacune offrant une expérience gustative unique. Avec un taux d'alcool de 40 %, il est idéal pour être dégusté pur ou accompagné de fruits de mer."}]}, {"id": 185, "name": "Cognac reviseur XO", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Réviseur XO est un cognac raffiné, produit dans la région de la Petite Champagne, en France. Ce cognac est élaboré à partir de raisins Ugni Blanc, distillés dans de petits alambics pour préserver la richesse aromatique, puis vieilli pendant 10 ans dans des fûts de chêne, ce qui lui confère une grande complexité et profondeur."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de vanille, fruits secs, et une touche boisée."}, {"type": "text", "text": "En bouche : Saveurs équilibrées de caramel, réglisse, et une pointe de rancio."}, {"type": "text", "text": "Finale : Longue et élégante, avec des nuances épicées et boisées."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, ce cognac est idéal pour être dégusté pur, en digestif, ou accompagné d'un cigare pour une expérience encore plus sophistiquée."}]}, {"id": 186, "name": "Cognac Naud VSOP", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Naud VSOP est un cognac raffiné produit par la maison Famille Naud, située dans la région de Poitou-Charentes, en France. Ce cognac est élaboré à partir de raisins ugni blanc soigneusement sélectionnés, distillés dans de petits alambics en cuivre, puis vieilli dans des fûts de chêne français pour développer une richesse aromatique et une rondeur exceptionnelle."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes élégantes de vanille, fruits secs, et épices douces comme la cannelle et la muscade."}, {"type": "text", "text": "En bouche : Saveurs fruitées d'orange et de pêche, avec une touche boisée subtile."}, {"type": "text", "text": "Finale : Souple et séduisante, parfaite pour les amateurs de cognacs équilibrés."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, le Naud VSOP peut être dégusté pur ou utilisé dans des cocktails classiques comme le side car ou le Sazerac."}]}, {"id": 187, "name": "Cognac Montifaud XO", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Château de Montifaud XO est un cognac d'exception, produit dans la région de la Petite Champagne, en France. Ce cognac est élaboré à partir de raisins Ugni Blanc, distillés avec soin, puis vieillis pendant environ 30 ans dans des fûts de chêne, ce qui lui confère une grande complexité et une profondeur aromatique unique."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de fruits secs, amandes grillées, épices douces comme la muscade, et une touche de safran."}, {"type": "text", "text": "En bouche : Saveurs équilibrées de fruits confits, caramel, et une pointe de rancio charentais."}, {"type": "text", "text": "Finale : Longue et élégante, avec des nuances boisées et légèrement épicées."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, ce cognac est idéal pour être dégusté pur, en digestif, ou accompagné de desserts comme une crème brûlée ou des pralines."}]}, {"id": 188, "name": "Cognac segonzac VSOP", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": null, "blocks": [{"type": "text", "text": "Le Cognac Pierre de Segonzac VSOP est un cognac raffiné provenant de la région de la Grande Champagne, classée comme 1er Cru de Cognac. Ce cognac est élaboré à partir du cépage Ugni Blanc, distillé sur lies fines pour préserver la richesse aromatique, puis vieilli dans des fûts de chêne Limousin."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de mandarine fraîche, vanille, et une touche florale."}, {"type": "text", "text": "En bouche : Saveurs équilibrées d'agrumes, d'amande et de bois de chêne."}, {"type": "text", "text": "Finale : Douce et agréable, avec une belle longueur en bouche."}, {"type": "text", "text": "Ce cognac est idéal pour être dégusté pur ou utilisé dans des cocktails sophistiqués."}]}, {"id": 189, "name": "Cognac segonzac XO", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": null, "blocks": [{"type": "text", "text": "Le Cognac Pierre de Segonzac XO est un cognac d'exception provenant de la région de la Grande Champagne, classée 1er Cru de Cognac. Ce cognac est élaboré exclusivement à partir du cépage Ugni Blanc, distillé sur lies fines pour préserver une richesse aromatique unique, puis vieilli dans des fûts de chêne Limousin."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Couleur : Acajou profond."}, {"type": "text", "text": "Au nez : Arômes intenses de figue, abricot, jasmin, noix et coing, avec des notes de pain grillé et de chocolat."}, {"type": "text", "text": "En bouche : Saveurs riches et complexes de fruits secs, rancio charentais, et une touche boisée."}, {"type": "text", "text": "Finale : Longue et persistante, avec une élégance typique des vieux cognacs de Grande Champagne."}, {"type": "text", "text": "Ce cognac est idéal pour être dégusté pur, en digestif, ou accompagné de desserts comme une tarte tatin ou une glace à la vanille."}]}, {"id": 190, "name": "Cognac Courvoisier VS", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Courvoisier VS (Very Special) est un cognac emblématique, produit dans la région de Cognac, en France. Il est élaboré à partir d'un assemblage d'eaux-de-vie soigneusement sélectionnées, principalement issues des crus de Fins Bois et de Petite Champagne, et vieillies pendant au moins 2 ans dans des fûts de chêne."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes fruitées de poire et de raisin, avec une touche florale et une pointe de vanille."}, {"type": "text", "text": "En bouche : Saveurs équilibrées de fruits mûrs, caramel et une subtile influence boisée."}, {"type": "text", "text": "Finale : Douce et légère, avec une belle fraîcheur."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, le Courvoisier VS est idéal pour être dégusté pur, sur glace, ou utilisé dans des cocktails classiques comme le Sidecar, le French 75au cognac ou un champagne cocktail."}]}, {"id": 191, "name": "Brandy St Remy VSOP", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "blocks": [{"type": "text", "text": "Le St-Rémy VSOP est un brandy français emblématique, produit dans la région du Sud-Ouest de la France. Ce spiritueux est élaboré à partir de raisins soigneusement sélectionnés, distillés avec précision, puis vieilli dans des fûts de chêne français pour développer une richesse aromatique et une douceur veloutée."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes fruitées de prune et de raisin, avec une touche florale et des nuances de vanille."}, {"type": "text", "text": "En bouche : Saveurs équilibrées de fruits mûrs, caramel et une pointe d'épices."}, {"type": "text", "text": "Finale : Douce et élégante, avec une belle persistance."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, le St-Rémy VSOP est polyvalent : il peut être dégusté pur, sur glace, ou utilisé dans des cocktails classiques comme le Brandy Alexander ou le brandy flip."}]}, {"id": 192, "name": "Armagnac château de laubade 2004", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Château de Laubade 2004 est un Bas-Armagnac millésimé, produit dans la région de Gascogne, en France. Ce spiritueux est élaboré à partir de cépages tels que le Baco, l'Ugni Blanc, le Colombard, et la Folle Blanche, chacun distillé séparément pour préserver leurs caractéristiques uniques."}, {"type": "heading", "text": "Caractéristiques principales"}, {"type": "text", "text": "Vieillissement : Entre 15 et 50 ans en fûts de chêne de Gascogne, offrant une grande finesse et complexité."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes d'agrumes, vanille, et boisées."}, {"type": "text", "text": "En bouche : Saveurs élégantes de fruits secs, vanille, et bois grillé."}, {"type": "text", "text": "Finale : Longue et sèche, avec une belle acidité et des nuances de raisins secs."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, cet Armagnac est idéal pour être dégusté pur, en digestif, ou accompagné de desserts raffinés."}]}, {"id": 193, "name": "Armagnac Recapet", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": null, "blocks": [{"type": "text", "text": "L'Armagnac Récapet Targuerie VSOP est un spiritueux raffiné provenant de la région du Bas-Armagnac, en France. Ce VSOP (Very Special Old Pale) est élaboré à partir du cépage Baco Blanc, typique de l'appellation, et vieilli dans des fûts de chêne pour développer une richesse aromatique et une belle complexité."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes d'abricot, vanille bourbon, et des nuances pâtissières comme le caramel et les fruits à coque."}, {"type": "text", "text": "En bouche : Une texture veloutée avec des saveurs de pruneau, épices douces, et une touche de cire d'abeille."}, {"type": "text", "text": "Finale : Longue et équilibrée, avec une belle rondeur."}, {"type": "text", "text": "Cet armagnac est idéal pour être dégusté pur ou accompagné de desserts comme une tarte aux fruits ou des pralines."}]}, {"id": 194, "name": "Armagnac dartigalongue", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": null, "blocks": [{"type": "text", "text": "L'Armagnac Dartigalongue est une maison historique fondée en 1838, située à Nogaro, dans la région du Bas-Armagnac, en Gascogne. Elle est reconnue pour son savoir-faire artisanal transmis depuis plusieurs générations, et ses armagnacs sont élaborés à partir de cépages typiques comme le Baco, l'Ugni Blanc, et la Folle Blanche."}, {"type": "heading", "text": "Caractéristiques principales"}, {"type": "text", "text": "Distillation : Réalisée dans des alambics armagnacais traditionnels pour préserver les arômes."}, {"type": "text", "text": "Vieillissement : En fûts de chêne gascon, ce qui confère des notes boisées et une belle complexité."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de fruits secs, vanille, pruneaux, et une touche épicée."}, {"type": "text", "text": "En bouche : Saveurs riches de caramel, fruits confits, et une pointe de rancio."}, {"type": "text", "text": "Finale : Longue et élégante, avec des nuances boisées et florales."}, {"type": "text", "text": "La maison propose une large gamme, allant des VSOP aux millésimes rares, comme le célèbre millésime 1848, considéré comme l'un des plus anciens de la région."}]}, {"id": 195, "name": "Fine de bourgogne", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": null, "blocks": [{"type": "text", "text": "La Fine de Bourgogne est une eau-de-vie prestigieuse issue de la distillation des vins de Bourgogne, plus précisément des lies fines provenant des soutirages des vins. Elle bénéficie d'une Appellation d'Origine Contrôlée (AOC) depuis 2011."}, {"type": "heading", "text": "Caractéristiques principales"}, {"type": "text", "text": "Zone géographique : Produite dans 388 communes réparties sur les départements de la Côte-d'Or, du Rhône, de la Saône-et-Loire et de l'Yonne"}, {"type": "text", "text": "Vieillissement : Obligatoirement vieilli pendant au moins 3 ans en fûts de chêne, ce qui lui confère douceur et complexité."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes boisées et fruitées."}, {"type": "text", "text": /* ---------- normalisation & synonymes ---------- */
function stripAccents(s){
  return s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'');
}
function norm(s){
  return stripAccents((s||'').toLowerCase()).replace(/[^a-z0-9%.,\s]/g,' ').replace(/\s+/g,' ').trim();
}

const STOPWORDS = new Set(['le','la','les','un','une','des','de','du','et','ou','pour','avec','sans','qui','que','dans','sur','au','aux','en','a','plus','moins','tres','peu','ce','cette','ces','je','cherche','veux','voudrais','quelque','chose','svp','stp']);

// groupes de synonymes : chaque mot de la requête est étendu par son groupe

  ['gin','gins'],

  ['tequila','mezcal','agave'],

  ['liqueur','liqueurs','digestif','apero','aperitif'],
  ['vanille','vanillee'],
  ['caramel','toffee'],
  ['cacao','chocolat'],
  ['epicee','poivre','poivree','cannelle'],
];
function expandTerm(t){
  const out = new Set([t]);
  for(const group of SYNONYMS){
    if(group.some(g => g.includes(t) || t.includes(g))){
      group.forEach(g=>out.add(g));
    }
  }
  return [...out];
}

/* ---------- contraintes numériques (abv) ---------- */
function parseConstraints(q){
  const c = { maxAbv:null, minAbv:null };
  let m;
  if(m = q.match(/(?:moins de|sous|inferieur a|max)\s*(\d{1,2})\s*%?/)) c.maxAbv = parseFloat(m[1]);
  if(m = q.match(/(?:plus de|au dessus de|superieur a|min)\s*(\d{1,2})\s*%?/)) c.minAbv = parseFloat(m[1]);
  if(/faible en alcool|peu alcoolis|leger en alcool/.test(q)) c.maxAbv = c.maxAbv ?? 20;
  if(/fort en alcool|tres alcoolis|puissant/.test(q)) c.minAbv = c.minAbv ?? 35;
  return c;
}

}));

function escapeRe(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
}
// regex sur mots entiers uniquement : "gin" ne doit pas matcher "gingembre"

  const t = term.trim();
  const hasSpace = t.includes(' ');
  const esc = escapeRe(t).replace(/ +/g,'\\s+');
  const suffix = hasSpace ? '' : 's?'; // tolère un pluriel simple sur un terme d'un seul mot
  return new RegExp('\\b' + esc + suffix + '\\b', flags || '');
}
function wordMatch(text, term){
  return termRegex(term).test(text);
}

function score(product, terms){
  let s = 0;
  for(const t of terms){
    if(!t || t.length < 2) continue;
    const nameHit = wordMatch(product.nName, t);
    if(nameHit) s += product.nName.startsWith(t) ? 8 : 5;
    if(wordMatch(product.nCategory, t)) s += 3;
    if(wordMatch(product.nDesc, t)) s += 1;
  }
  return s;
}

function highlight(text, terms){
  let out = text;
  const uniq = [...new Set(terms.filter(t=>t.length>2))].sort((a,b)=>b.length-a.length);
  for(const t of uniq){
    const re = termRegex(t, 'gi');
    out = out.replace(re, '<mark>$&</mark>');
  }
  return out;
}

/* ---------- état ---------- */
let activeCategory = null;
let query = '';

function render(){
  const q = norm(query);
  const rawTerms = q.split(' ').filter(t => t && !STOPWORDS.has(t));
  const constraints = parseConstraints(q);
  let terms = [];
  rawTerms.forEach(t => expandTerm(t).forEach(e => terms.push(e)));
  if(terms.length===0 && q) terms = [q];

  let list = indexed.slice();

  if(activeCategory){
    list = list.filter(p => p.category === activeCategory);
  }
  if(constraints.maxAbv !== null){
    list = list.filter(p => p.abv === null || p.abv <= constraints.maxAbv);
  }
  if(constraints.minAbv !== null){
    list = list.filter(p => p.abv === null || p.abv >= constraints.minAbv);
  }

  if(terms.length){
    list = list.map(p => ({p, s: score(p, terms)}))
               .filter(x => x.s > 0)
               .sort((a,b)=> b.s - a.s)
               .map(x=>x.p);
  } else {
    list = list.sort((a,b)=> a.name.localeCompare(b.name, 'fr'));
  }

  const resultsEl = document.getElementById('results');
  const emptyEl = document.getElementById('empty');
  const countEl = document.getElementById('count');

  countEl.textContent = list.length + (list.length>1 ? ' résultats' : ' résultat');

  if(list.length===0){
    resultsEl.innerHTML='';
    emptyEl.style.display='block';
    return;
  }
  emptyEl.style.display='none';

  resultsEl.innerHTML = list.map(p=>{
    const nameH = terms.length ? highlight(p.name, terms) : p.name;
    const abvLabel = p.abv !== null ? p.abv + '%' : '—';
    const firstText = p.blocks.find(b=>b.type==='text');
    const summaryH = firstText ? (terms.length ? highlight(firstText.text, terms) : firstText.text) : '';
    const fullBlocksHtml = p.blocks.map(b=>{
      const h = terms.length ? highlight(b.text, terms) : b.text;
      return b.type === 'heading'
        ? `<div class="blk-heading">${h}</div>`
        : `<p class="blk-text">${h}</p>`;
    }).join('');
    return `<div class="card" data-id="${p.id}">
      <div class="card-top">
        <div class="card-name">${nameH}</div>
        <div class="card-meta"><span class="abv">${abvLabel}</span></div>
      </div>
      <div class="category">${p.category}</div>
      <div class="card-desc card-desc-summary">${summaryH}</div>
      <div class="card-desc-full">${fullBlocksHtml}</div>
    </div>`;
  }).join('');

  resultsEl.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('click', ()=> el.classList.toggle('expanded'));
  });
}

function renderChips(){
  const chipsEl = document.getElementById('chips');
  chipsEl.innerHTML = ['Toutes', ...CATEGORIES].map(c=>{
    const isActive = (c==='Toutes' && !activeCategory) || c===activeCategory;
    return `<button class="chip ${isActive?'active':''}" data-cat="${c}">${c}</button>`;
  }).join('');
  chipsEl.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      const cat = el.dataset.cat;
      activeCategory = (cat==='Toutes') ? null : cat;
      renderChips();
      render();
    });
  });
}

const searchInput = document.getElementById('search');
searchInput.addEventListener('input', (e)=>{
  query = e.target.value;
  render();
});
searchInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    e.preventDefault();
    searchInput.blur(); // ferme le clavier virtuel une fois la recherche validée
  }
});

renderChips();
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
