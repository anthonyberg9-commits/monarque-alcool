<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<title>Carte des alcools</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17110d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root{
    --bg: #17110d;
    --bg-elevated: #201812;
    --bg-card: #1c1510;
    --line: #3a2c20;
    --line-soft: #2a2019;
    --copper: #c97c4a;
    --amber: #e8a857;
    --text: #f2e9dd;
    --text-muted: #ab9a83;
    --text-faint: #6f6152;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,124,74,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .ui, input, button, .chip, .meta, .count, .empty-state, .hint{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }

  header.top{
    position:sticky; top:0; z-index:10;
    background: linear-gradient(180deg, var(--bg) 60%, rgba(23,17,13,0.94) 100%);
    backdrop-filter: blur(6px);
    border-bottom:1px solid var(--line);
    padding: 22px 20px 16px;
  }
  .header-inner{ max-width:820px; margin:0 auto; }
  .title-row{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    margin-bottom:16px;
  }
  h1{
    font-size:1.5rem; margin:0; font-weight:600; letter-spacing:0.01em;
    color:var(--text);
  }
  h1 span{ color:var(--copper); }
  .subtitle{ color:var(--text-faint); font-size:0.8rem; margin:2px 0 0; }

  .search-wrap{ position:relative; }
  input#search{
    width:100%;
    background: var(--bg-elevated);
    border:1px solid var(--line);
    color:var(--text);
    font-size:1rem;
    padding: 13px 44px 13px 16px;
    border-radius:10px;
    outline:none;
    transition: border-color .15s ease;
  }
  input#search::placeholder{ color:var(--text-faint); }
  input#search:focus{ border-color:var(--copper); }
  .search-icon{
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    color:var(--text-faint); pointer-events:none; font-size:1rem;
  }

  .hint{
    color:var(--text-faint); font-size:0.75rem; margin-top:8px; line-height:1.5;
  }

  .chips{
    display:flex; gap:8px; overflow-x:auto; margin-top:14px; padding-bottom:2px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-muted);
    padding:6px 13px;
    border-radius:999px;
    font-size:0.78rem;
    cursor:pointer;
    white-space:nowrap;
    transition: all .15s ease;
  }
  .chip:hover{ border-color:var(--copper); color:var(--text); }
  .chip.active{
    background:var(--copper); border-color:var(--copper); color:#1a1108; font-weight:600;
  }

  main{ max-width:820px; margin:0 auto; padding:20px 20px 80px; }

  .count{
    color:var(--text-faint); font-size:0.78rem; margin:4px 4px 16px;
    letter-spacing:0.02em;
  }

  .results{ display:flex; flex-direction:column; gap:2px; }

  .card{
    padding:18px 16px;
    border-bottom:1px solid var(--line-soft);
    cursor:pointer;
  }
  .card:first-child{ border-top:1px solid var(--line-soft); }
  .card-top{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  }
  .card-name{
    font-size:1.12rem; font-weight:600; color:var(--text);
    letter-spacing:0.01em;
  }
  .card-name mark, .card-desc mark{
    background:transparent; color:var(--amber); font-weight:700;
  }
  .card-meta{
    display:flex; align-items:center; gap:8px; flex:0 0 auto;
  }
  .abv{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:0.72rem; color:var(--copper); border:1px solid var(--line);
    padding:2px 8px; border-radius:999px; white-space:nowrap;
  }
  .category{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:0.72rem; color:var(--text-faint); margin-top:3px;
  }
  .card-desc-summary{
    font-size:0.89rem; line-height:1.55; color:var(--text-muted);
    margin-top:8px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card.expanded .card-desc-summary{ display:none; }

  .card-desc-full{ display:none; margin-top:8px; }
  .card.expanded .card-desc-full{ display:block; }

  .blk-heading{
    font-size:0.72rem; font-weight:700; letter-spacing:0.03em;
    color:var(--amber); margin:14px 0 6px;
  }
  .blk-heading:first-child{ margin-top:0; }
  .blk-text{
    font-size:0.89rem; line-height:1.6; color:var(--text-muted);
    margin:0 0 10px;
  }
  .blk-text:last-child{ margin-bottom:0; }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-faint);
  }
  .empty-state .big{ font-size:2rem; margin-bottom:10px; }
  .empty-state p{ font-size:0.9rem; max-width:360px; margin:6px auto 0; line-height:1.5; }

  @media (max-width:480px){
    h1{ font-size:1.25rem; }
    .card-name{ font-size:1.03rem; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="header-inner">
    <div class="title-row">
      <div>
        <h1>Carte des <span>alcools</span></h1>
        <p class="subtitle">208 spiritueux · recherche interne</p>
      </div>
    </div>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="ex : un amer italien fruité, un gin floral, sous 20% d'alcool…" autocomplete="off">
      <span class="search-icon">⌕</span>
    </div>
    <p class="hint">Décris ce que tu cherches en langage naturel — arômes, type de spiritueux, degré d'alcool, cocktail associé.</p>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main>
  <div class="count" id="count"></div>
  <div class="results" id="results"></div>
  <div class="empty-state" id="empty" style="display:none;">
    <div class="big">🥃</div>
    <p>Aucun résultat. Essaie une autre formulation, ou un terme plus général — un type de spiritueux, une note aromatique, une région.</p>
  </div>
</main>

<script>
const PRODUCTS = [{"id": 1, "name": "Amermelade", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 18.0, "blocks": [{"type": "text", "text": "L'Amermelade est un apéritif québécois unique, créé par Les Subversifs. C'est le tout premier apéritif amer fabriqué au Québec, s'inspirant des classiques italiens comme l'Aperol. Il est élaboré à partir de gentiane et de quinine, avec une vingtaine d'aromates locaux, tels que l'argousier, le vinaigrier et le myrique baumier. Son profil aromatique se distingue également par des notes d'agrumes, de rose et de gingembre, offrant une saveur à la fois complexe et raffinée."}, {"type": "text", "text": "Avec un taux d'alcool de 18 %, l'Amermelade se démarque par sa teneur en sucre plus modérée que celle de ses homologues italiens. Il peut être dégusté pur ou intégré dans des cocktails tels que le Spritz ou le Negroni."}]}, {"id": 2, "name": "Amernoire", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 31.0, "blocks": [{"type": "text", "text": "L'Amernoire est une liqueur amère québécoise produite par Les Subversifs. Ce spiritueux se distingue par sa couleur noire intense et son profil aromatique complexe. Avec un taux d'alcool de 31 %, il offre une expérience gustative riche et audacieuse. Son profil aromatique se caractérise par des notes de cacao, de café torréfié, de réglisse et d'épices, équilibrées par une légère amertume herbacée. Ces saveurs profondes et intenses en font un choix idéal pour des cocktails sophistiqués ou une dégustation pure."}]}, {"id": 3, "name": "Averna", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 29.0, "blocks": [{"type": "text", "text": "L'Averna, ou Amaro Averna, est une liqueur italienne douce-amère originaire de Sicile, produite depuis 1868 par le groupe Fratelli Averna. Avec un taux d'alcool de 29 %, cette liqueur est fabriquée à partir d'un mélange secret de 33 herbes, racines et écorces d'agrumes, dont la gentiane et la cannelle. Elle est également enrichie de caramel, ce qui lui confère sa couleur brun foncé et son goût légèrement sucré."}, {"type": "text", "text": "Son profil aromatique se distingue par des notes herbacées, de caramel et de cannelle, équilibrées par une amertume subtile. L'Averna peut être dégustée pure, avec des glaçons, ou utilisée dans des cocktails comme le Mojito italien ou le Vertigo."}]}, {"id": 4, "name": "Carciofo Faccia bruto", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 25.0, "blocks": [{"type": "text", "text": "Le Carciofo de Faccia Brutto est une liqueur amère artisanale produite à Brooklyn, New York. Inspirée par l'amour des saveurs amères, cette liqueur met en valeur l'artichaut dans toute sa splendeur. Elle est élaborée à partir d'un mélange de 19 herbes et plantes botaniques, dont la cannelle, le piment de la Jamaïque et la racine de pissenlit. Les artichauts frais, provenant de la Central Valley en Californie, sont macérés pendant 10 jours avec ces ingrédients, créant un profil aromatique riche et complexe."}, {"type": "text", "text": "Avec un taux d'alcool de 25 %, cette liqueur est légèrement sucrée grâce à l'utilisation de sucre de canne biologique. Ses notes de citron, de feuille de laurier et d'épices chaudes en font un choix idéal pour des cocktails comme le Carciofo Spritz ou le Bitter Giuseppe."}]}, {"id": 5, "name": "Lucano", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 28.0, "blocks": [{"type": "text", "text": "L'Amaro Lucano est une liqueur italienne emblématique, créée en 1894 par Pasquale Vena dans la petite ville de Pisticci, en Basilicate. Cette liqueur appartient à la catégorie des amari, des digestifs herbacés typiques de l'Italie. Avec un taux d'alcool de 28 %, l'Amaro Lucano est élaboré à partir d'une recette secrète combinant plus de 30 herbes et plantes botaniques soigneusement sélectionnées."}, {"type": "text", "text": "Son profil aromatique est complexe et équilibré, avec des notes herbacées, d'agrumes, de caramel et d'épices douces. Sa saveur est à la fois douce-amère, ce qui en fait un excellent choix pour être dégusté pur, sur glace, ou comme ingrédient dans des cocktails raffinés."}]}, {"id": 6, "name": "Amaro Meletti", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 32.0, "blocks": [{"type": "text", "text": "L'Amaro Meletti est une liqueur amère italienne produite dans la région des Marches, à Ascoli Piceno. Créée par la famille Meletti, cette liqueur est élaborée à partir d'une infusion de fruits, d'herbes et d'épices soigneusement sélectionnés. Avec un taux d'alcool de 32 %, elle se distingue par sa couleur ambrée et son goût équilibré, à la fois doux et légèrement amer."}, {"type": "text", "text": "Son profil aromatique est riche et complexe, avec des notes de caramel, de safran des Sibillini, de clou de girofle, de gentiane et d'écorce d'orange. Ces saveurs en font un excellent digestif, souvent dégusté pur, sur glace, ou même ajouté à des cocktails comme le Spritz ou le Sharpie Mustache."}]}, {"id": 7, "name": "Amaro montenegro", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 23.0, "blocks": [{"type": "text", "text": "L'Amaro Montenegro est une liqueur amère italienne emblématique, créée en 1885 par Stanislao Cobianchi à Bologne, en Italie. Avec un taux d'alcool de 23 %, cette liqueur est élaborée à partir d'un mélange secret de 40 plantes botaniques, incluant la vanille, les écorces d'orange et l'eucalyptus. Elle a été nommée en l'honneur de la princesse Elena du Monténégro."}, {"type": "text", "text": "Son profil aromatique est complexe et équilibré, combinant des notes herbacées, florales, épicées et légèrement sucrées. L'Amaro Montenegro est souvent décrite comme ayant une saveur douce-amère, parfaite pour être dégustée pure, sur glace, ou dans des cocktails comme le célèbre \"Montenegroni\" ou le \"Paper Plane\".( nous utilisons du amaro nonino pour nos paper plane mais on peut y mettre du montenegro )"}]}, {"id": 8, "name": "Amaro Nonino", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 35.0, "blocks": [{"type": "text", "text": "L'Amaro Nonino Quintessentia est une liqueur amère italienne raffinée, créée en 1992 par Benito Nonino, un distillateur de quatrième génération. Ce spiritueux se distingue par sa base unique de grappa, un brandy italien à base de marc de raisin, qui lui confère des notes fruitées distinctives. Avec un taux d'alcool de 35 %, il est élaboré à partir d'une infusion de plantes botaniques telles que l'orange amère, la gentiane, le safran, le tamarin et l'absinthe."}, {"type": "text", "text": "Son profil aromatique est complexe et équilibré, combinant des saveurs de caramel, d'orange, d'abricot, de vanille et d'épices herbacées. L'Amaro Nonino peut être dégusté pur, sur glace, ou intégré dans des cocktails comme le célèbre Paper Plane ou l'Amaro Spritz."}]}, {"id": 9, "name": "Amaro rabarbaro", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 16.0, "blocks": [{"type": "text", "text": "Le Rabarbaro Zucca est un amaro italien emblématique, créé en 1845 par Ettore Zucca à Milan. Contrairement à ce que son nom pourrait suggérer, il ne contient pas de courge (\"zucca\" en italien), mais tire son nom de son créateur. Cette liqueur est élaborée à partir d'une infusion de rhizomes de rhubarbe chinoise, combinée à des écorces d'orange amère, des graines de cardamome, du quinquina et un mélange secret d'herbes aromatiques."}, {"type": "text", "text": "Avec un taux d'alcool de 16 %, le Rabarbaro Zucca se distingue par son profil aromatique doux-amer, avec des notes herbacées, terreuses et légèrement épicées. Il est souvent consommé en apéritif, pur, sur glace, ou allongé avec de l'eau gazeuse. Il peut également être utilisé dans des cocktails pour ajouter une touche amère et équilibrée."}]}, {"id": 10, "name": "Amaro rucolino", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 30.0, "blocks": [{"type": "text", "text": "L'Amaro Rucolino est une liqueur amère unique, originaire de l'île d'Ischia, près de Naples, en Italie. Ce spiritueux artisanal est élaboré à partir de roquette (rucola en italien), qui lui confère son caractère herbacé distinctif. Avec un taux d'alcool de 30 %, il est souvent apprécié comme digestif après un repas."}, {"type": "text", "text": "Son profil aromatique est complexe et équilibré, mêlant des notes herbacées, légèrement épicées, et une amertume subtile. La roquette est macérée avec des ingrédients tels que le zeste de citron, la cannelle et les clous de girofle, créant une saveur à la fois fraîche et intense. L'Amaro Rucolino peut être dégusté pur, sur glace, ou utilisé dans des cocktails pour une touche originale."}]}, {"id": 11, "name": "Amaro vecchio del capo", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 35.0, "blocks": [{"type": "text", "text": "Le Vecchio Amaro del Capo est une liqueur amère italienne emblématique, produite par la distillerie familiale Caffo depuis 1915, dans la région de la Calabre, au sud de l'Italie. Avec un taux d'alcool de 35 %, cette liqueur est élaborée à partir d'une infusion de 29 herbes, fleurs, fruits et racines locales, soigneusement sélectionnées pour créer un équilibre parfait entre douceur et amertume."}, {"type": "text", "text": "Son profil aromatique est riche et complexe, avec des notes de mandarine, d'orange amère, de réglisse, de menthe poivrée, de camomille et d'autres plantes aromatiques. Il est recommandé de le déguster glacé, à une température de -20 °C, pour en apprécier pleinement les saveurs. Le Vecchio Amaro del Capo peut être consommé pur, en digestif, ou utilisé dans des cocktails comme le Capo Tonic ou le Capo Spritz."}]}, {"id": 12, "name": "Amaro Vero", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 30.0, "blocks": [{"type": "text", "text": "L'Amaro Vero est une liqueur amère artisanale produite par Caffè Vero en Italie. Ce spiritueux est élaboré selon des méthodes traditionnelles, avec une infusion de plantes botaniques soigneusement sélectionnées. Avec un taux d'alcool de 30 %, il se distingue par son profil aromatique harmonieux et équilibré, enrichi par des notes de café, grâce à l'utilisation d'extraits de café de haute qualité."}, {"type": "text", "text": "L'Amaro Vero est idéal comme digestif après un repas, servi pur ou sur glace. Il peut également être utilisé pour personnaliser des cocktails, ajoutant une touche raffinée et amère."}]}, {"id": 13, "name": "Aperol", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 11.0, "blocks": [{"type": "text", "text": "L'Aperol est une célèbre liqueur amère italienne créée en 1919 par les frères Barbieri à Padoue, en Italie. Avec son taux d'alcool relativement faible de 11 %, l'Aperol se distingue par son goût doux et équilibré ainsi que sa couleur orange vibrante, qui est devenue emblématique."}, {"type": "text", "text": "Son profil aromatique est dominé par des notes d'orange amère, de gentiane, de rhubarbe et d'herbes aromatiques, avec une touche subtilement sucrée. L'Aperol est particulièrement connu comme ingrédient principal de l'iconique Spritz, un cocktail facile à préparer qui marie Prosecco, Aperol et eau gazeuse, servi avec une tranche d'orange."}]}, {"id": 14, "name": "Benedictine", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 40.0, "blocks": [{"type": "text", "text": "La Bénédictine est une liqueur française emblématique, créée en 1863 par Alexandre Le Grand à Fécamp, en Normandie. Inspirée par des recettes monastiques anciennes, elle est élaborée à partir d'un mélange secret de 27 plantes, épices et herbes, dont certaines connues comme l'angélique, la cannelle, le clou de girofle, le safran et la vanille. Avec un taux d'alcool de 40 %, elle est à la fois riche et complexe."}, {"type": "text", "text": "Son profil aromatique se distingue par des notes herbacées, épicées et sucrées, avec une touche de miel et d'agrumes. La Bénédictine peut être dégustée pure, sur glace, ou utilisée dans des cocktails comme le célèbre B&B, qui mélange Bénédictine et brandy."}]}, {"id": 15, "name": "Byrrh", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 17.0, "blocks": [{"type": "text", "text": "Le Byrrh est un apéritif français emblématique, créé en 1866 à Thuir, dans les Pyrénées-Orientales, par les frères Pallade et Simon Violet. Cet apéritif est élaboré à partir d'un mélange de vin rouge, de mistelle (moût de raisin non fermenté additionné d'alcool) et de quinquina, une écorce connue pour ses propriétés médicinales. Avec un taux d'alcool de 17 %, le Byrrh se distingue par son goût doux-amer et ses notes herbacées et épicées."}, {"type": "text", "text": "Son profil aromatique est riche et complexe, avec des touches de fruits rouges, de café, de cacao et d'épices douces. Il est souvent consommé pur, sur glace, ou utilisé dans des cocktails pour une touche rétro et élégante."}]}, {"id": 16, "name": "Campari", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 25.0, "blocks": [{"type": "text", "text": "Le Campari est une célèbre liqueur italienne amère, créée en 1860 par Gaspare Campari à Novara, en Italie. Avec son taux d'alcool de 25 %, cette liqueur rouge vif est fabriquée à partir d'une recette secrète mêlant infusions d'herbes, fruits et épices. Sa couleur emblématique provient historiquement du carmin, bien que cette pratique ait évolué au fil du temps."}, {"type": "text", "text": "Son profil aromatique est complexe et intense, offrant des notes d'orange amère, de pamplemousse, de plantes aromatiques et une amertume prononcée. Le Campari est l'un des ingrédients principaux de cocktails classiques tels que le Negroni, l'Americano ou encore le Campari Spritz."}]}, {"id": 17, "name": "Chartreuse jaune", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 43.0, "blocks": [{"type": "text", "text": "La Chartreuse Jaune est une liqueur française emblématique, créée en 1840 par les moines de la Grande Chartreuse, près de Grenoble. Elle est élaborée à partir d'une recette secrète contenant 130 plantes, fleurs, écorces, racines et épices, soigneusement sélectionnées et macérées pour obtenir ses saveurs uniques. Avec un taux d'alcool de 43 %, elle est plus douce et moins puissante que la Chartreuse Verte."}, {"type": "text", "text": "Son profil aromatique est riche et moelleux, avec des notes de miel, d'épices douces, de curcuma, d'agrumes et d'anis. Sa couleur jaune naturelle provient de certains ingrédients spécifiques, comme le safran. La Chartreuse Jaune peut être dégustée pure, sur glace, ou utilisée dans des cocktails pour apporter une touche subtile et raffinée."}]}, {"id": 18, "name": "Chartreuse verte", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 55.0, "blocks": [{"type": "text", "text": "La Chartreuse Verte est une liqueur française emblématique, fabriquée par les moines de la Grande Chartreuse depuis 1764. Elle est célèbre pour son intense couleur verte naturelle, obtenue grâce aux plantes utilisées dans sa fabrication. Comme sa version jaune, elle est élaborée à partir d'une recette secrète contenant 130 plantes, fleurs, écorces, racines et épices, maîtrisée uniquement par deux moines à la fois. Avec un taux d'alcool de 55 %, elle est plus forte et plus herbacée que la Chartreuse Jaune."}, {"type": "text", "text": "Son profil aromatique est puissant et complexe, avec des notes herbacées, mentholées, épicées et légèrement sucrées. La Chartreuse Verte peut être dégustée pure, sur glace, ou utilisée dans des cocktails classiques comme le Last Word ou le Bijou, où elle ajoute une profondeur et une fraîcheur remarquables."}]}, {"id": 19, "name": "China china", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 40.0, "blocks": [{"type": "text", "text": "Le China-China est une liqueur amère française emblématique produite par la Maison Bigallet, fondée en 1872 dans les Alpes. Son nom vient du quinquina (\"china\" en espagnol) utilisé dans sa recette, un ingrédient apprécié pour ses propriétés médicinales et sa saveur amère. Avec un taux d'alcool de 40 %, cette liqueur est élaborée à partir d'écorces d'orange amère et douce, d'extraits de quinquina et d'un mélange secret de plantes et d'épices."}, {"type": "text", "text": "Son profil aromatique est à la fois complexe et équilibré, mêlant des notes d'agrumes confits, d'épices chaudes comme la cannelle et la muscade, et une légère amertume herbacée. Le China-China peut être dégusté pur, sur glace, ou utilisé dans des cocktails pour ajouter une profondeur aromatique unique."}]}, {"id": 20, "name": "Cynar", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 16.5, "blocks": [{"type": "text", "text": "Le Cynar est une liqueur amère italienne emblématique, créée en 1952 et produite par le groupe Campari. Avec un taux d'alcool de 16,5 %, il se distingue par son ingrédient principal : les feuilles d'artichaut, qui lui donnent son nom (inspiré du mot latin Cynara). Cette liqueur est également enrichie par une infusion de 13 herbes et plantes botaniques, offrant un profil aromatique unique."}, {"type": "text", "text": "Son goût est doux-amer, avec des notes végétales, herbacées, et une touche de caramel et de toffee. Le Cynar est souvent consommé pur, sur glace, ou utilisé dans des cocktails comme le Cynar Spritz ou le Cynar Negroni, où il apporte une profondeur et une amertume équilibrée."}]}, {"id": 21, "name": "Drambuie", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Drambuie est une liqueur écossaise emblématique, riche en histoire et en saveurs. Créée au XVIIIᵉ siècle, elle est étroitement liée à l'héritage du prince Charles Édouard Stuart, également connu sous le nom de Bonnie Prince Charlie. Le nom \"Drambuie\" vient de l'expression gaélique An Dram Buidheach, qui signifie \"la boisson qui satisfait\"."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, cette liqueur est élaborée à partir d'un mélange de whisky écossais vieilli, de miel de bruyère, d'herbes aromatiques et d'épices. Son profil aromatique est doux et complexe, avec des notes de miel, de caramel, d'agrumes et une touche légèrement épicée, évoquant la cannelle et la muscade."}, {"type": "text", "text": "Le Drambuie est souvent dégusté pur, sur glace ou comme ingrédient dans des cocktails classiques tels que le Rusty Nail, où il est mélangé avec du whisky écossais."}]}, {"id": 22, "name": "Fernet Branca", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 39.0, "blocks": [{"type": "text", "text": "Le Fernet-Branca est une liqueur amère italienne emblématique, créée en 1845 par Bernardino Branca à Milan. Avec un taux d'alcool de 39 %, cette liqueur est élaborée à partir d'une recette secrète comprenant 27 herbes, racines et épices provenant du monde entier, telles que la gentiane, la rhubarbe, l'aloès, la camomille, la myrrhe et le safran. Elle est vieillie pendant un an en foudres de chêne, ce qui contribue à son profil aromatique unique."}, {"type": "text", "text": "Son goût est intense et complexe, avec des notes herbacées, terreuses, épicées et une amertume prononcée. Le Fernet-Branca est souvent consommé comme digestif, pur ou sur glace, mais il est également utilisé dans des cocktails classiques comme le Hanky Panky ou simplement mélangé avec du cola, une combinaison particulièrement populaire en Argentine."}]}, {"id": 23, "name": "Frangelico", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 20.0, "blocks": [{"type": "text", "text": "Le Frangelico est une liqueur italienne sucrée et aromatique, fabriquée dans la région du Piémont. Avec un taux d'alcool de 20 %, elle est célèbre pour son goût distinctif de noisette grillée. La recette inclut des noisettes Tonda Gentile, originaires de cette région, combinées à des extraits naturels de cacao, de vanille et d'autres plantes botaniques. Le mélange est ensuite adouci avec du sucre et alcoolisé pour créer une saveur riche et douce."}, {"type": "text", "text": "Son profil aromatique se caractérise par des notes intenses de noisette, équilibrées par des touches de chocolat et de vanille, avec une finition légèrement crémeuse. Le Frangelico peut être dégusté pur, sur glace, ou utilisé dans des desserts, ainsi que dans des cocktails tels que le Nutty Russian ou le Hazelnut Martini."}]}, {"id": 24, "name": "Galliano", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 42.3, "blocks": [{"type": "text", "text": "Le Galliano est une liqueur italienne historique, créée en 1896 par Arturo Vaccari à Livourne, en Toscane. Avec son taux d'alcool de 42,3 %, cette liqueur à la couleur dorée emblématique est élaborée à partir d'un mélange unique d'herbes, d'épices et de plantes botaniques, dont la vanille, la cannelle, le genièvre, la menthe et l'anis. Le résultat est un profil aromatique riche et complexe, à la fois sucré et épicé."}, {"type": "text", "text": "Son goût distinctif de vanille est équilibré par des notes herbacées et légèrement citronnées. Le Galliano est souvent utilisé dans des cocktails classiques comme le Harvey Wallbanger (vodka, jus d'orange et Galliano) ou le Golden Cadillac (Galliano, crème et liqueur de cacao)."}]}, {"id": 25, "name": "Jagermeister", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 35.0, "blocks": [{"type": "text", "text": "Le Jägermeister est une liqueur allemande emblématique, créée en 1934 par Curt Mast. Avec un taux d'alcool de 35 %, cette liqueur est fabriquée à partir d'une recette secrète comprenant 56 herbes, épices, fruits et racines, soigneusement macérés pour en extraire les arômes. Elle est ensuite vieillie en fût de chêne pendant un an, ce qui lui confère sa profondeur aromatique."}, {"type": "text", "text": "Son profil gustatif est complexe, combinant des notes herbacées, épicées, sucrées et légèrement amères. Le Jägermeister est souvent consommé pur, bien glacé, mais il est également populaire dans des cocktails ou mélangé avec des boissons comme le Red Bull (dans le célèbre \"Jägerbomb\")."}]}, {"id": 26, "name": "Lillet", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 17.0, "blocks": [{"type": "text", "text": "Le Lillet est un apéritif français classique, produit depuis 1872 dans le village de Podensac, près de Bordeaux. Il est élaboré à partir d'un mélange de vins de Bordeaux (85 %) et de liqueurs de fruits (15 %), ainsi que de quinquina, qui lui confère une légère amertume. Avec un taux d'alcool de 17 %, le Lillet se décline en trois versions : Blanc, Rosé et Rouge, chacune ayant son propre profil aromatique."}, {"type": "text", "text": "Lillet Blanc : Notes d'oranges confites, de miel et de fruits exotiques."}, {"type": "text", "text": "Lillet Rosé : Fraîcheur vive avec des arômes de fruits rouges et de pamplemousse."}, {"type": "text", "text": "Lillet Rouge : Saveurs puissantes d'oranges fraîches, de fruits rouges mûrs et d'épices."}, {"type": "text", "text": "Le Lillet est souvent consommé bien frais, pur ou sur glace, mais il est également utilisé dans des cocktails comme le Lillet Spritz ou le Vesper Martini."}]}, {"id": 27, "name": "Mandarine Napoleon", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 38.0, "blocks": [{"type": "text", "text": "La Mandarine Napoléon est une liqueur d'agrumes raffinée, créée en Belgique en 1892. Elle est élaborée à partir d'un mélange unique de mandarines siciliennes macérées et de cognac de haute qualité, enrichi d'un mélange secret de plantes aromatiques. Avec un taux d'alcool de 38 %, cette liqueur offre un profil aromatique riche et complexe."}, {"type": "text", "text": "Son goût est dominé par des notes d'agrumes confits, de marmelade, de cannelle et de noix de muscade, avec une touche subtile de réglisse. La Mandarine Napoléon peut être dégustée pure, sur glace, ou utilisée dans des cocktails sophistiqués pour ajouter une profondeur aromatique unique."}]}, {"id": 28, "name": "Maraschino Luxardo", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 32.0, "blocks": [{"type": "text", "text": "Le Luxardo Maraschino Originale est une liqueur italienne emblématique, produite depuis 1821 par la maison Luxardo. Elle est fabriquée à partir de cerises marasca, une variété rare et acidulée, cultivée dans les vergers de la marque. Ces cerises sont macérées avec leurs feuilles et branches , les noyaux des cerises marasca sont intégrés dans le processus de fabrication du Luxardo Maraschino. Pendant la macération des cerises entières (y compris les noyaux), les noyaux libèrent une petite quantité de composés aromatiques, notamment le benzaldéhyde, qui confère à la liqueur son parfum caractéristique d'amande., puis distillées dans des alambics en cuivre traditionnels. Le distillat est ensuite vieilli dans des fûts de bois de frêne avant d'être adouci avec un sirop simple, pour atteindre un taux d'alcool de 32 %."}, {"type": "text", "text": "Son profil aromatique est unique, avec des notes de cerise, de chocolat noir, de vanille et une légère touche d'orange confite. Le Luxardo Maraschino est souvent utilisé dans des cocktails classiques comme le Last Word, le Aviation ou le Hemingway Daiquiri, mais il peut également être dégusté pur ou utilisé pour parfumer des desserts."}]}, {"id": 29, "name": "Pimm`s", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 25.0, "blocks": [{"type": "text", "text": "Le Pimm's est une liqueur anglaise emblématique, créée en 1823 par James Pimm. À l'origine, elle était servie comme un digestif à base de gin et d'herbes aromatiques. Aujourd'hui, le Pimm's No. 1 Cup, la version la plus connue, est un mélange de gin, de plantes botaniques et d'épices, avec un taux d'alcool de 25 %."}, {"type": "text", "text": "Le Pimm's est particulièrement populaire en été, souvent associé à des événements mondains britanniques comme Wimbledon ou les régates de Henley. Il est traditionnellement servi en cocktail, mélangé avec de la limonade, des glaçons, et garni de fruits frais (fraises, oranges, concombres) et de menthe. Ce cocktail est connu sous le nom de Pimm's Cup."}]}, {"id": 30, "name": "Quaglia Bergamotto", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 35.0, "blocks": [{"type": "text", "text": "Le Quaglia Bergamotto est une liqueur italienne raffinée, produite par l'Antica Distilleria Quaglia, située dans le Piémont. Avec un taux d'alcool de 35 %, elle est élaborée à partir de zestes et de jus de bergamote fraîche, associés à des gousses de vanille Bourbon et du jus de pamplemousse."}, {"type": "text", "text": "Son profil aromatique est vibrant et complexe, mêlant des notes d'agrumes confits, de vanille douce et une touche légèrement florale et balsamique. Cette liqueur est idéale en digestif, servie bien fraîche, ou utilisée dans des cocktails comme le Bergamotto Sour, où elle apporte une profondeur aromatique unique."}]}, {"id": 31, "name": "Quaglia camomilla", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 28.0, "blocks": [{"type": "text", "text": "Le Quaglia Camomilla est une liqueur artisanale produite par l'Antica Distilleria Quaglia, située dans le Piémont, en Italie. Avec un taux d'alcool de 28 %, cette liqueur est élaborée à partir de fleurs de camomille séchées, infusées dans de l'alcool, puis distillées avec des ingrédients tels que le bois de cèdre, les gousses de vanille et d'autres épices. Ce processus donne une liqueur délicatement parfumée et équilibrée."}, {"type": "text", "text": "Son profil aromatique est marqué par des notes florales intenses, des touches d'agrumes et une douceur subtile d'épices. La Quaglia Camomilla est idéale en digestif, servie pure ou sur glace, et peut également être utilisée pour ajouter une touche florale unique à des cocktails."}]}, {"id": 32, "name": "Quaglia Chinotto", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 35.0, "blocks": [{"type": "text", "text": "Le Quaglia Chinotto est une liqueur italienne artisanale produite par l'Antica Distilleria Quaglia, située dans le Piémont. Avec un taux d'alcool de 35 %, cette liqueur est élaborée à partir d'une infusion de chinotto, une petite orange amère typique de la Riviera ligure, récoltée à la main. Le processus de macération met en valeur les saveurs uniques de cet agrume, combinées à des notes subtiles de vanille et de rhubarbe."}, {"type": "text", "text": "Son profil aromatique est équilibré, avec une amertume modérée et des touches d'agrumes confits, de fleurs d'oranger et de pissenlit. La Quaglia Chinotto est idéale en digestif, servie pure ou sur glace, et peut également être utilisée dans des cocktails pour ajouter une profondeur aromatique sophistiquée."}]}, {"id": 33, "name": "Quaglia Violetta", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 20.0, "blocks": [{"type": "text", "text": "Le Quaglia Violetta est une liqueur artisanale produite par l'Antica Distilleria Quaglia, située dans le Piémont, en Italie. Avec un taux d'alcool de 20 %, cette liqueur est élaborée à partir d'une infusion de fleurs de violette, capturant leur parfum délicat et leurs saveurs florales uniques. Elle s'inspire des traditions anciennes où les fleurs printanières étaient récoltées et transformées en sirops ou liqueurs."}, {"type": "text", "text": "Son profil aromatique est marqué par des notes florales intenses, légèrement sucrées, avec une touche subtilement herbacée. La Quaglia Violetta est idéale pour ajouter une touche élégante à des cocktails comme le Violet Aviation, ou pour être dégustée pure, bien fraîche."}]}, {"id": 34, "name": "Salers", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 16.0, "blocks": [{"type": "text", "text": "Le Salers est un apéritif français traditionnel, originaire de la région d'Auvergne. Il est élaboré à partir de racines de gentiane jaune, une plante alpine qui pousse dans les montagnes du Massif central. Avec un taux d'alcool de 16 %, le Salers est l'un des plus anciens apéritifs à base de gentiane, datant de 1885."}, {"type": "text", "text": "Son profil aromatique est marqué par une amertume herbacée, des notes terreuses et une légère fraîcheur citronnée. Il est souvent consommé pur, sur glace, ou mélangé avec de l'eau gazeuse ou du tonic pour un apéritif rafraîchissant. Le Salers est également utilisé dans des cocktails pour ajouter une touche amère et complexe."}]}, {"id": 35, "name": "Strega", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Strega est une liqueur italienne emblématique, produite depuis 1860 par la distillerie Strega Alberti à Bénévent, en Campanie. Son nom, qui signifie \"sorcière\" en italien, fait référence aux légendes locales de sorcellerie. Avec un taux d'alcool de 40 %, cette liqueur est élaborée à partir d'une recette secrète comprenant environ 70 herbes et épices, dont la menthe, le fenouil, la cannelle et le safran, qui lui donne sa couleur jaune caractéristique."}, {"type": "text", "text": "Son profil aromatique est complexe, avec des notes herbacées, épicées et légèrement sucrées. Le Strega est souvent consommé comme digestif, pur ou sur glace, mais il est également utilisé pour parfumer des desserts, comme la torta caprese, ou dans des cocktails sophistiqués."}]}, {"id": 36, "name": "Suze", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 15.0, "blocks": [{"type": "text", "text": "La Suze est une liqueur française emblématique, créée en 1889 par Henri Porte et Fernand Moureaux. Elle est élaborée à partir de racines de gentiane jaune, une plante alpine connue pour ses propriétés amères et médicinales. Avec un taux d'alcool de 15 %, la Suze est appréciée pour son goût doux-amer et sa couleur dorée caractéristique."}, {"type": "text", "text": "Son profil aromatique est marqué par des notes herbacées, terreuses et légèrement citronnées. Elle est souvent consommée pure, sur glace, ou utilisée dans des cocktails comme le Suze Tonic ou le Suze Spritz, où elle apporte une touche amère et rafraîchissante."}]}, {"id": 37, "name": "Teara Hojicha", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 20.0, "blocks": [{"type": "text", "text": "Le Teara Hojicha est une liqueur japonaise unique, élaborée à partir de thé vert rôti (hojicha). Avec un taux d'alcool de 20 %, cette liqueur met en valeur les arômes distinctifs du hojicha, qui se caractérisent par des notes grillées, légèrement boisées et une douceur subtile. Elle est produite sans conservateurs ni colorants artificiels, ce qui en fait un produit naturel et authentique."}, {"type": "text", "text": "Notes grillées : Grâce à la torréfaction des feuilles à haute température, le hojicha développe un arôme fumé et boisé, souvent comparé à celui des noisettes ou du caramel brûlé."}, {"type": "text", "text": "Douceur naturelle : Contrairement à certains thés verts qui peuvent être amers, le hojicha a une douceur subtile et réconfortante, idéale pour les palais sensibles."}, {"type": "text", "text": "Arômes terreux : Il présente des notes chaleureuses, presque terreuses, qui ajoutent de la profondeur à sa saveur."}, {"type": "text", "text": "Toucher légèrement malté : Parfois, le hojicha peut rappeler des grains torréfiés ou du pain grillé, avec une touche légère qui évoque le café."}, {"type": "text", "text": "Le Teara Hojicha est idéal pour être dégusté pur, sur glace, ou utilisé dans des cocktails pour apporter une touche originale et raffinée."}]}, {"id": 38, "name": "Avril", "category": "Liqueurs de fruits", "abv": 26.0, "blocks": [{"type": "text", "text": "La liqueur Avril est un amaretto québécois produit par la Distillerie Mariana. Elle se distingue par son mélange unique de saveurs, combinant des noyaux d'abricots, du sirop d'érable, des noix forestières, de la noix de coco et du myrique baumier. Avec un taux d'alcool de 26 %, cette liqueur offre un profil aromatique riche et complexe."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes sucrées : Le sirop d'érable apporte une douceur typiquement québécoise."}, {"type": "text", "text": "Accents de noix : Les noix forestières et la noix de coco ajoutent une profondeur chaleureuse."}, {"type": "text", "text": "Bouquet caramélisé : Une touche de caramel et de café torréfié en finale."}, {"type": "text", "text": "L'Avril peut être dégustée pure, sur glace, ou utilisée dans des cocktails pour ajouter une touche originale et raffinée. Elle est également idéale pour sublimer des desserts."}]}, {"id": 39, "name": "Bailey s", "category": "Liqueurs de fruits", "abv": 17.0, "blocks": [{"type": "text", "text": "Le Baileys Original Irish Cream est une liqueur irlandaise emblématique, créée en 1974. Elle est fabriquée à partir d'un mélange de whisky irlandais, de crème fraîche, de cacao et de vanille, ce qui lui confère une texture veloutée et un goût doux et sucré. Avec un taux d'alcool de 17 %, elle est idéale pour être dégustée pure, sur glace, ou utilisée dans des cocktails et desserts."}, {"type": "text", "text": "Le Baileys est également très apprécié en cuisine, notamment pour parfumer des desserts comme les cheesecakes, les brownies ou les mousses au chocolat."}]}, {"id": 40, "name": "Barista", "category": "Liqueurs de fruits", "abv": null, "blocks": [{"type": "text", "text": "La liqueur Barista est une liqueur de café artisanale produite au Québec, mettant en valeur un mélange unique de café infusé à froid et de rhum ambré des Caraïbes. Cette liqueur est élaborée avec des grains de café arabica soigneusement sélectionnés, torréfiés artisanalement, et infusés pendant 24 heures pour en extraire toute la richesse aromatique."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes de café torréfié : Un goût intense et velouté, parfait pour les amateurs de café."}, {"type": "text", "text": "Touches de chocolat noir : Une douceur subtile qui équilibre l'amertume du café."}, {"type": "text", "text": "Finale longue et satisfaisante : Grâce à l'ajout de rhum ambré, qui apporte une profondeur chaleureuse."}, {"type": "text", "text": "La liqueur Barista est idéale pour être dégustée pure, sur glace, ou utilisée dans des cocktails comme le Martini Espresso ou le Black Russian"}]}, {"id": 41, "name": "Belle de Brillet", "category": "Liqueurs de fruits", "abv": 30.0, "blocks": [{"type": "text", "text": "La Belle de Brillet est une liqueur française raffinée, produite par la Maison Brillet. Elle est le résultat d'un assemblage harmonieux de poires Williams et de cognac Brillet, offrant un profil aromatique riche et fruité. Avec un taux d'alcool de 30 %, cette liqueur est idéale pour être dégustée pure, sur glace, ou utilisée dans des cocktails sophistiqués."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes de poires mûres : Douces et sucrées, avec une fraîcheur naturelle."}, {"type": "text", "text": "Touches de cognac : Apportant une profondeur et une chaleur élégante."}, {"type": "text", "text": "Finale subtilement épicée : Avec une légère complexité qui ravit le palais."}, {"type": "text", "text": "La Belle de Brillet est également utilisée pour parfumer des desserts ou accompagner des plats gourmands."}]}, {"id": 42, "name": "Cassis Monna", "category": "Liqueurs de fruits", "abv": null, "blocks": [{"type": "text", "text": "La Cassis Monna & Filles est une entreprise québécoise renommée, située sur l'Île d'Orléans. Depuis 1992, elle transforme le cassis (ou groseille noire) en produits de haute qualité, notamment la célèbre Crème de Cassis, qui a remporté une médaille d'or en 1995 lors d'un concours européen prestigieux. En plus de cette liqueur, la maison produit des vins apéritifs, des gelées, des sirops et même des moutardes à base de cassis."}, {"type": "text", "text": "Le domaine offre également une expérience gourmande avec son restaurant La Monnaguette, où les visiteurs peuvent déguster des plats mettant en valeur le cassis, tout en profitant d'une vue spectaculaire sur le pont de l'Île. C'est un lieu incontournable pour découvrir les mille et une façons d'apprécier le cassis."}]}, {"id": 43, "name": "Cointreau", "category": "Liqueurs de fruits", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Cointreau est une liqueur française emblématique, créée en 1849 à Angers par Édouard Cointreau. C'est un triple sec, une liqueur d'orange élaborée à partir d'écorces d'oranges douces et amères soigneusement sélectionnées. Avec un taux d'alcool de 40 %, il est réputé pour son équilibre parfait entre douceur et amertume, ainsi que pour sa transparence cristalline."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes d'agrumes éclatantes : Oranges douces et amères."}, {"type": "text", "text": "Toucher sucré : Subtil, sans être envahissant."}, {"type": "text", "text": "Finale vive et rafraîchissante : Idéale pour les cocktails."}, {"type": "text", "text": "Le Cointreau est un ingrédient clé dans de nombreux cocktails classiques, tels que la Margarita, le Cosmopolitan, le Sidecar et le White Lady. Il peut également être dégusté pur ou sur glace."}]}, {"id": 44, "name": "Dry Curacao", "category": "Liqueurs de fruits", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Dry Curaçao est une liqueur d'agrumes classique, souvent utilisée dans les cocktails. Elle est élaborée à partir d'écorces d'oranges amères, généralement de l'île de Curaçao, macérées avec des épices et mélangées à une base d'alcool, comme du brandy ou du cognac. Avec un taux d'alcool typique de 30 à 40 %, cette liqueur est connue pour son équilibre entre douceur et amertume."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes d'orange amère : Intenses et légèrement sucrées."}, {"type": "text", "text": "Touches épicées : Parfois avec des nuances de cannelle ou de clou de girofle."}, {"type": "text", "text": "Finale chaleureuse : Grâce à la base alcoolisée, souvent enrichie de cognac."}, {"type": "text", "text": "Le Dry Curaçao Pierre Ferrand, par exemple, est une version française haut de gamme, conçue selon une recette du XIXe siècle, qui met en valeur des saveurs complexes et raffinées."}]}, {"id": 45, "name": "Dry curacao yuzu", "category": "Liqueurs de fruits", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Dry Curaçao Yuzu Late Harvest est une liqueur innovante créée par Maison Ferrand, en collaboration avec David Wondrich. Cette version unique du curaçao classique met en avant le yuzu, un agrume japonais prisé pour ses arômes complexes et sa fraîcheur. Avec un taux d'alcool de 40 %, cette liqueur est élaborée à partir de zestes de yuzu récoltés tardivement, ce qui concentre leurs saveurs et leurs sucres naturels."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Arômes dominants : Notes vives de yuzu, rappelant un mélange de pamplemousse et de mandarine."}, {"type": "text", "text": "Touches subtiles : Nuances florales et épicées, avec une base chaleureuse de cognac."}, {"type": "text", "text": "Finale : Équilibre entre douceur et amertume, avec une légère touche boisée."}, {"type": "text", "text": "Cette liqueur est idéale pour des cocktails comme le Yuzu Meringue Sour ou pour être dégustée pure, afin de savourer toute sa complexité."}]}, {"id": 46, "name": "Grand Marnier", "category": "Liqueurs de fruits", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Grand Marnier est une liqueur française prestigieuse, créée en 1880 par Louis-Alexandre Marnier-Lapostolle. Elle est le fruit d'un mélange unique de cognac français et d'oranges amères, ce qui lui confère un profil aromatique riche et sophistiqué. Avec un taux d'alcool de 40 %, cette liqueur est souvent utilisée dans des cocktails, des desserts ou dégustée pure."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes d'agrumes : Oranges amères et zestes d'orange."}, {"type": "text", "text": "Touches de cognac : Profondes et chaleureuses, avec une légère complexité boisée."}, {"type": "text", "text": "Finale douce et équilibrée : Parfaite pour sublimer des créations culinaires ou des boissons."}, {"type": "text", "text": "Le Grand Marnier est un ingrédient clé dans des cocktails classiques comme la Grand Margarita ou le Sidecar, et il est également célèbre pour son utilisation dans les crêpes Suzette."}]}, {"id": 47, "name": "Abricot Du roulot", "category": "Liqueurs de fruits", "abv": 25.0, "blocks": [{"type": "text", "text": "L'Abricot du Roulot est une liqueur artisanale française produite par le Domaine Jean-Marc Roulot, situé à Meursault, en Bourgogne. Cette liqueur est élaborée à partir d'abricots Bergeron, une variété réputée pour sa richesse aromatique, cultivés dans la Vallée du Rhône. Les fruits sont soigneusement sélectionnés et travaillés selon des méthodes traditionnelles pour capturer toute leur essence."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes d'abricots mûrs : Intenses et sucrées, rappelant les fruits gorgés de soleil."}, {"type": "text", "text": "Touches miellées et florales : Apportant une douceur subtile et élégante."}, {"type": "text", "text": "Finale légèrement acidulée : Équilibrant la richesse du fruit."}, {"type": "text", "text": "Avec un taux d'alcool de 25 %, cette liqueur est idéale pour être dégustée pure, sur glace, ou utilisée dans des cocktails sophistiqués. Elle se marie également très bien avec des desserts, comme une tarte aux abricots ou une panna cotta."}]}, {"id": 48, "name": "Liqueur de poire terre et pierre", "category": "Liqueurs de fruits", "abv": 23.5, "blocks": [{"type": "text", "text": "La liqueur de poire Terre et Pierre est un produit artisanal québécois, élaboré par la micro-cidrerie et distillerie Entre Pierre et Terre, située à Franklin, au Québec. Cette liqueur met en valeur des poires ancestrales cultivées localement, transformées avec soin pour capturer toute leur essence."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes de poires mûres : Douces et fruitées, avec une fraîcheur naturelle."}, {"type": "text", "text": "Touches florales et épicées : Subtiles, ajoutant une complexité élégante."}, {"type": "text", "text": "Finale veloutée : Avec une belle persistance en bouche."}, {"type": "text", "text": "Avec un taux d'alcool de 23,5 %, cette liqueur est idéale pour être dégustée pure, sur glace, ou utilisée dans des cocktails raffinés. Elle est également parfaite pour accompagner des desserts ou des fromages."}]}, {"id": 49, "name": "Liqueur de pèche Sivo", "category": "Liqueurs de fruits", "abv": 23.0, "blocks": [{"type": "text", "text": "La liqueur de pêche Sivo, produite par la Maison Sivo au Québec, est une création artisanale qui met en valeur les saveurs naturelles des pêches fraîches. Avec un taux d'alcool de 23 %, cette liqueur est le fruit d'une macération minutieuse, offrant un profil aromatique doux et fruité."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes de pêche mûre : Intenses et sucrées, rappelant les fruits d'été."}, {"type": "text", "text": "Touches florales : Subtiles, ajoutant une élégance délicate."}, {"type": "text", "text": "Finale rafraîchissante : Parfaite pour des cocktails ou une dégustation pure."}, {"type": "text", "text": "C'est la liqueur utilisée dans le Monarque."}, {"type": "text", "text": "Elle est idéale pour agrémenter des cocktails classiques comme le Sex on the Beach ou des sangrias blanches, et peut également être savourée seule, bien fraîche."}]}, {"id": 50, "name": "Limoncello 3 lacs", "category": "Liqueurs de fruits", "abv": 28.0, "blocks": [{"type": "text", "text": "Le Limoncello 3 Lacs est une liqueur artisanale québécoise produite par la Distillerie 3 Lacs. C'est le premier limoncello québécois, élaboré à partir de zestes de citrons biologiques pelés à la main directement à la distillerie. Avec un taux d'alcool de 28 %, il offre un équilibre parfait entre l'acidité du citron, la douceur de la mandarine et une touche subtile de mélilot, souvent appelé \"vanille québécoise\"."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes citronnées éclatantes : Fraîches et acidulées."}, {"type": "text", "text": "Douceur équilibrée : Grâce à l'ajout de mandarine."}, {"type": "text", "text": "Complexité subtile : Avec une touche de mélilot qui apporte une profondeur unique."}, {"type": "text", "text": "Le Limoncello 3 Lacs est idéal pour être dégusté pur, sur glace, ou utilisé dans des cocktails comme le Limoncello Spritz ou le Limone Fizz. Il est parfait pour ajouter une touche festive à vos moments spéciaux, que ce soit en été ou en hiver."}]}, {"id": 51, "name": "Lore & legends menthe boreale", "category": "Liqueurs de fruits", "abv": 26.0, "blocks": [{"type": "text", "text": "La Grande Menthe Boréale de Lore & Legends est une liqueur artisanale québécoise, élaborée avec des ingrédients locaux soigneusement sélectionnés. Avec un taux d'alcool de 26 %, elle met en avant des saveurs uniques grâce à l'utilisation de menthe cultivée localement, de sapin baumier et de thé du Labrador, récoltés à la main dans les régions sauvages du nord du Québec."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fraîches de menthe : Intenses et vivifiantes."}, {"type": "text", "text": "Touches boisées : Apportées par le sapin baumier."}, {"type": "text", "text": "Complexité florale : Grâce au thé du Labrador."}, {"type": "text", "text": "Cette liqueur est idéale pour être dégustée pure, sur glace, ou utilisée dans des cocktails pour ajouter une touche boréale et rafraîchissante."}]}, {"id": 52, "name": "Blue curacao marie brizard", "category": "Liqueurs de fruits", "abv": 23.0, "blocks": [{"type": "text", "text": "Le Marie Brizard Blue Curaçao est une liqueur d'agrumes emblématique, fabriquée en France. Elle est élaborée à partir d'écorces d'oranges amères d'Haïti et d'oranges douces du sud de l'Espagne, avec l'ajout de plantes aromatiques pour enrichir son profil gustatif. Avec un taux d'alcool de 23 %, cette liqueur se distingue par sa couleur bleu profond et son goût caractéristique."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes d'orange amère : Intenses et légèrement sucrées."}, {"type": "text", "text": "Touches florales : Subtiles, ajoutant une complexité élégante."}, {"type": "text", "text": "Finale équilibrée : Peu sucrée, avec une belle fraîcheur."}, {"type": "text", "text": "Le Blue Curaçao Marie Brizard est idéal pour être dégusté avec des glaçons ou utilisé dans des cocktails comme le Blue Lagoon ou le Blue Margarita."}]}, {"id": 53, "name": "Aperitivo Menaud", "category": "Liqueurs de fruits", "abv": 22.9, "blocks": [{"type": "text", "text": "L'Apéritivo Menaud est une création artisanale québécoise inspirée des aperitivi italiens. Produit par la distillerie Menaud, située dans la région de Charlevoix, cet apéritif met en valeur des ingrédients locaux tels que l'argousier, la camerise, l'épine-vinette et l'absinthe, macérés dans un alcool neutre de grains. Avec un taux d'alcool de 22,9 %, il offre un équilibre parfait entre acidité et sucrosité."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fruitées nordiques : Argousier et camerise apportent une fraîcheur unique."}, {"type": "text", "text": "Touches herbacées : Grâce à l'absinthe et aux plantes locales."}, {"type": "text", "text": "Finale légèrement amère : Parfaite pour les amateurs de saveurs complexes."}, {"type": "text", "text": "Cet apéritif est idéal pour être dégusté sur glace, en spritz, en negroni ou dans d'autres cocktails sophistiqués."}]}, {"id": 54, "name": "Noa Amaretto", "category": "Liqueurs de fruits", "abv": null, "blocks": [{"type": "text", "text": "Le Noa Amaretto est une liqueur sans alcool québécoise, produite par Monsieur Cocktail. Inspirée de l'amaretto classique, cette version offre une alternative parfaite pour ceux qui souhaitent savourer les saveurs riches et complexes de l'amaretto, sans alcool. Avec des notes de cerise, de sirop d'érable, d'amande grillée et de vanille, il recrée l'expérience gustative de l'amaretto traditionnel."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Cerise et amande grillée : Des arômes typiques de l'amaretto classique."}, {"type": "text", "text": "Sirop d'érable : Une touche québécoise unique."}, {"type": "text", "text": "Vanille subtile : Pour une douceur équilibrée."}, {"type": "text", "text": "Le Noa Amaretto est idéal pour préparer des cocktails sans alcool, comme le Amaretto Sour ou le Noa Spritz, ou simplement pour être dégusté avec du jus de citron ou d'orange."}]}, {"id": 55, "name": "Pistacis", "category": "Liqueurs de fruits", "abv": null, "blocks": [{"type": "text", "text": "La Pistacis est une liqueur de pistache italienne qui incarne l'élégance et la gourmandise. Elle est souvent élaborée à partir de pistaches de haute qualité, infusées dans de l'alcool neutre, puis mélangées avec du sucre et parfois de la crème pour obtenir une texture onctueuse et une saveur riche."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes de pistache grillée : Intenses et authentiques."}, {"type": "text", "text": "Douceur subtile : Équilibrée par une légère amertume."}, {"type": "text", "text": "Texture veloutée : Parfaite pour une dégustation pure ou en dessert."}, {"type": "text", "text": "Cette liqueur est idéale pour être savourée seule, sur glace, ou utilisée dans des cocktails et des desserts raffinés."}]}, {"id": 56, "name": "Prunelle de bourgogne", "category": "Liqueurs de fruits", "abv": null, "blocks": [{"type": "text", "text": "La Prunelle de Bourgogne est une liqueur française traditionnelle, souvent associée à la région de Bourgogne. Elle est fabriquée à partir des fruits du prunellier, également appelés \"prunelles\" ou \"plosses,\" qui sont récoltés après les premières gelées pour adoucir leur amertume naturelle. Les noyaux des fruits sont ensuite cassés et macérés dans de l'alcool pendant une longue période, parfois plus d'un an, pour extraire leurs arômes riches et complexes."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes d'amande : Issues des noyaux des prunelles, avec une touche subtile de frangipane."}, {"type": "text", "text": "Saveurs fruitées : Douces et légèrement acidulées."}, {"type": "text", "text": "Finale chaleureuse : Parfaite pour un digestif."}, {"type": "text", "text": "La Prunelle de Bourgogne est souvent dégustée pure, en digestif, ou utilisée dans des cocktails pour apporter une touche unique. Elle peut également être allongée avec du crémant ou du vin blanc pour un apéritif élégant."}]}, {"id": 57, "name": "Sureau Rosemont", "category": "Liqueurs de fruits", "abv": 23.5, "blocks": [{"type": "text", "text": "La Rosemont Sureau est une liqueur artisanale québécoise produite par la Distillerie de Montréal. Elle est élaborée à partir de fleurs et de baies de sureau soigneusement récoltées en Estrie. Les fleurs sont infusées dans une base d'alcool neutre pendant 48 heures pour préserver leur fraîcheur et leurs arômes, tandis que les baies sont fermentées et distillées séparément avant d'être assemblées avec une touche de sucre de canne."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes florales : Douces et acidulées, grâce aux fleurs de sureau."}, {"type": "text", "text": "Saveurs fruitées : Apportées par les baies, avec une rondeur légère."}, {"type": "text", "text": "Finale subtile : Aux accents de sucre d'orge, peu sucrée."}, {"type": "text", "text": "Avec un taux d'alcool de 23,5 %, cette liqueur est idéale pour être dégustée seule, en apéritif, ou utilisée dans des cocktails originaux comme le Spritz au sureau ou le Sure O'Tonic."}]}, {"id": 58, "name": "Umeshu Choya", "category": "Liqueurs de fruits", "abv": 15.0, "blocks": [{"type": "text", "text": "Le Choya Umeshu est une liqueur japonaise traditionnelle, fabriquée à partir de prunes japonaises (ume). Cette liqueur est réputée pour son équilibre parfait entre douceur et acidité, ainsi que pour ses arômes fruités et floraux. Avec un taux d'alcool typique de 10 à 15 %, elle est souvent consommée pure, sur glace, ou mélangée à de l'eau pétillante pour un apéritif rafraîchissant."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fruitées : Prunes mûres avec une touche acidulée."}, {"type": "text", "text": "Douceur subtile : Parfaitement équilibrée."}, {"type": "text", "text": "Finale florale : Avec une légère complexité."}, {"type": "text", "text": "Le Choya propose également des variantes comme le Choya Extra Years, le Choya Royal Honey, et le Choya Shiso, chacune offrant des saveurs uniques."}]}, {"id": 59, "name": "Luxardo abricot", "category": "Liqueurs de fruits", "abv": 30.0, "blocks": [{"type": "text", "text": "Luxardo Abricot est une liqueur italienne raffinée, produite par la célèbre maison Luxardo depuis 1935. Elle est élaborée à partir de la pulpe d'abricots infusée dans de l'alcool de betterave sucrière, ce qui lui confère une saveur riche et complexe. Cette liqueur a été primée lors d'une compétition à Rome et porte le titre de \"Liquore della Lupa\" (Liqueur de la Louve romaine), en hommage à la capitale italienne."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fruitées : Abricots mûrs et confiture d'abricot."}, {"type": "text", "text": "Finale douce et persistante : Avec une subtile nuance boisée."}, {"type": "text", "text": "Avec un taux d'alcool de 30 %, elle est idéale pour être dégustée pure, sur glace, ou utilisée dans des cocktails sophistiqués comme le Apricot Sour."}]}, {"id": 60, "name": "Pastis Ricard", "category": "Anisés", "abv": 45.0, "blocks": [{"type": "text", "text": "Le Pastis Ricard, également connu sous le nom de Ricard Pastis de Marseille, est une liqueur anisée emblématique créée en 1932 par Paul Ricard à Marseille. Ce pastis est élaboré à partir d'un mélange d'anis étoilé, de réglisse et d'herbes de Provence, ce qui lui confère un profil aromatique unique et typiquement méditerranéen. Avec un taux d'alcool de 45 %, il est conçu pour être dilué avec de l'eau, ce qui transforme sa couleur dorée en une teinte laiteuse caractéristique."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes d'anis étoilé : Intenses et rafraîchissantes."}, {"type": "text", "text": "Douceur réglissée : Apportant une rondeur agréable."}, {"type": "text", "text": "Herbes provençales : Subtiles, ajoutant une complexité aromatique."}, {"type": "text", "text": "Le Pastis Ricard est un incontournable des apéritifs à la française. Il est traditionnellement servi avec cinq volumes d'eau pour un volume de pastis, accompagné de glaçons. Il peut également être utilisé dans des cocktails ou pour parfumer des plats méditerranéens."}]}, {"id": 61, "name": "Pastis henri bardouin", "category": "Anisés", "abv": 45.0, "blocks": [{"type": "text", "text": "Le Pastis Henri Bardouin est un pastis haut de gamme, souvent qualifié de \"Grand Cru\" des pastis. Produit par les Distilleries et Domaines de Provence à Forcalquier, en France, il se distingue par sa recette complexe, composée de plus de 65 plantes et épices provenant de Provence et d'autres régions du monde. Avec un taux d'alcool de 45 %, il offre une expérience gustative riche et raffinée."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes anisées : Intenses et équilibrées."}, {"type": "text", "text": "Touches herbacées et épicées : Thym, romarin, sauge, réglisse, et bien plus."}, {"type": "text", "text": "Finale complexe et persistante : Avec une douceur subtile et une amertume maîtrisée."}, {"type": "text", "text": "Le Pastis Henri Bardouin est idéal pour être dégusté en apéritif, dilué avec 6 à 10 volumes d'eau, ou utilisé dans des cocktails sophistiqués. Il est également apprécié pour accompagner des plats méditerranéens ou des mets épicés."}]}, {"id": 62, "name": "Absente", "category": "Anisés", "abv": 55.0, "blocks": [{"type": "text", "text": "L'Absente est une liqueur d'absinthe produite par les Distilleries et Domaines de Provence, située à Forcalquier, en France. Elle est inspirée de la légendaire absinthe, également connue sous le nom de \"Fée Verte,\" mais avec une teneur en thuyone (un composé naturel de l'absinthe) strictement contrôlée pour respecter les réglementations modernes. Avec un taux d'alcool de 55 %, elle offre une expérience gustative riche et complexe."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes anisées : Intenses et rafraîchissantes."}, {"type": "text", "text": "Touches herbacées : Mélisse, menthe et armoise."}, {"type": "text", "text": "Finale légèrement épicée : Avec une douceur subtile."}, {"type": "text", "text": "L'Absente peut être dégustée selon le rituel traditionnel de l'absinthe : versez lentement de l'eau glacée sur un sucre posé sur une cuillère à absinthe, au-dessus du verre. Elle peut également être utilisée dans des cocktails pour ajouter une touche unique."}]}, {"id": 63, "name": "Absinthe fleur bleue", "category": "Anisés", "abv": 53.0, "blocks": [{"type": "text", "text": "L'Absinthe Fleur Bleue est une absinthe artisanale québécoise produite par l'Absintherie des Cantons, située dans les Cantons-de-l'Est. Inspirée d'une recette franco-suisse du XIXe siècle, cette absinthe blanche est distillée dans la plus pure tradition, mettant en valeur des ingrédients locaux et une douzaine de plantes, dont l'Artemisia absinthium (grande absinthe), le fenouil et l'anis."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes anisées : Douces et équilibrées."}, {"type": "text", "text": "Touches herbacées : Subtiles, avec une fraîcheur caractéristique."}, {"type": "text", "text": "Finale délicate : Moins amère que les absinthes vertes, idéale pour une dégustation pure ou en cocktail."}, {"type": "text", "text": "Avec un taux d'alcool de 53 %, elle est parfaite pour les amateurs d'absinthe à la recherche d'une expérience raffinée."}]}, {"id": 64, "name": "Anicetta meletti", "category": "Anisés", "abv": 34.0, "blocks": [{"type": "text", "text": "L'Anisetta Meletti est une liqueur italienne emblématique, produite depuis 1870 par la maison Meletti, située à Ascoli Piceno, dans la région des Marches. Cette liqueur est élaborée à partir de graines d'anis vert méditerranéen, soigneusement sélectionnées pour leur qualité, et distillées selon une méthode traditionnelle. Avec un taux d'alcool de 34 %, elle est reconnue pour son goût délicat et son arôme raffiné."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes d'anis : Intenses et fraîches."}, {"type": "text", "text": "Douceur subtile : Avec une légère touche sucrée."}, {"type": "text", "text": "Finale élégante : Parfaite pour une dégustation pure ou en accompagnement."}, {"type": "text", "text": "L'Anisetta Meletti peut être dégustée de différentes façons : pure, sur glace, ou avec trois grains de café (appelée \"anisette con la mosca\"). Elle est également utilisée pour parfumer des desserts ou enrichir des cocktails."}]}, {"id": 65, "name": "Cocchi americano bianco", "category": "Vermouths et Xérès", "abv": 16.5, "blocks": [{"type": "text", "text": "Le Cocchi Americano Bianco est un apéritif italien classique, créé en 1891 par Giulio Cocchi. Il est élaboré à partir de vin blanc aromatisé avec des herbes et des épices, notamment la gentiane, l'armoise, la quinine et des zestes d'agrumes. Avec un taux d'alcool de 16,5 %, il est souvent considéré comme le lien parfait entre le vin et les liqueurs."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes d'agrumes : Fraîches et légèrement amères."}, {"type": "text", "text": "Touches herbacées : Subtiles, avec une complexité élégante."}, {"type": "text", "text": "Finale douce et équilibrée : Parfaite pour les cocktails ou une dégustation pure."}, {"type": "text", "text": "Le Cocchi Americano Bianco est idéal pour des cocktails comme le Vesper Martini, le Corpse Reviver #2, ou simplement servi avec de l'eau pétillante et un zeste d'orange. Il est également utilisé comme substitut du Kina Lillet dans certaines recettes classiques."}]}, {"id": 66, "name": "Cocchi Rosa", "category": "Vermouths et Xérès", "abv": 16.5, "blocks": [{"type": "text", "text": "Le Cocchi Rosa est un apéritif italien raffiné, produit par la maison Giulio Cocchi dans la région du Piémont. Élaboré à partir de vins rouges locaux, il est aromatisé avec des herbes, des épices et des extraits naturels, notamment de la gentiane, de la quinine, des zestes d'agrumes et des pétales de rose. Avec un taux d'alcool de 16,5 %, il se distingue par sa couleur rouge naturelle et ses saveurs complexes."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes florales : Pétales de rose et nuances délicates."}, {"type": "text", "text": "Touches herbacées : Gentiane et quinine pour une légère amertume."}, {"type": "text", "text": "Saveurs fruitées : Agrumes et une douceur subtile."}, {"type": "text", "text": "Le Cocchi Rosa est idéal pour des cocktails comme le Cocchi Rosa Spritz (mélangé avec du vin pétillant et un zeste de pamplemousse rose) ou simplement servi avec de l'eau pétillante et une tranche d'orange. Il est également parfait pour les amateurs de cocktails à faible teneur en alcool."}]}, {"id": 67, "name": "Cocchi torino rouge", "category": "Vermouths et Xérès", "abv": null, "blocks": [{"type": "text", "text": "Le Cocchi Vermouth di Torino Rosso est un vermouth italien classique, produit dans la région du Piémont. Élaboré selon une recette traditionnelle datant de 1891, il est fabriqué à partir de vin Moscato et aromatisé avec des plantes et des épices, notamment du cacao, de la rhubarbe, des agrumes et du gingembre."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes d'agrumes : Fraîches et légèrement amères."}, {"type": "text", "text": "Touches épicées : Cacao, gingembre et rhubarbe pour une complexité unique."}, {"type": "text", "text": "Finale équilibrée : Douce et amère, parfaite pour les cocktails."}, {"type": "text", "text": "Ce vermouth est idéal pour des cocktails classiques comme le Negroni ou le Manhattan, mais il peut également être dégusté pur ou avec de l'eau pétillante pour un apéritif élégant."}]}, {"id": 68, "name": "Cocchi extra dry", "category": "Vermouths et Xérès", "abv": 17.0, "blocks": [{"type": "text", "text": "Le Cocchi Vermouth di Torino Extra Dry est un vermouth italien élégant, produit dans la région du Piémont. Créé pour célébrer le 130e anniversaire de la maison Cocchi, il est élaboré à partir de raisins Cortese, les mêmes utilisés pour le Gavi DOCG, et d'un mélange d'herbes et d'épices locales, comme la menthe piémontaise, le zeste de citron, la coriandre et l'absinthe."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fraîches : Pomme, melon et fleurs blanches provenant du vin."}, {"type": "text", "text": "Touches herbacées : Menthe, coriandre et absinthe pour une complexité équilibrée."}, {"type": "text", "text": "Finale vive et lumineuse : Grâce au zeste de citron et à la menthe."}, {"type": "text", "text": "Avec un taux d'alcool de 17 %, ce vermouth est parfait pour enrichir des cocktails classiques comme le Martini ou le Bamboo, mais il peut également être dégusté avec de l'eau tonique ou sur glace."}]}, {"id": 69, "name": "Carpano antica formula", "category": "Vermouths et Xérès", "abv": 16.5, "blocks": [{"type": "text", "text": "Le Carpano Antica Formula est un vermouth italien prestigieux, souvent considéré comme le \"roi des vermouths.\" Créé en 1786 par Antonio Benedetto Carpano à Turin, il est élaboré à partir de vins blancs comme le Trebbiano, le Catarratto et le Chardonnay, et aromatisé avec des herbes, des épices et des racines selon une recette secrète. Avec un taux d'alcool de 16,5 %, il se distingue par ses notes complexes et son profil unique."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes de vanille : Douces et chaleureuses."}, {"type": "text", "text": "Touches épicées : Cacao, rhubarbe et agrumes."}, {"type": "text", "text": "Finale équilibrée : Douce-amère, parfaite pour les cocktails ou une dégustation pure."}, {"type": "text", "text": "Le Carpano Antica Formula est idéal pour des cocktails classiques comme le Negroni, le Manhattan, ou simplement servi sur glace en apéritif."}]}, {"id": 70, "name": "La Copa vermouth gonzales byass", "category": "Vermouths et Xérès", "abv": 15.5, "blocks": [{"type": "text", "text": "La Copa Rojo de González Byass est un vermouth rouge espagnol, élaboré dans la région de Jerez, en Andalousie. Ce vermouth est créé à partir de vins de xérès, notamment l'Oloroso et le Pedro Ximénez, et aromatisé avec un mélange d'herbes et d'épices selon une recette historique datant de 1896."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes épicées : Cannelle, clou de girofle et noix de muscade."}, {"type": "text", "text": "Saveurs fruitées : Raisins secs et agrumes."}, {"type": "text", "text": "Finale élégante : Avec une touche de cola et une amertume équilibrée."}, {"type": "text", "text": "Avec un taux d'alcool de 15,5 %, le La Copa Rojo est idéal pour être dégusté pur, sur glace, ou utilisé dans des cocktails comme le Negroni ou le Manhattan"}]}, {"id": 71, "name": "Lucano Cavaliere", "category": "Vermouths et Xérès", "abv": 18.0, "blocks": [{"type": "text", "text": "Le Lucano Vermouth del Cavaliere Rosso est un vermouth italien prestigieux, produit par la maison Lucano 1894, située dans la région de Basilicate. Ce vermouth rouge est élaboré à partir de vin rouge, enrichi d'un mélange d'herbes et d'épices, notamment l'absinthe, l'origan, la coriandre, l'orange et l'angélique. Avec un taux d'alcool de 18 %, il offre une expérience gustative complexe et intense."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes herbacées : Absinthe et coriandre pour une amertume équilibrée."}, {"type": "text", "text": "Saveurs épicées : Origan et angélique pour une profondeur aromatique."}, {"type": "text", "text": "Touches fruitées : Orange pour une douceur subtile."}, {"type": "text", "text": "Ce vermouth est idéal pour être dégusté pur, sur glace, ou utilisé dans des cocktails sophistiqués comme le Negroni ou le Manhattan."}]}, {"id": 72, "name": "Martini vibrante", "category": "Vermouths et Xérès", "abv": null, "blocks": [{"type": "text", "text": "Le Martini Vibrante est un apéritif sans alcool italien, conçu pour offrir une alternative raffinée et savoureuse aux boissons alcoolisées. Élaboré à partir de vins désalcoolisés et infusé avec des plantes et des agrumes, notamment la bergamote et l'armoise, il se distingue par son profil aromatique complexe et rafraîchissant."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes d'agrumes : Bergamote et zestes d'orange pour une fraîcheur vive."}, {"type": "text", "text": "Touches herbacées : Subtiles, avec une légère amertume."}, {"type": "text", "text": "Finale équilibrée : Douce et légèrement acidulée."}, {"type": "text", "text": "Le Martini Vibrante est parfait pour des cocktails comme le Vibrante Spritz, où il est mélangé avec de l'eau tonique et garni d'une tranche d'orange. Il peut également être dégusté pur, sur glace, pour un apéritif léger et élégant."}]}, {"id": 73, "name": "Noilly prat dry", "category": "Vermouths et Xérès", "abv": 18.0, "blocks": [{"type": "text", "text": "Le Noilly Prat Original Dry est un vermouth français emblématique, réputé pour son équilibre et sa complexité. Produit à Marseillan, dans le sud de la France, il est élaboré à partir de vins blancs, notamment de cépages Picpoul et Clairette, qui sont vieillis en plein air dans des fûts de chêne pendant 12 mois. Ce procédé unique développe des arômes riches et raffinés."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes herbacées et épicées : Absinthe, camomille et coriandre."}, {"type": "text", "text": "Toucher boisé : Résultant de la maturation en fût."}, {"type": "text", "text": "Finale sèche et minérale : Avec une légère amertume."}, {"type": "text", "text": "Avec un taux d'alcool de 18 %, le Noilly Prat Original Dry est parfait pour des cocktails classiques comme le Martini Dry, ou simplement dégusté pur avec un zeste de citron. Il est aussi très apprécié en cuisine pour sublimer des plats de fruits de mer ou des sauces."}]}, {"id": 74, "name": "Vermouth rouge gorge blanc", "category": "Vermouths et Xérès", "abv": 18.0, "blocks": [{"type": "text", "text": "Le Rouge Gorge Blanc est un vermouth québécois unique, produit par le Domaine Lafrance à partir de pommes cultivées localement. Ce vermouth de cidre blanc est infusé avec une variété d'herbes et d'épices, notamment l'absinthe, la fleur de sureau, le fenouil, la sarriette et la racine de gentiane, parmi plus de 100 autres ingrédients."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fruitées : Pomme fraîche et nuances végétales."}, {"type": "text", "text": "Touches épicées : Cannelle et autres épices subtiles."}, {"type": "text", "text": "Finale douce et équilibrée : Avec une légère amertume."}, {"type": "text", "text": "Avec un taux d'alcool de 18 %, il est parfait pour être dégusté sur
