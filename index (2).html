glace avec une tranche de citron, ou utilisé dans des cocktails comme le Dirty Martini ou le Clover Club. Ce vermouth met en valeur le savoir-faire québécois et la richesse des produits locaux."}]}, {"id": 75, "name": "Nectar PX gonzales byass", "category": "Vermouths et Xérès", "abv": 15.0, "blocks": [{"type": "text", "text": "Le PX Nectar est un vin doux naturel espagnol produit par la maison González Byass, dans la région de Jerez. Ce vin est élaboré à partir de raisins de cépage Pedro Ximénez, qui sont séchés au soleil avant la vinification pour concentrer leurs sucres. Il est ensuite vieilli pendant environ 9 ans dans des fûts de chêne américain, selon le système traditionnel de solera."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes de fruits secs : Raisins, figues et dattes."}, {"type": "text", "text": "Touches sucrées : Miel et caramel."}, {"type": "text", "text": "Finale veloutée : Avec une acidité subtile qui équilibre le tout."}, {"type": "text", "text": "Avec un taux d'alcool de 15 %, le PX Nectar est idéal pour accompagner des desserts comme la crème brûlée, les glaces ou les gâteaux aux noix. Il peut également être dégusté seul, comme un véritable dessert liquide."}]}, {"id": 76, "name": "Vermouth vergano", "category": "Vermouths et Xérès", "abv": 17.0, "blocks": [{"type": "text", "text": "Le Vermouth Vergano est une création artisanale italienne, produite par Mauro Vergano dans la région du Piémont, à Asti. Ce vermouth est élaboré à partir de vins locaux, comme le Moscato et le Cortese, et aromatisé avec un mélange d'herbes et d'épices soigneusement sélectionnées, notamment la marjolaine, le thym, le basilic, l'origan, et le zeste de citron."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes herbacées : Fraîches et complexes, avec une touche méditerranéenne."}, {"type": "text", "text": "Saveurs fruitées : Agrumes et une douceur subtile."}, {"type": "text", "text": "Finale équilibrée : Douce-amère, parfaite pour les cocktails ou une dégustation pure."}, {"type": "text", "text": "Avec un taux d'alcool de 17 %, le Vermouth Vergano est idéal pour des cocktails comme le White Negroni, ou simplement servi sur glace avec une tranche de citron. Ce vermouth est produit en petites quantités, ce qui le rend rare et très recherché."}]}, {"id": 77, "name": "Barr Hill", "category": "Gins", "abv": 45.0, "blocks": [{"type": "text", "text": "Le Barr Hill Gin est un gin artisanal américain produit par Caledonia Spirits, dans le Vermont. Ce gin est unique grâce à l'ajout de miel brut en fin de distillation, ce qui lui confère une douceur florale et une profondeur aromatique exceptionnelle. Avec un taux d'alcool de 45 %, il est souvent considéré comme l'un des gins les plus primés aux États-Unis."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes de genièvre : Prononcées et équilibrées."}, {"type": "text", "text": "Touches florales : Apportées par le miel brut, avec une complexité naturelle."}, {"type": "text", "text": "Finale douce et élégante : Parfaite pour une dégustation pure ou en cocktail."}, {"type": "text", "text": "Le Barr Hill Gin est idéal pour des cocktails comme le Bee's Knees ou le Gin Tonic, mais il peut également être dégusté pur pour apprécier pleinement ses arômes uniques."}]}, {"id": 78, "name": "Barr hill tom cat", "category": "Gins", "abv": 43.0, "blocks": [{"type": "text", "text": "Le Barr Hill Tom Cat Gin est une version vieillie du célèbre Barr Hill Gin, produite par Caledonia Spirits dans le Vermont. Ce gin est vieilli en fûts de chêne américain, ce qui lui confère des saveurs boisées et une profondeur aromatique unique. Avec un taux d'alcool de 43 %, il est souvent apprécié par les amateurs de gin et de whisky pour son profil riche et complexe."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes boisées : Vanille et épices douces provenant du vieillissement en fût."}, {"type": "text", "text": "Touches florales : Apportées par le miel brut utilisé dans la recette."}, {"type": "text", "text": "Finale équilibrée : Douce et légèrement épicée."}, {"type": "text", "text": "Le Barr Hill Tom Cat Gin est idéal pour des cocktails comme le Old Fashioned ou le Negroni, mais il peut également être dégusté pur pour apprécier pleinement ses arômes."}]}, {"id": 79, "name": "Bols Genever", "category": "Gins", "abv": 42.0, "blocks": [{"type": "text", "text": "Le Bols Genever est un genièvre hollandais emblématique, produit par la maison Lucas Bols, l'une des plus anciennes distilleries au monde, fondée en 1575. Ce spiritueux est élaboré selon une recette traditionnelle datant de 1820, qui combine des malts de céréales et des plantes aromatiques, notamment le genièvre. Avec un taux d'alcool de 42 %, il est souvent considéré comme l'ancêtre du gin moderne."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes maltées : Riche et douce, avec une texture veloutée."}, {"type": "text", "text": "Touches herbacées : Subtiles, avec une légère amertume."}, {"type": "text", "text": "Finale équilibrée : Parfaite pour les cocktails ou une dégustation pure."}, {"type": "text", "text": "Le Bols Genever est idéal pour des cocktails classiques comme le Martinez, le Dutch Negroni, ou simplement servi sur glace."}]}, {"id": 80, "name": "Bombay Sapphire", "category": "Gins", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Bombay Sapphire est un gin emblématique de style London Dry, connu pour sa douceur et son équilibre. Il est produit en Angleterre par la Bombay Spirits Company et se distingue par son processus unique de distillation à la vapeur, qui permet d'extraire délicatement les arômes de ses 10 plantes botaniques soigneusement sélectionnées, comme les baies de genièvre, la coriandre, les graines de paradis et l'écorce de citron."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fraîches : Genièvre et agrumes."}, {"type": "text", "text": "Touches épicées : Coriandre et poivre."}, {"type": "text", "text": "Finale équilibrée : Douce et florale."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, le Bombay Sapphire est parfait pour des cocktails classiques comme le Gin Tonic, le Martini Dry, ou même des créations plus audacieuses."}]}, {"id": 81, "name": "Botanist gin", "category": "Gins", "abv": 46.0, "blocks": [{"type": "text", "text": "Le Botanist Islay Dry Gin est un gin artisanal écossais, produit par la célèbre distillerie Bruichladdich, située sur l'île d'Islay. Ce gin se distingue par l'utilisation de 22 plantes indigènes de l'île, cueillies à la main, en plus des 9 plantes botaniques classiques comme le genièvre, la coriandre et l'angélique. Avec un taux d'alcool de 46 %, il offre une expérience aromatique complexe et unique."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes herbacées : Menthe, thym et camomille."}, {"type": "text", "text": "Touches florales : Bruyère et fleurs sauvages."}, {"type": "text", "text": "Finale équilibrée : Fraîche et légèrement citronnée."}, {"type": "text", "text": "Le Botanist est parfait pour des cocktails comme le Gin Tonic ou le Botanist Collins, mais il peut également être dégusté pur pour apprécier pleinement ses arômes."}]}, {"id": 82, "name": "Gin Brockman's", "category": "Gins", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Brockmans Gin est un gin artisanal anglais, réputé pour son profil aromatique unique et sa douceur exceptionnelle. Élaboré à partir d'ingrédients naturels, il se distingue par l'utilisation de baies noires comme la mûre et la myrtille, en plus des plantes botaniques classiques telles que le genièvre, la coriandre, et les zestes d'agrumes."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fruitées : Mûre, myrtille et framboise pour une douceur intense."}, {"type": "text", "text": "Touches herbacées : Genièvre et coriandre pour un équilibre parfait."}, {"type": "text", "text": "Finale douce et veloutée : Idéale pour une dégustation pure ou en cocktail."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, le Brockmans Gin est parfait pour des cocktails comme le Gin Tonic ou le Martini, mais il peut également être dégusté pur, sur glace, pour apprécier pleinement ses arômes fruités."}]}, {"id": 83, "name": "Cirka sauvage", "category": "Gins", "abv": 44.0, "blocks": [{"type": "text", "text": "Le Cirka Sauvage est un gin artisanal québécois, produit par la distillerie Cirka, située à Montréal. Ce gin est une célébration des trésors aromatiques des forêts boréales du Québec. Élaboré avec 33 plantes botaniques, il offre un profil complexe et équilibré, mettant en valeur des ingrédients locaux comme le pin, la menthe et des notes florales."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes boisées : Pin et conifères pour une fraîcheur sauvage."}, {"type": "text", "text": "Touches florales : Élégantes et harmonieuses."}, {"type": "text", "text": "Finale veloutée : Avec une chaleur subtile qui enveloppe le palais."}, {"type": "text", "text": "Avec un taux d'alcool de 44 %, le Cirka Sauvage est idéal pour des cocktails sophistiqués ou une dégustation pure."}]}, {"id": 84, "name": "Gin citadelle", "category": "Gins", "abv": 44.0, "blocks": [{"type": "text", "text": "Le Citadelle Gin est un gin artisanal français produit par la maison Maison Ferrand, située dans le sud-ouest de la France, près de Cognac. Créé en 1996, il est considéré comme l'un des pionniers des gins \"craft\" et se distingue par son processus d'infusion progressive, utilisant 19 plantes botaniques soigneusement sélectionnées, comme le genièvre, la coriandre, le poivre cubèbe, et la cardamome."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fraîches : Genièvre et agrumes."}, {"type": "text", "text": "Touches épicées : Poivre, cardamome et cannelle."}, {"type": "text", "text": "Finale équilibrée : Douce et florale, avec une complexité élégante."}, {"type": "text", "text": "Avec un taux d'alcool de 44 %, le Citadelle Gin est parfait pour des cocktails classiques comme le Gin Tonic, le Martini Dry, ou même des créations plus audacieuses. Il peut également être dégusté pur pour apprécier pleinement ses arômes."}]}, {"id": 85, "name": "Gin citadelle jardin d'été", "category": "Gins", "abv": 41.5, "blocks": [{"type": "text", "text": "Le Citadelle Jardin d'Été est un gin artisanal français, produit par la maison Maison Ferrand. Inspiré par le jardin du Château de Bonbonnet, ce gin célèbre les saveurs estivales avec une recette unique intégrant des ingrédients comme le melon charentais, le yuzu, le citron et l'orange. Avec un taux d'alcool de 41,5 %, il offre une expérience aromatique fraîche et fruitée."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fruitées : Melon charentais, citron et yuzu."}, {"type": "text", "text": "Touches florales : Subtiles et élégantes."}, {"type": "text", "text": "Finale équilibrée : Fraîche et légèrement sucrée."}, {"type": "text", "text": "Le Citadelle Jardin d'Été est parfait pour des cocktails comme le Gin Tonic ou le French 75, mais il peut également être dégusté pur pour apprécier pleinement ses arômes. Ce gin a été récompensé par plusieurs prix prestigieux, notamment une double médaille d'or au Bartender Spirits Awards."}]}, {"id": 86, "name": "Gin ford's", "category": "Gins", "abv": 45.0, "blocks": [{"type": "text", "text": "Le Fords Gin est un gin artisanal de style London Dry, conçu spécifiquement pour les cocktails. Créé en collaboration entre Simon Ford, un expert en spiritueux, et Charles Maxwell, un maître distillateur de la 8e génération, ce gin est produit à Londres par Thames Distillers. Il est élaboré à partir de 9 plantes botaniques soigneusement sélectionnées, notamment le genièvre, la coriandre, le jasmin, le pamplemousse et la racine d'angélique."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fraîches : Genièvre et agrumes."}, {"type": "text", "text": "Touches florales : Jasmin pour une élégance subtile."}, {"type": "text", "text": "Finale équilibrée : Douce et légèrement épicée."}, {"type": "text", "text": "Avec un taux d'alcool de 45 %, le Fords Gin est parfait pour des cocktails classiques comme le Martini, le Negroni, ou le Gin Tonic. Il est souvent considéré comme un \"gin de barman\" en raison de sa polyvalence et de son équilibre."}]}, {"id": 87, "name": "Gin Hendrick's", "category": "Gins", "abv": 41.4, "blocks": [{"type": "text", "text": "Le Hendrick's Gin est un gin écossais artisanal, produit par la maison William Grant & Sons. Ce gin est célèbre pour son infusion unique de rose et de concombre, qui lui confère un profil aromatique délicat et inhabituel. Élaboré dans de petits alambics, il est distillé avec un mélange de plantes botaniques classiques comme le genièvre, la coriandre, et les zestes d'agrumes."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes florales : Rose pour une élégance subtile."}, {"type": "text", "text": "Touches fraîches : Concombre et agrumes."}, {"type": "text", "text": "Finale équilibrée : Douce et légèrement épicée."}, {"type": "text", "text": "Avec un taux d'alcool de 41,4 %, le Hendrick's Gin est parfait pour des cocktails comme le Gin Tonic, le Martini, ou même des créations plus audacieuses. Il peut également être dégusté pur pour apprécier pleinement ses arômes uniques."}]}, {"id": 88, "name": "Hendrick's grand cabaret", "category": "Gins", "abv": 43.4, "blocks": [{"type": "text", "text": "Le Hendrick's Grand Cabaret est une édition limitée de gin produite par la maison Hendrick's, célèbre pour ses créations audacieuses et innovantes. Inspiré par les cabarets parisiens du début du XXe siècle, ce gin met en avant des saveurs de fruits à noyau comme la pêche, l'abricot et la cerise, combinées à des notes florales de rose et des herbes douces. Avec un taux d'alcool de 43,4 %, il offre une expérience sensorielle riche et élégante."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fruitées : Pêche, abricot et cerise."}, {"type": "text", "text": "Touches florales : Rose pour une élégance subtile."}, {"type": "text", "text": "Finale équilibrée : Douce et légèrement herbacée."}, {"type": "text", "text": "Ce gin est parfait pour des cocktails sophistiqués comme le Grand Cabaret Royale, qui combine ce gin avec du jus de canneberge, du jus de citron vert, du sirop simple et du champagne ou vin mousseux pour une touche festive. Il peut également être dégusté avec du tonic pour une version plus classique."}]}, {"id": 89, "name": "Hendrick's flora adora", "category": "Gins", "abv": 43.4, "blocks": [{"type": "text", "text": "Le Hendrick's Flora Adora est une édition limitée de gin écossais, produite par la maison Hendrick's dans le cadre de leur collection \"Cabinet of Curiosities\". Ce gin célèbre les arômes floraux inspirés des jardins en fleurs, avec des plantes botaniques soigneusement sélectionnées comme la lavande, la rose, l'hibiscus et la camomille. Avec un taux d'alcool de 43,4 %, il offre une expérience aromatique riche et délicate."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes florales : Lavande, rose et hibiscus pour une douceur parfumée."}, {"type": "text", "text": "Touches herbacées : Coriandre et menthe pour un équilibre frais."}, {"type": "text", "text": "Finale élégante : Légèrement sucrée et herbacée."}, {"type": "text", "text": "Le Flora Adora est parfait pour des cocktails comme le Wildgarden Cup, qui mélange ce gin avec du concombre, des framboises, de la menthe et de l'eau gazeuse citronnée. Il peut également être dégusté avec du tonic et une tranche de concombre pour une version plus classique."}]}, {"id": 90, "name": "Gin Herbes folles", "category": "Gins", "abv": 43.0, "blocks": [{"type": "text", "text": "Le Gin Les Herbes Folles est un gin artisanal québécois produit par la distillerie La Société Secrète, située en Gaspésie. Ce gin est élaboré à partir d'une base d'orge et de blé malté québécois, brassé et fermenté sur place. Il est infusé avec une dizaine d'herbes sauvages cueillies à la main dans la région gaspésienne, ce qui lui confère un profil aromatique unique et authentique."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes herbacées : Fraîches et complexes, avec une touche végétale."}, {"type": "text", "text": "Touches boisées : Subtiles, grâce à l'affinage en barriques de chêne."}, {"type": "text", "text": "Finale équilibrée : Douce et légèrement épicée."}, {"type": "text", "text": "Avec un taux d'alcool de 43 %, le Gin Les Herbes Folles est idéal pour des cocktails comme le Gin Tonic ou le Old Fashioned, mais il peut également être dégusté pur pour apprécier pleinement ses arômes."}]}, {"id": 91, "name": "KM 12", "category": "Gins", "abv": 40.0, "blocks": [{"type": "text", "text": "Le KM12 est un gin artisanal québécois produit par la Distillerie du Fjord, située dans la région des Monts-Valin. Ce gin est inspiré par la richesse de la forêt boréale et est élaboré avec des ingrédients locaux soigneusement cueillis à la main, tels que le bourgeon de sapin baumier, le poivre des dunes, le nard des pinèdes, les feuilles de framboisier sauvage et le myrique baumier."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes boisées : Sapin baumier et myrique baumier."}, {"type": "text", "text": "Touches épicées : Poivre des dunes et nard des pinèdes."}, {"type": "text", "text": "Finale fraîche et fruitée : Grâce aux feuilles de framboisier sauvage."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, le KM12 est parfait pour être dégusté pur, sur glace, ou dans des cocktails comme le Gin Tonic. Ce gin offre une expérience gustative qui évoque une promenade dans la forêt boréale québécoise."}, {"type": "text", "text": "Koi :"}, {"type": "text", "text": "Le Gin Koï est un gin artisanal québécois produit par la Distillerie La Manufacture, située à Sainte-Agathe-des-Monts. Ce gin s'inspire de la carpe Koï, symbole d'ambition et de persévérance, et reflète ces valeurs dans sa création. Élaboré à partir de baies de genièvre, de gingembre biologique québécois et de citronnelle, il offre un profil aromatique unique et audacieux."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes épicées : Gingembre pour une chaleur subtile."}, {"type": "text", "text": "Touches fraîches : Citronnelle pour une vivacité équilibrée."}, {"type": "text", "text": "Finale harmonieuse : Douce et légèrement piquante."}, {"type": "text", "text": "Avec un taux d'alcool de 41 %, le Gin Koï est parfait pour accompagner des mets asiatiques ou pour des cocktails comme le Gin Tonic ou le Collins au Gingembre et Citronnelle. Il peut également être dégusté pur pour apprécier pleinement ses arômes."}]}, {"id": 92, "name": "Madison breakfast gin", "category": "Gins", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Madison Park Breakfast Gin est un gin artisanal québécois produit par la Distillerie 1769, située à Montréal. Ce gin unique est distillé avec de la bergamote, ce qui lui confère des arômes doux et invitants de fleur d'oranger. Il est ensuite infusé avec un mélange de thés, notamment du thé Earl Grey, qui lui donne sa couleur ambrée riche et ses notes aromatiques distinctives."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes florales : Fleur d'oranger et bergamote."}, {"type": "text", "text": "Touches herbacées : Thé Earl Grey et coriandre."}, {"type": "text", "text": "Finale épicée : Cannelle et poivre subtil."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, ce gin est parfait pour des cocktails comme le Breakfast 75, qui combine ce gin avec du jus de citron, du sirop simple et du vin mousseux. Il peut également être dégusté pur, sur glace, ou avec une touche de citron pour apprécier pleinement ses arômes."}]}, {"id": 93, "name": "Malfy Rosa", "category": "Gins", "abv": 41.0, "blocks": [{"type": "text", "text": "Le Malfy Gin Rosa est un gin italien raffiné, produit par la maison Malfy. Ce gin se distingue par son infusion de pamplemousse rose sicilien et de citrons italiens, combinée à des plantes botaniques soigneusement sélectionnées, comme le genièvre et la rhubarbe. Avec un taux d'alcool de 41 %, il offre une expérience aromatique fraîche et fruitée."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fruitées : Pamplemousse rose et citron pour une fraîcheur vive."}, {"type": "text", "text": "Touches herbacées : Genièvre et rhubarbe pour un équilibre subtil."}, {"type": "text", "text": "Finale élégante : Douce et légèrement acidulée."}, {"type": "text", "text": "Le Malfy Gin Rosa est parfait pour des cocktails comme le Gin Tonic ou le Amalfi Sunset Spritz, qui combine ce gin avec du prosecco et de l'eau gazeuse. Il peut également être dégusté pur, sur glace, pour apprécier pleinement ses arômes."}]}, {"id": 94, "name": "Menaud", "category": "Gins", "abv": 42.0, "blocks": [{"type": "text", "text": "Le Gin Menaud est un gin artisanal québécois produit par la Distillerie Menaud, située dans la région de Charlevoix. Ce gin est élaboré à partir d'une base de blé et de seigle cultivés sur l'Isle-aux-Coudres, et il est distillé trois fois pour obtenir une pureté exceptionnelle. Lors de la troisième distillation, des plantes botaniques locales sont infusées, ce qui donne au gin son caractère unique."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes boisées et citronnées : Équilibrées par des arômes salins provenant de la salicorne."}, {"type": "text", "text": "Touches florales et épicées : Baie de genièvre, coriandre, épinette noire et poivre d'aulne."}, {"type": "text", "text": "Finale longue et complexe : Avec une fraîcheur boréale."}, {"type": "text", "text": "Avec un taux d'alcool de 42 %, le Gin Menaud est idéal pour des cocktails comme le Gin Tonic ou le Martini, mais il peut également être dégusté pur pour apprécier pleinement ses arômes."}]}, {"id": 95, "name": "Monkey 47", "category": "Gins", "abv": 47.0, "blocks": [{"type": "text", "text": "Le Monkey 47 Schwarzwald Dry Gin est un gin artisanal allemand, produit dans la région de la Forêt-Noire. Ce gin est célèbre pour sa complexité aromatique, grâce à l'utilisation de 47 plantes botaniques, dont des baies de genièvre, des agrumes, des herbes et des épices. Avec un taux d'alcool de 47 %, il est distillé en petites quantités pour garantir une qualité exceptionnelle."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes herbacées et épicées : Genièvre, coriandre et poivre."}, {"type": "text", "text": "Touches fruitées : Agrumes et fruits rouges."}, {"type": "text", "text": "Finale équilibrée : Longue et raffinée, avec une fraîcheur boisée."}, {"type": "text", "text": "Le Monkey 47 est parfait pour des cocktails comme le Gin Tonic, le Negroni, ou même dégusté pur pour apprécier pleinement ses arômes complexes. Ce gin est souvent considéré comme l'un des meilleurs au monde pour sa richesse et son équilibre."}]}, {"id": 96, "name": "Ubald vallée", "category": "Gins", "abv": 43.0, "blocks": [{"type": "text", "text": "Le Ubald Vallée Herbacé est un gin artisanal québécois produit par la Distillerie Ubald, située à Saint-Ubalde, dans la région de Portneuf. Ce gin met en avant des ingrédients locaux, notamment le romarin, les baies de genièvre et la comptonie voyageuse, qui lui confèrent un profil aromatique unique et végétal. Avec un taux d'alcool de 43 %, il est parfait pour des cocktails ou une dégustation pure."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes herbacées : Romarin et comptonie voyageuse."}, {"type": "text", "text": "Touches fraîches : Baies de genièvre pour un équilibre subtil."}, {"type": "text", "text": "Finale élégante : Douce et légèrement végétale."}, {"type": "text", "text": "Ce gin est idéal pour des cocktails comme le Gin Tonic ou des créations plus audacieuses."}]}, {"id": 97, "name": "Roku", "category": "Gins", "abv": 43.0, "blocks": [{"type": "text", "text": "Le Roku Gin est un gin artisanal japonais produit par la maison Suntory, célèbre pour ses spiritueux de qualité. Ce gin se distingue par l'utilisation de 6 plantes botaniques japonaises, chacune représentant une saison, comme la fleur et la feuille de sakura (printemps), le thé sencha et le thé gyokuro (été), le poivre sansho (automne) et le zeste de yuzu (hiver). Avec un taux d'alcool de 43 %, il offre une expérience aromatique équilibrée et raffinée."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes florales : Fleur de sakura pour une douceur élégante."}, {"type": "text", "text": "Touches épicées : Poivre sansho pour une chaleur subtile."}, {"type": "text", "text": "Finale fraîche et citronnée : Grâce au zeste de yuzu."}, {"type": "text", "text": "Le Roku Gin est parfait pour des cocktails comme le Gin Tonic au gingembre ou le Sakura Aperitif, mais il peut également être dégusté pur pour apprécier pleinement ses arômes."}]}, {"id": 98, "name": "Gin tanqueray", "category": "Gins", "abv": 43.1, "blocks": [{"type": "text", "text": "Le Tanqueray London Dry Gin est un gin classique et emblématique, connu pour son élégance et son équilibre parfait. Créé en 1830 par Charles Tanqueray, ce gin est élaboré avec un mélange simple mais exquis de plantes botaniques, dont les baies de genièvre, la coriandre, la racine d'angélique et la réglisse, ce qui lui confère un profil aromatique raffiné."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fraîches : Baies de genièvre pour une saveur vive et classique."}, {"type": "text", "text": "Touches épicées : Coriandre et réglisse pour un équilibre subtil."}, {"type": "text", "text": "Finale sèche : Élégante et harmonieuse, avec une douceur délicate."}, {"type": "text", "text": "Avec un taux d'alcool de 43,1 %, le Tanqueray London Dry Gin est parfait pour des cocktails classiques comme le Gin Tonic, le Martini Dry, ou le Negroni. Il peut également être dégusté pur pour apprécier pleinement ses arômes."}]}, {"id": 99, "name": "Aupale", "category": "Vodka", "abv": 40.0, "blocks": [{"type": "text", "text": "L'Aupale Vodka est une vodka québécoise haut de gamme, produite par la BluePearl Distillerie. Ce spiritueux est élaboré à partir d'eau provenant des glaciers du nord du Québec, reconnue pour sa pureté exceptionnelle. Distillée 7 fois, elle offre une texture soyeuse et une grande finesse, idéale pour être savourée telle quelle ou utilisée dans des cocktails élégants."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes délicates : Herbacées et légèrement épicées."}, {"type": "text", "text": "Touches citronnées : Subtiles et rafraîchissantes."}, {"type": "text", "text": "Finale douce : Parfaite pour une dégustation pure."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, l'Aupale Vodka est un choix incontournable pour les amateurs de spiritueux raffinés."}]}, {"id": 100, "name": "Belvedere", "category": "Vodka", "abv": 40.0, "blocks": [{"type": "text", "text": "La Belvedere Vodka est une vodka haut de gamme produite en Pologne, dans la plus ancienne distillerie de vodka au monde, située à Zyrardów. Elle est élaborée à partir de seigle polonais et d'eau purifiée, sans additifs, ce qui lui confère une pureté exceptionnelle et un profil aromatique riche. Avec un taux d'alcool de 40 %, elle est distillée selon des méthodes traditionnelles pour garantir une qualité supérieure."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes douces : Vanille et amande."}, {"type": "text", "text": "Touches épicées : Poivre blanc et gingembre."}, {"type": "text", "text": "Finale élégante : Longue et soyeuse."}, {"type": "text", "text": "La Belvedere Vodka est idéale pour des cocktails sophistiqués comme le Belvedere Martini, le Espresso Martini, ou le Cosmopolitan, mais elle peut également être dégustée pure, sur glace, pour apprécier pleinement ses arômes."}]}, {"id": 101, "name": "Grey Goose", "category": "Vodka", "abv": 40.0, "blocks": [{"type": "text", "text": "La Grey Goose Vodka est une vodka française haut de gamme, produite dans la région de Cognac. Elle est élaborée à partir de blé tendre d'hiver de Picardie et d'eau de source de Gensac-La-Pallue, ce qui lui confère une pureté exceptionnelle et un profil aromatique raffiné. Avec un taux d'alcool de 40 %, elle est distillée selon des méthodes traditionnelles pour garantir une qualité supérieure."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes douces : Vanille et amande."}, {"type": "text", "text": "Touches épicées : Poivre blanc et gingembre."}, {"type": "text", "text": "Finale élégante : Longue et soyeuse."}, {"type": "text", "text": "La Grey Goose Vodka est idéale pour des cocktails sophistiqués comme le Espresso Martini, le Cosmopolitan, ou le Moscow Mule, mais elle peut également être dégustée pure, sur glace, pour apprécier pleinement ses arômes."}]}, {"id": 102, "name": "Grey goose la poire", "category": "Vodka", "abv": 40.0, "blocks": [{"type": "text", "text": "La Grey Goose La Poire est une vodka aromatisée haut de gamme, produite en France par la maison Grey Goose. Elle est infusée avec des poires d'Anjou, un ingrédient classique de la gastronomie française, ce qui lui confère un profil aromatique délicat et fruité. Avec un taux d'alcool de 40 %, cette vodka est parfaite pour des cocktails élégants ou une dégustation pure."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fruitées : Poires d'Anjou pour une douceur naturelle."}, {"type": "text", "text": "Touches florales : Subtiles et raffinées."}, {"type": "text", "text": "Finale équilibrée : Large et ronde en bouche."}, {"type": "text", "text": "La Grey Goose La Poire est idéale pour des cocktails comme le French Pear Martini, le La Poire Fabuleaux, ou le Ginger Joy, qui mettent en valeur ses saveurs uniques."}]}, {"id": 103, "name": "Ketel One", "category": "Vodka", "abv": 40.0, "blocks": [{"type": "text", "text": "La Ketel One Vodka est une vodka haut de gamme produite par la famille Nolet, une distillerie néerlandaise avec plus de 300 ans d'histoire. Elle est élaborée à partir de blé européen soigneusement sélectionné et distillée dans des alambics en cuivre, ce qui lui confère une texture douce et un goût pur. Avec un taux d'alcool de 40 %, elle est reconnue pour sa qualité exceptionnelle et sa polyvalence."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fraîches : Subtiles touches d'agrumes."}, {"type": "text", "text": "Texture veloutée : Une douceur en bouche remarquable."}, {"type": "text", "text": "Finale nette : Longue et élégante."}, {"type": "text", "text": "La Ketel One Vodka est idéale pour des cocktails comme le Martini classique, le Bloody Mary, ou le Vodka Tonic, mais elle peut également être dégustée pure ou sur glace."}]}, {"id": 104, "name": "Chopin", "category": "Vodka", "abv": 40.0, "blocks": [{"type": "text", "text": "La Chopin Potato Vodka est l'une des vodkas les plus raffinées et uniques au monde. Produite en Pologne par la distillerie Polmos Siedlce, elle est entièrement élaborée à partir de pommes de terre de qualité supérieure, soigneusement cultivées dans la région de Podlasie. Cette vodka se distingue par sa richesse et sa texture crémeuse, qui reflètent le savoir-faire artisanal de ses créateurs. Elle est distillée quatre fois pour garantir une pureté et une qualité exceptionnelles."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Texture : Crémeuse et onctueuse, avec une douceur en bouche remarquable."}, {"type": "text", "text": "Notes douces : Subtiles nuances terreuses et beurrées."}, {"type": "text", "text": "Finale élégante : Longue, ronde et parfaitement équilibrée."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, la Chopin Potato Vodka est idéale pour une dégustation pure, sur glace ou en martini pour apprécier pleinement sa richesse. Elle est également une excellente base pour des cocktails haut de gamme."}]}, {"id": 105, "name": "Monarc", "category": "Vodka", "abv": 40.0, "blocks": [{"type": "text", "text": "La Monarc Vodka est une vodka québécoise haut de gamme produite par la Distillerie Wabasso, située à Trois-Rivières. Elle est élaborée à partir de blé 100 % québécois et d'eau de source Radnor, reconnue pour sa pureté exceptionnelle. Avec un taux d'alcool de 40 %, cette vodka offre une expérience raffinée et équilibrée, idéale pour les amateurs de spiritueux de qualité."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes douces : Subtiles et élégantes, avec une texture soyeuse."}, {"type": "text", "text": "Touches fraîches : Légèrement herbacées et minérales."}, {"type": "text", "text": "Finale nette : Longue et harmonieuse."}, {"type": "text", "text": "La Monarc Vodka est parfaite pour être dégustée pure, sur glace, ou dans des cocktails sophistiqués comme le Martini classique ou le Vodka Tonic."}]}, {"id": 106, "name": "Stoli", "category": "Vodka", "abv": 40.0, "blocks": [{"type": "text", "text": "La Stoli Gluten-Free Vodka est une vodka haut de gamme spécialement conçue pour les personnes sensibles au gluten. Elle est élaborée à partir de maïs et de sarrasin, ce qui garantit qu'elle est totalement sans gluten. Distillée avec soin et filtrée à travers du charbon de bois et du sable de quartz, elle offre une pureté exceptionnelle et une texture douce. Avec un taux d'alcool de 40 %, elle est idéale pour les amateurs de spiritueux raffinés."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes douces : Subtiles et équilibrées."}, {"type": "text", "text": "Texture veloutée : Une douceur en bouche remarquable."}, {"type": "text", "text": "Finale nette : Longue et élégante."}, {"type": "text", "text": "La Stoli Gluten-Free Vodka est parfaite pour des cocktails comme le Cosmopolitan, le Vodka Tonic, ou même dégustée pure pour apprécier pleinement ses arômes."}]}, {"id": 107, "name": "Casamigos", "category": "Téquila & Mezcal", "abv": 40.0, "blocks": [{"type": "text", "text": "La Casamigos Blanco est une tequila ultra-premium produite au Mexique, dans la région de Jalisco. Elle est élaborée à partir d'agaves bleus Weber 100 % récoltés à la main, cuits lentement pendant 72 heures dans des fours traditionnels en briques, puis fermentés pendant 80 heures, ce qui est plus long que la moyenne, pour développer des saveurs riches et complexes."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fraîches : Agrumes et vanille."}, {"type": "text", "text": "Touches herbacées : Subtiles et équilibrées."}, {"type": "text", "text": "Finale douce : Légèrement sucrée, avec une texture soyeuse."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, la Casamigos Blanco est parfaite pour être dégustée pure, sur glace, ou dans des cocktails comme la Margarita classique ou le Paloma."}]}, {"id": 108, "name": "El Jimador", "category": "Téquila & Mezcal", "abv": 40.0, "blocks": [{"type": "text", "text": "La El Jimador Blanco est une tequila mexicaine produite par la maison Casa Herradura, située dans la région de Jalisco. Cette tequila est élaborée à partir d'agaves bleus Weber 100 % récoltés à la main et est non vieillie, ce qui lui confère une fraîcheur et une pureté exceptionnelles. Avec un taux d'alcool de 40 %, elle est idéale pour les cocktails ou une dégustation pure."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fraîches : Agrumes et melon."}, {"type": "text", "text": "Touches épicées : Subtiles nuances de poivre et d'épices."}, {"type": "text", "text": "Finale douce : Avec des saveurs de concombre et une texture moelleuse."}, {"type": "text", "text": "La El Jimador Blanco est parfaite pour des cocktails comme la Margarita classique, le Paloma, ou même le Tequila Sunrise."}]}, {"id": 109, "name": "Del maguey vida", "category": "Téquila & Mezcal", "abv": 42.0, "blocks": [{"type": "text", "text": "Le Del Maguey Vida Mezcal est un mezcal artisanal produit dans le village de San Luis del Rio, au Mexique. Ce spiritueux est élaboré à partir d'agave Espadín, fermenté naturellement et distillé deux fois dans des alambics en cuivre chauffés au bois. Avec un taux d'alcool de 42 %, il offre un profil aromatique riche et complexe."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fruitées : Figues, agrumes et miel."}, {"type": "text", "text": "Touches épicées : Gingembre et cannelle."}, {"type": "text", "text": "Finale fumée : Subtile et équilibrée."}, {"type": "text", "text": "Le Del Maguey Vida Mezcal est idéal pour être dégusté pur, accompagné de mets fumés ou épicés, ou utilisé dans des cocktails comme le Vida Margarita ou le Oaxaca Old Fashioned."}]}, {"id": 110, "name": "Don Julio blanco", "category": "Téquila & Mezcal", "abv": 40.0, "blocks": [{"type": "text", "text": "La Don Julio Blanco est une tequila mexicaine ultra-premium, produite dans la région de Jalisco. Elle est élaborée à partir d'agaves bleus Weber 100 % récoltés à la main et distillée deux fois pour garantir une pureté exceptionnelle. Cette tequila, également connue sous le nom de \"tequila argentée\", est non vieillie, ce qui lui confère une fraîcheur et une vivacité uniques."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fraîches : Agrumes comme le citron, la lime et le pamplemousse."}, {"type": "text", "text": "Touches herbacées : Subtiles et équilibrées."}, {"type": "text", "text": "Finale douce : Avec une texture soyeuse et une légère touche poivrée."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, la Don Julio Blanco est idéale pour être dégustée pure, sur glace, ou dans des cocktails comme la Margarita classique ou le Paloma."}]}, {"id": 111, "name": "Don Julio reposado", "category": "Téquila & Mezcal", "abv": 40.0, "blocks": [{"type": "text", "text": "La Don Julio Reposado est une tequila mexicaine ultra-premium, produite dans la région de Jalisco. Elle est élaborée à partir d'agaves bleus Weber 100 % récoltés à la main et vieillie pendant 8 mois dans des fûts de chêne blanc américain, soit quatre fois plus longtemps que la norme de l'industrie. Cette maturation lui confère une couleur ambrée dorée et un profil aromatique riche et velouté."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes douces : Chocolat noir, vanille et cannelle."}, {"type": "text", "text": "Touches fruitées : Fruits à noyau mûrs et pomme-caramel."}, {"type": "text", "text": "Finale chaleureuse : Soyeuse, avec des essences de fruits séchés et de noix."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, la Don Julio Reposado est idéale pour être dégustée pure, sur glace, ou dans des cocktails comme le Paloma ou le Tequila Old Fashioned."}]}, {"id": 112, "name": "Don Julio Anejo", "category": "Téquila & Mezcal", "abv": 40.0, "blocks": [{"type": "text", "text": "La Don Julio Añejo est une tequila mexicaine ultra-premium, produite dans la région de Jalisco. Elle est vieillie pendant 18 mois dans des fûts de chêne blanc américain, ce qui lui confère une richesse et une complexité exceptionnelles. Cette tequila est une démonstration parfaite de l'art de l'élaboration des tequilas vieillies."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fruitées : Agrumes comme la lime, le pamplemousse et la mandarine."}, {"type": "text", "text": "Touches sucrées : Caramel écossais et miel sauvage."}, {"type": "text", "text": "Finale boisée : Avec des nuances d'épices et de vanille."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, la Don Julio Añejo est idéale pour être dégustée pure, sur glace, ou dans des cocktails comme le Tequila Old Fashioned ou le Añejo Sour."}]}, {"id": 113, "name": "Espolon reposado", "category": "Téquila & Mezcal", "abv": 40.0, "blocks": [{"type": "text", "text": "La Espolòn Reposado est une tequila mexicaine artisanale, produite dans la région de Los Altos, à Jalisco. Elle est élaborée à partir d'agave bleu Weber 100 %, récolté à la main, et vieillie pendant 6 mois dans des fûts de chêne américain. Ce vieillissement lui confère une couleur dorée et un profil aromatique riche et complexe."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes épicées : Caramel, vanille et cannelle."}, {"type": "text", "text": "Touches fruitées : Fruits tropicaux mûrs et agave caramélisé."}, {"type": "text", "text": "Finale douce et épicée : Avec une texture ronde et équilibrée."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, la Espolòn Reposado est idéale pour être dégustée pure, sur glace, ou dans des cocktails comme la Margarita épicée ou le Tequila Old Fashioned."}]}, {"id": 114, "name": "Gran Mayan", "category": "Téquila & Mezcal", "abv": 40.0, "blocks": [{"type": "text", "text": "La Gran Mayan Silver est une tequila Blanco ultra-premium, produite artisanalement dans la région de Jalisco, au Mexique. Elle est élaborée à partir d'agave bleu Weber 100 %, récolté à la main, et distillée trois fois pour garantir une pureté exceptionnelle et une texture douce. Cette tequila cristalline est parfaite pour les amateurs de spiritueux raffinés."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fraîches : Agave pur et agrumes."}, {"type": "text", "text": "Touches légères : Subtiles nuances herbacées."}, {"type": "text", "text": "Finale nette : Douce et équilibrée."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, la Gran Mayan Silver est idéale pour être dégustée pure, sur glace, ou dans des cocktails comme la Margarita classique ou le Paloma."}]}, {"id": 115, "name": "Mescalosfera", "category": "Téquila & Mezcal", "abv": null, "blocks": [{"type": "text", "text": "Mezcalosfera est une marque de mezcal artisanal produite par Mezcaloteca, un bar renommé situé à Oaxaca, au Mexique. Ce mezcal est connu pour ses petites productions en lots limités, mettant en valeur des agaves rares et des méthodes de fabrication traditionnelles. Chaque bouteille de Mezcalosfera est soigneusement étiquetée avec des informations détaillées sur le type d'agave, le processus de distillation et le maître mezcalier."}, {"type": "heading", "text": "Points forts"}, {"type": "text", "text": "Agaves rares : Utilisation d'agaves comme le Tobala, le Madrecuixe et d'autres variétés sauvages."}, {"type": "text", "text": "Méthodes artisanales : Distillation en alambics en cuivre ou en argile, fermentation naturelle avec des levures sauvages."}, {"type": "text", "text": "Petits lots : Chaque production est unique, avec des saveurs distinctes et complexes."}, {"type": "text", "text": "Mezcalosfera est idéal pour les amateurs de mezcal qui recherchent des spiritueux authentiques et uniques."}]}, {"id": 116, "name": "Serpiente Mezcal", "category": "Téquila & Mezcal", "abv": 45.0, "blocks": [{"type": "text", "text": "La Serpiente Emplumada Mezcal est un mezcal artisanal produit au Mexique, mettant en valeur des méthodes traditionnelles et des ingrédients de qualité. Ce mezcal est souvent élaboré à partir d'agave Espadín, avec des lots limités qui garantissent une attention particulière à chaque étape de la production. Il est apprécié pour son profil aromatique riche et ses notes fumées caractéristiques."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fruitées : Pomme verte et agave cuit."}, {"type": "text", "text": "Touches fumées : Subtiles et équilibrées."}, {"type": "text", "text": "Finale douce : Avec des nuances de caramel et de chêne."}, {"type": "text", "text": "Avec un taux d'alcool souvent autour de 45 %, ce mezcal est idéal pour être dégusté pur ou dans des cocktails comme le Mezcal Margarita ou le Oaxaca Old Fashioned."}]}, {"id": 117, "name": "Très generationes", "category": "Téquila & Mezcal", "abv": 40.0, "blocks": [{"type": "text", "text": "La Tres Generaciones Plata est une tequila Blanco ultra-premium produite par la distillerie La Perseverancia au Mexique. Elle est élaborée à partir d'agave bleu Weber 100 % récolté à la main et est distillée trois fois, ce qui lui confère une pureté exceptionnelle et une douceur remarquable. Cette tequila non vieillie est idéale pour les amateurs de saveurs fraîches et authentiques."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fraîches : Agave pur et agrumes."}, {"type": "text", "text": "Touches florales : Subtiles et élégantes."}, {"type": "text", "text": "Finale nette : Douce et équilibrée, sans amertume."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, la Tres Generaciones Plata est parfaite pour être dégustée pure, sur glace, ou dans des cocktails comme la Margarita classique ou le Paloma."}]}, {"id": 118, "name": "Diplomatico mantuano", "category": "Rhums", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Diplomatico Mantuano est un rhum brun vénézuélien, produit par Destilerias Unidas S.A., et reconnu pour son profil aromatique riche et équilibré. Vieilli jusqu'à 8 ans dans des fûts ayant contenu du bourbon et du malt, ce rhum est un hommage à Don Juancho Nieto Meléndez, un passionné de spiritueux et d'exploration."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes boisées : Chêne et épices."}, {"type": "text", "text": "Touches fruitées : Fruits secs comme les figues et les abricots."}, {"type": "text", "text": "Finale douce : Vanille et caramel."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, le Diplomatico Mantuano est idéal pour être dégusté pur, sur glace, ou dans des cocktails comme le Mai Tai ou le Dark and Stormy."}]}, {"id": 119, "name": "Diplomatico reserva exclusiva", "category": "Rhums", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Diplomático Reserva Exclusiva est un rhum brun ultra-premium, produit au Venezuela par Destilerías Unidas S.A.. Ce rhum est élaboré à partir de mélasse de haute qualité et distillé dans des alambics en cuivre, puis vieilli jusqu'à 12 ans dans des fûts de chêne ayant contenu du bourbon et du whisky. Il est reconnu pour son profil aromatique riche et sa douceur exceptionnelle, en faisant un choix idéal pour les amateurs de rhums à déguster."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes sucrées : Toffee, caramel et vanille."}, {"type": "text", "text": "Touches fruitées : Zeste d'orange et fruits secs."}, {"type": "text", "text": "Finale complexe : Avec des nuances de réglisse et de chêne."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, le Diplomático Reserva Exclusiva est parfait pour être dégusté pur, sur glace, ou dans des cocktails sophistiqués comme le Old Fashioned ou le Mai Tai."}]}, {"id": 120, "name": "Flor de cana 12", "category": "Rhums", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Flor de Caña 12 est un rhum ambré ultra-premium produit au Nicaragua par la distillerie Compañía Licorera de Nicaragua. Ce rhum est vieilli pendant 12 ans selon la méthode unique \"Slow Aged\", qui garantit un vieillissement naturel sans accélération artificielle. Il est reconnu pour son profil aromatique complexe et sa qualité exceptionnelle."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes sucrées : Vanille et caramel."}, {"type": "text", "text": "Touches fruitées : Fruits secs et zeste d'orange."}, {"type": "text", "text": "Finale boisée : Avec des nuances de chocolat noir et de clou de girofle."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, le Flor de Caña 12 est parfait pour être dégusté pur, sur glace, ou dans des cocktails sophistiqués comme le Rum Old Fashioned ou le Mai Tai."}]}, {"id": 121, "name": "Havana club 3 ans", "category": "Rhums", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Havana Club 3 Años est un rhum blanc cubain emblématique, vieilli pendant 3 ans pour développer un profil aromatique équilibré et complexe. Produit à partir de mélasses de canne à sucre locales, il est distillé et vieilli à Cuba, ce qui lui confère une authenticité unique."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fraîches : Canne à sucre et agrumes."}, {"type": "text", "text": "Touches fruitées : Subtiles nuances de banane et de poire."}, {"type": "text", "text": "Finale douce : Avec des notes de vanille et de chêne léger."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, le Havana Club 3 Años est parfait pour des cocktails classiques comme le Mojito, le Daiquiri, ou le Piña Colada, mais il peut également être dégusté pur pour apprécier ses saveurs."}]}, {"id": 122, "name": "Leblon", "category": "Rhums", "abv": 40.0, "blocks": [{"type": "text", "text": "La Leblon Cachaça est une eau-de-vie brésilienne artisanale, produite dans la région de Minas Gerais, au Brésil. Elle est élaborée à partir de canne à sucre fraîchement pressée, distillée en petits lots dans des alambics en cuivre, et vieillie jusqu'à 6 mois dans des fûts de cognac XO français. Cette méthode lui confère une douceur exceptionnelle et un profil aromatique complexe."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fruitées : Agrumes et fruits tropicaux."}, {"type": "text", "text": "Touches herbacées : Subtiles et fraîches."}, {"type": "text", "text": "Finale douce : Avec des nuances de vanille et de caramel."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, la Leblon Cachaça est idéale pour des cocktails comme la Caïpirinha, le Batida de Coco, ou même dégustée pure pour apprécier ses saveurs uniques."}]}, {"id": 123, "name": "Noroi esprit des caraïbes", "category": "Rhums", "abv": 0.5, "blocks": [{"type": "text", "text": "Le Noroi Esprit des Caraïbes est un spiritueux sans alcool produit par la Distillerie Noroi, située au Québec. Ce produit unique est conçu grâce à une technologie de distillation innovante qui permet de capturer les arômes subtils des ingrédients, souvent perdus dans une distillation classique. Il offre des saveurs délicates de mélasse et un mélange d'épices maison, rappelant les caractéristiques d'un rhum brun."}, {"type": "heading", "text": "Points forts"}, {"type": "text", "text": "Sans alcool : Avec un taux d'alcool de seulement 0,5 %, il est parfait pour les mocktails."}, {"type": "text", "text": "Profil aromatique : Mélasse, épices douces et une touche vanillée."}, {"type": "text", "text": "Polyvalence : Idéal pour des cocktails sans alcool ou à savourer pur."}]}, {"id": 124, "name": "Plantation barbados 5 ans", "category": "Rhums", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Plantation Barbados 5 ans est un rhum ambré de qualité supérieure, produit à la Barbade par la maison Maison Ferrand. Ce rhum est vieilli pendant 5 ans dans des fûts de bourbon à la Barbade, puis affiné en France dans des fûts de cognac, ce qui lui confère une complexité et une richesse uniques."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fruitées : Fruits tropicaux et banane mûre."}, {"type": "text", "text": "Touches sucrées : Vanille, caramel et miel."}, {"type": "text", "text": "Finale boisée : Avec des nuances d'épices et de chêne."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, le Plantation Barbados 5 ans est parfait pour être dégusté pur, sur glace, ou dans des cocktails comme le Mai Tai ou le Rum Old Fashioned."}]}, {"id": 125, "name": "Plantation 3*", "category": "Rhums", "abv": 41.2, "blocks": [{"type": "text", "text": "Le Plantation 3 Stars est un rhum blanc d'assemblage, produit par la maison Maison Ferrand. Ce rhum unique réunit des rhums provenant de trois régions des Caraïbes : la Barbade, la Jamaïque et Trinidad. Chaque île apporte ses caractéristiques distinctes : la Barbade pour l'équilibre, la Jamaïque pour la structure et Trinidad pour l'élégance. Avec un taux d'alcool de 41,2 %, il est idéal pour les amateurs de rhums polyvalents."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fruitées : Banane mûre, ananas confit et fruits tropicaux."}, {"type": "text", "text": "Touches sucrées : Sucre roux et vanille."}, {"type": "text", "text": "Finale épicée : Subtiles nuances florales et épicées."}, {"type": "text", "text": "Le Plantation 3 Stars est parfait pour des cocktails comme le Mojito, le Daiquiri, ou même le Piña Colada."}]}, {"id": 126, "name": "Plantation OFTD", "category": "Rhums", "abv": 69.0, "blocks": [{"type": "text", "text": "Le Plantation O.F.T.D. (Old Fashioned Traditional Dark) est un rhum overproof exceptionnellement puissant, produit par la maison Maison Ferrand. Ce rhum est un assemblage de rhums provenant de la Barbade, de la Jamaïque et de la Guyane, soigneusement sélectionnés pour leur caractère unique. Avec un taux d'alcool impressionnant de 69 %, il est conçu pour les amateurs de rhums intenses et les cocktails audacieux."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes sucrées : Caramel, vanille et mélasse."}, {"type": "text", "text": "Touches épicées : Cannelle et clou de girofle."}, {"type": "text", "text": "Finale puissante : Avec des nuances de chocolat noir et d'agrumes."}, {"type": "text", "text": "Le Plantation O.F.T.D. est parfait pour des cocktails comme le Zombie, le Mai Tai, ou tout autre mélange nécessitant un rhum riche et corsé."}]}, {"id": 127, "name": "Plantation original dark", "category": "Rhums", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Plantation Original Dark est un rhum ambré riche et complexe, produit par la maison Maison Ferrand. Ce rhum est un assemblage de rhums provenant de la Jamaïque et de la Barbade, vieillis d'abord sous le climat tropical des Caraïbes, puis affinés en France dans des fûts de chêne, selon la méthode unique de double maturation."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes sucrées : Caramel, vanille et mélasse."}, {"type": "text", "text": "Touches épicées : Cannelle, noix de muscade et clou de girofle."}, {"type": "text", "text": "Finale chaleureuse : Avec des nuances de chocolat noir et de fruits secs."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, le Plantation Original Dark est idéal pour des cocktails comme le Mai Tai, le Dark 'n' Stormy, ou même dégusté pur pour apprécier ses saveurs profondes."}]}, {"id": 128, "name": "Plantation peru", "category": "Rhums", "abv": 43.1, "blocks": [{"type": "text", "text": "Le Plantation Peru Millésime 2006 est un rhum exceptionnel produit au Pérou, dans la région de Chicama Valley. Ce rhum est élaboré à partir de mélasse et distillé en colonne, puis vieilli pendant 12 ans dans des fûts de bourbon au Pérou. Ensuite, il est affiné pendant 2 ans en France dans des fûts Ferrand, ce qui lui confère une complexité et une richesse uniques."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes sucrées : Chocolat noir et vanille."}, {"type": "text", "text": "Touches fruitées : Fruits exotiques et agrumes."}, {"type": "text", "text": "Finale épicée : Avec des nuances de cannelle et de fruits secs."}, {"type": "text", "text": "Avec un taux d'alcool de 43,1 %, le Plantation Peru est idéal pour être dégusté pur ou dans des cocktails sophistiqués."}]}, {"id": 129, "name": "Stiggins pineapple", "category": "Rhums", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Plantation Stiggins' Fancy Pineapple Rum est un rhum artisanal unique, produit par la maison Maison Ferrand. Ce rhum est élaboré en infusant des écorces d'ananas Victoria dans du rhum Plantation Original Dark, puis en distillant la chair d'ananas dans du rhum blanc. Le résultat est un rhum riche et aromatique, parfait pour les cocktails ou à déguster pur."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes fruitées : Ananas mûr et agrumes."}, {"type": "text", "text": "Touches sucrées : Vanille et caramel."}, {"type": "text", "text": "Finale épicée : Avec des nuances de cannelle et de clou de girofle."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, ce rhum est idéal pour des cocktails comme le Pineapple Daiquiri, le Mai Tai, ou même un Rum Old Fashioned."}]}, {"id": 130, "name": "Plantation XO", "category": "Rhums", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Plantation XO 20th Anniversary est un rhum ultra-premium produit par la maison Maison Ferrand pour célébrer les 20 ans d'excellence de leur maître assembleur, Alexandre Gabriel. Ce rhum est un assemblage de rhums de la Barbade, vieillis entre 12 et 20 ans dans des fûts de bourbon sous le climat tropical, puis affinés en France dans des fûts de cognac Ferrand, ce qui lui confère une richesse et une complexité exceptionnelles."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes sucrées : Vanille, caramel et chocolat au lait."}, {"type": "text", "text": "Touches fruitées : Fruits tropicaux et noix de coco."}, {"type": "text", "text": "Finale épicée : Avec des nuances de cannelle et de chêne."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, le Plantation XO est parfait pour être dégusté pur, sur glace, ou dans des cocktails sophistiqués comme le Rum Old Fashioned."}]}, {"id": 131, "name": "Trois rivières cuvée océan", "category": "Rhums", "abv": 42.0, "blocks": [{"type": "text", "text": "Le Trois Rivières Cuvée de l'Océan est un rhum blanc agricole unique, produit en Martinique par la célèbre distillerie Trois Rivières. Ce rhum est élaboré à partir de cannes à sucre cultivées sur la parcelle d'Anse Trabaud, située en bordure de l'océan Atlantique. Ce terroir exceptionnel confère à ce rhum des caractéristiques iodées et minérales distinctives."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes salines : Une touche iodée qui rappelle l'air marin."}, {"type": "text", "text": "Touches végétales : Subtiles nuances herbacées."}, {"type": "text", "text": "Finale fraîche : Avec des saveurs minérales et une belle légèreté."}, {"type": "text", "text": "Avec un taux d'alcool de 42 %, le Trois Rivières Cuvée de l'Océan est idéal pour des cocktails comme le Ti'Punch ou pour accompagner des fruits de mer et des plats à base de poisson."}]}, {"id": 132, "name": "Zacapa 23 solera", "category": "Rhums", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Zacapa 23 Solera est un rhum brun ultra-premium produit au Guatemala, célèbre pour son système de vieillissement unique appelé Sistema Solera. Ce processus combine des rhums âgés de 6 à 23 ans, vieillis dans une succession de fûts ayant contenu du whisky américain, du xérès et du vin Pedro Ximénez, ce qui lui confère une complexité et une richesse exceptionnelles."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Notes sucrées : Caramel, vanille et miel."}, {"type": "text", "text": "Touches fruitées : Raisins secs, abricots et zeste d'orange."}, {"type": "text", "text": "Finale épicée : Cannelle, noix de muscade et chocolat noir."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, le Zacapa 23 Solera est parfait pour être dégusté pur, sur glace, ou dans des cocktails sophistiqués comme le Zacapa Old Fashioned ou le Espresso Martini."}]}, {"id": 133, "name": "Auchentoshan 12 ans", "category": "Whisky", "abv": 40.0, "blocks": [{"type": "text", "text": "L'Auchentoshan 12 ans est un single malt écossais emblématique, produit dans les Lowlands. Ce whisky est triplement distillé, une caractéristique rare en Écosse, et vieilli pendant 12 ans dans des fûts de bourbon et de xérès, ce qui lui confère une douceur et une complexité remarquables."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de crème brûlée, agrumes et une touche de noisette."}, {"type": "text", "text": "En bouche : Saveurs douces de mandarine, caramel et une subtile fraîcheur herbacée."}, {"type": "text", "text": "Finale : Gingembre léger et une agréable touche de noix."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, l'Auchentoshan 12 ans est parfait pour être dégusté pur ou dans des cocktails comme le Glasgow Mule ou le Auchentoshan Manhattan ( rob roy )."}]}, {"id": 134, "name": "Ardbeg 10 ans", "category": "Whisky", "abv": 46.0, "blocks": [{"type": "text", "text": "L'Ardbeg 10 ans est un single malt emblématique de l'île d'Islay, en Écosse, réputé pour son caractère intensément tourbé et fumé. Ce whisky est non filtré à froid, ce qui préserve toute sa richesse aromatique et sa texture. Avec un taux d'alcool de 46 %, il est parfait pour les amateurs de whiskies puissants et complexes."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de fumée de tourbe, citron, et une touche de sel marin."}, {"type": "text", "text": "En bouche : Saveurs intenses de fumée, de poivre noir, et une douceur maltée équilibrée."}, {"type": "text", "text": "Finale : Longue et persistante, avec des nuances de café torréfié et de réglisse."}, {"type": "text", "text": "L'Ardbeg 10 ans est idéal pour être dégusté pur ou avec quelques gouttes d'eau pour révéler ses arômes."}]}, {"id": 135, "name": "Basil Hayden's", "category": "Whisky", "abv": 40.0, "blocks": [{"type": "text", "text": "Basil Hayden's Kentucky Straight Bourbon est un bourbon premium du Kentucky, produit par Beam Suntory. Il est connu pour sa douceur, son élégance et sa teneur élevée en seigle, qui lui confère des notes épicées distinctes et un profil aromatique raffiné. Ce bourbon est vieilli en fûts de chêne carbonisés et embouteillé avec un taux d'alcool de 40 %, ce qui le rend facile à déguster pour les connaisseurs comme pour les novices."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de caramel, vanille, chêne et une touche d'épices."}, {"type": "text", "text": "En bouche : Saveurs équilibrées de miel, épices douces (comme la cannelle) et agrumes."}, {"type": "text", "text": "Finale : Subtile, lisse, avec des nuances poivrées et herbacées."}, {"type": "text", "text": "Le Basil Hayden's Kentucky Straight Bourbon est parfait pour être dégusté pur, sur glace, ou dans des cocktails classiques comme le Old Fashioned ou le Manhattan. Ce bourbon se distingue également par son style, avec une bande de cuivre emblématique autour de la bouteille."}]}, {"id": 136, "name": "Basil hayden's dark rye", "category": "Whisky", "abv": 40.0, "blocks": [{"type": "text", "text": "Basil Hayden's Dark Rye est un whisky unique qui combine du seigle du Kentucky, du seigle canadien de l'Alberta Distillery, et une touche de porto californien. Ce mélange audacieux crée un profil aromatique riche et fruité, parfait pour les amateurs de whiskies complexes. Avec un taux d'alcool de 40 %, il est idéal pour les dégustations ou les cocktails sophistiqués."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de fruits noirs comme les cerises et les prunes, avec une touche de mélasse."}, {"type": "text", "text": "En bouche : Saveurs de caramel, fruits secs et une subtile épice de seigle."}, {"type": "text", "text": "Finale : Persistante, avec des nuances de fruits séchés et une douceur équilibrée."}, {"type": "text", "text": "Ce whisky est parfait pour des cocktails comme le Boulevardier, le Manhattan, ou même dégusté pur pour apprécier ses saveurs uniques."}]}, {"id": 137, "name": "Bearface 7 ans", "category": "Whisky", "abv": 42.5, "blocks": [{"type": "text", "text": "Le Bearface 7 ans Triple Oak est un whisky canadien unique, produit en Colombie-Britannique. Ce whisky est élaboré à partir d'un spiritueux de maïs vieilli pendant 7 ans et subit un processus de maturation en trois étapes, utilisant trois types de fûts différents :"}, {"type": "text", "text": "Fûts de chêne américain ex-bourbon : Pour des notes de vanille et de caramel."}, {"type": "text", "text": "Fûts de chêne français ayant contenu du vin rouge : Apportant des saveurs de fruits secs et une touche tannique."}, {"type": "text", "text": "Fûts de chêne hongrois vierges : Offrant des épices complexes et une légère fumée."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de miel, fruits secs et vanille."}, {"type": "text", "text": "En bouche : Saveurs de caramel, épices douces et une touche de fruits rouges."}, {"type": "text", "text": "Finale : Longue et épicée, avec des nuances boisées."}, {"type": "text", "text": "Avec un taux d'alcool de 42,5 %, le Bearface 7 ans est idéal pour être dégusté pur, sur glace, ou dans des cocktails comme le Old Fashioned."}]}, {"id": 138, "name": "Blanton's", "category": "Whisky", "abv": 46.5, "blocks": [{"type": "text", "text": "Blanton's est un bourbon emblématique, produit dans le Kentucky, aux États-Unis. Il est célèbre pour être le premier bourbon embouteillé à partir d'un fût unique, ce qui signifie que chaque bouteille provient d'un seul fût soigneusement sélectionné. Ce processus garantit une qualité exceptionnelle et des saveurs uniques à chaque lot."}, {"type": "heading", "text": "Points clés"}, {"type": "text", "text": "Origine : Distillé à la distillerie Buffalo Trace, à Frankfort, Kentucky."}, {"type": "text", "text": "Profil aromatique : Notes de caramel, vanille, épices douces et une touche de fruits secs."}, {"type": "text", "text": "Teneur en alcool : Environ 46,5 %, offrant une expérience riche et veloutée."}, {"type": "text", "text": "Bouteille iconique : Chaque bouteille est ornée d'un bouchon en forme de cheval de course, un clin d'œil à la culture du Kentucky."}, {"type": "text", "text": "Blanton's est parfait pour être dégusté pur ou avec une goutte d'eau pour révéler ses arômes."}]}, {"id": 139, "name": "Bowmore 15 ans", "category": "Whisky", "abv": 43.0, "blocks": [{"type": "text", "text": "Le Bowmore 15 ans est un single malt écossais produit sur l'île d'Islay, célèbre pour ses whiskies tourbés et fumés. Ce whisky est vieilli dans des fûts de bourbon et de xérès Oloroso, ce qui lui confère une richesse aromatique et une complexité exceptionnelle."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Raisins secs, cerises, et une touche de fumée."}, {"type": "text", "text": "En bouche : Saveurs de chocolat noir, fruits secs, et une subtile épice boisée."}, {"type": "text", "text": "Finale : Longue et chaleureuse, avec des nuances de fumée et de sel marin."}, {"type": "text", "text": "Avec un taux d'alcool de 43 %, le Bowmore 15 ans est idéal pour être dégusté pur ou avec une goutte d'eau pour révéler ses arômes."}]}, {"id": 140, "name": "Buffalo trace", "category": "Whisky", "abv": 45.0, "blocks": [{"type": "text", "text": "Buffalo Trace est un bourbon emblématique produit dans le Kentucky, aux États-Unis, par la célèbre Buffalo Trace Distillery, l'une des plus anciennes distilleries en activité. Ce bourbon est connu pour son équilibre parfait entre douceur et complexité, ce qui en fait un favori parmi les amateurs de whisky."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de caramel, vanille et une touche de menthe."}, {"type": "text", "text": "En bouche : Saveurs de miel, épices douces et fruits rouges."}, {"type": "text", "text": "Finale : Longue et chaleureuse, avec des nuances boisées et légèrement poivrées."}, {"type": "text", "text": "Avec un taux d'alcool de 45 %, le Buffalo Trace est idéal pour être dégusté pur, sur glace, ou dans des cocktails comme le Old Fashioned ou le Manhattan."}]}, {"id": 141, "name": "Canadian club 100% rye", "category": "Whisky", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Canadian Club 100% Rye est un whisky canadien exceptionnel, conçu pour les amateurs de seigle. Produit dans la région de l'Alberta, il est élaboré à partir de seigle 100 % canadien, ce qui lui confère un caractère épicé et complexe. Avec un taux d'alcool de 40 %, il est parfait pour les dégustations ou les cocktails."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de caramel, chêne et vanille, avec une touche de grains grillés."}, {"type": "text", "text": "En bouche : Saveurs équilibrées de seigle épicé, caramel et une douceur crémeuse."}, {"type": "text", "text": "Finale : Longue et nette, avec des nuances de clou de girofle et de chêne."}, {"type": "text", "text": "Ce whisky est idéal pour des cocktails comme le Manhattan ou le Whisky Sour, mais il peut aussi être apprécié pur pour découvrir toute sa richesse."}]}, {"id": 142, "name": "Cirka Monarque", "category": "Whisky", "abv": 43.0, "blocks": [{"type": "text", "text": "Le Cirka Monarque est un whisky canadien artisanal produit par la distillerie Cirka, située à Montréal, Québec. Ce whisky est élaboré à partir d'un assemblage de grains soigneusement sélectionnés et vieilli pendant 6 ans, ce qui lui confère une richesse et une complexité uniques."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de pain grillé, fruits confits et épices savoureuses."}, {"type": "text", "text": "En bouche : Saveurs de caramel au beurre salé, fruits d'automne (comme la pomme et la poire) et noix délicatement grillées."}, {"type": "text", "text": "Finale : Fraîche et lumineuse, avec des nuances de pomme croquante et de melon miel."}, {"type": "text", "text": "Avec un taux d'alcool de 43 %, le Cirka Monarque est idéal pour être dégusté pur ou dans des cocktails sophistiqués."}]}, {"id": 143, "name": "Cirka n 3", "category": "Whisky", "abv": 46.0, "blocks": [{"type": "text", "text": "Le Cirka No.3 est un whisky canadien artisanal produit par la distillerie Cirka, située à Montréal. Ce whisky est le troisième de leur série en petits lots et se distingue par son caractère unique et son processus de fabrication méticuleux."}, {"type": "heading", "text": "Points clés"}, {"type": "text", "text": "Composition : 93 % de seigle québécois local (de Yamachiche) et 7 % de seigle allemand malté au chocolat."}, {"type": "text", "text": "Vieillissement : Âgé de 4 ans et affiné dans des fûts de sherry Oloroso de 30 ans importés d'Espagne."}, {"type": "text", "text": "Non filtré à froid : Ce qui préserve toute sa richesse aromatique."}, {"type": "text", "text": "Teneur en alcool : 46 %."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de cuir, noisette grillée et figue."}, {"type": "text", "text": "En bouche : Saveurs de cacao, raisin sec, caramel et noisette."}, {"type": "text", "text": "Finale : Persistante et chaleureuse, avec des nuances d'épices et de caramel."}]}, {"id": 144, "name": "Chivas 12 ans", "category": "Whisky", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Chivas Regal 12 ans est un blended scotch whisky emblématique, produit en Écosse par Chivas Brothers Ltd. Ce whisky est un assemblage de whiskies de malt et de grain soigneusement sélectionnés, vieillis pendant au moins 12 ans, ce qui lui confère un équilibre parfait entre douceur et complexité."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de fleurs, miel et poire."}, {"type": "text", "text": "En bouche : Saveurs de vanille, noisette et caramel, avec une texture ronde et crémeuse."}, {"type": "text", "text": "Finale : Longue et riche, avec des nuances de toffee et de fruits secs."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, le Chivas Regal 12 ans est idéal pour être dégusté pur, sur glace, ou dans des cocktails comme le Rusty Nail ou le Scotch Highball."}]}, {"id": 145, "name": "Dalwhinnie 15 ans", "category": "Whisky", "abv": 43.0, "blocks": [{"type": "text", "text": "Le Dalwhinnie 15 ans est un single malt écossais emblématique, produit dans les Highlands. Il est connu pour son caractère doux et floral, ainsi que pour son processus de maturation dans des fûts de chêne américain pendant 15 ans, ce qui lui confère une richesse et une complexité remarquables."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de miel, bruyère et une touche de fumée légère."}, {"type": "text", "text": "En bouche : Saveurs de vanille, agrumes et malt, avec une texture veloutée."}, {"type": "text", "text": "Finale : Longue et persistante, avec des nuances de feu de bois et de réglisse."}, {"type": "text", "text": "Avec un taux d'alcool de 43 %, le Dalwhinnie 15 ans est idéal pour être dégusté pur ou avec une goutte d'eau pour révéler ses arômes."}]}, {"id": 146, "name": "Elijah Craig", "category": "Whisky", "abv": 47.0, "blocks": [{"type": "text", "text": "Elijah Craig est un bourbon emblématique produit par Heaven Hill Distilleries dans le Kentucky, aux États-Unis. Ce whisky est souvent surnommé le \"Père du Bourbon\" en hommage au révérend Elijah Craig, qui aurait été l'un des premiers à utiliser des fûts de chêne carbonisés pour vieillir le whisky, une technique qui donne au bourbon sa couleur et ses saveurs distinctives. Ce bourbon est célèbre pour son équilibre parfait entre douceur et complexité, grâce à son vieillissement dans des fûts de chêne carbonisés de niveau 3. Avec un taux d'alcool de 47 %, il est apprécié des amateurs de bourbon pour sa richesse aromatique."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de vanille, fruits sucrés et menthe fraîche."}, {"type": "text", "text": "En bouche : Saveurs boisées, avec des accents d'épices, de fumée et de noix de muscade."}, {"type": "text", "text": "Finale : Longue, douce et légèrement grillée."}, {"type": "text", "text": "Ce bourbon est idéal pour être dégusté pur, sur glace, ou dans des cocktails comme le Old Fashioned."}]}, {"id": 147, "name": "Glenfarclas 1998", "category": "Whisky", "abv": 54.2, "blocks": [{"type": "text", "text": "Le Glenfarclas 1998 est un single malt écossais produit par la distillerie Glenfarclas, située dans la région du Speyside. Ce whisky est souvent apprécié pour sa richesse et sa complexité, grâce à son vieillissement en fûts de sherry."}, {"type": "heading", "text": "Points clés"}, {"type": "text", "text": "Type de fût : Souvent vieilli dans des fûts de sherry Oloroso, parfois de remplissage multiple (comme le 4ème remplissage pour certaines éditions)."}, {"type": "text", "text": "Teneur en alcool : Varie selon les éditions, mais peut aller jusqu'à 54,2 % ou plus pour des versions cask strength."}, {"type": "text", "text": "Profil aromatique : Notes de fruits secs, caramel, chocolat au lait, agrumes et épices chaleureuses."}, {"type": "text", "text": "Éditions spéciales : Certaines versions, comme celles de la série \"Family Casks\", sont très recherchées par les collectionneurs."}]}, {"id": 148, "name": "Glenfiddich 12 ans", "category": "Whisky", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Glenfiddich 12 ans est un single malt écossais emblématique, produit dans la région du Speyside. Ce whisky est soigneusement vieilli pendant 12 ans dans une combinaison de fûts de chêne américain ayant contenu du bourbon et de fûts de xérès espagnols, ce qui lui confère un équilibre parfait entre douceur et complexité."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de poire fraîche, miel et une touche florale."}, {"type": "text", "text": "En bouche : Saveurs de vanille, malt sucré et une subtile influence boisée."}, {"type": "text", "text": "Finale : Longue et douce, avec des nuances de fruits et de chêne."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, le Glenfiddich 12 ans est idéal pour être dégusté pur, sur glace, ou dans des cocktails comme le Scotch Highball."}]}, {"id": 149, "name": "Glenmorangie nectar d'or", "category": "Whisky", "abv": 46.0, "blocks": [{"type": "text", "text": "Le Glenmorangie Nectar d'Or est un single malt écossais exceptionnel, produit dans les Highlands. Ce whisky est vieilli dans des fûts de chêne américain ayant contenu du bourbon, puis affiné dans des fûts de vin de Sauternes, un vin blanc doux français. Ce processus lui confère une richesse aromatique et une douceur unique."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes de citron, vanille, et une touche de gingembre."}, {"type": "text", "text": "En bouche : Saveurs de miel, fruits tropicaux, et une texture soyeuse."}, {"type": "text", "text": "Finale : Longue et élégante, avec des nuances de pâtisserie et d'épices."}, {"type": "text", "text": "Avec un taux d'alcool de 46 %, le Nectar d'Or est idéal pour être dégusté pur ou avec une goutte d'eau pour révéler ses arômes."}]}, {"id": 150, "name": "Glenmorangie original 12", "category": "Whisky", "abv": 40.0, "blocks": [{"type": "text", "text": "Le Glenmorangie Original 12 ans est une version revisitée du célèbre Glenmorangie Original, avec un vieillissement prolongé pour atteindre une complexité et une douceur encore plus remarquables. Ce single malt des Highlands est vieilli pendant 12 ans dans des fûts de chêne américain ayant contenu du bourbon, ce qui lui confère une richesse aromatique exceptionnelle."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes d'agrumes, pêche, vanille et une touche de miel."}, {"type": "text", "text": "En bouche : Saveurs de fruits tropicaux, caramel et une texture soyeuse."}, {"type": "text", "text": "Finale : Longue et élégante, avec des nuances de noix de coco et de pâtisserie."}, {"type": "text", "text": "Avec un taux d'alcool de 40 %, ce whisky est idéal pour être dégusté pur ou avec une goutte d'eau pour révéler ses arômes."}]}, {"id": 151, "name": "Hibiki", "category": "Whisky", "abv": 43.0, "blocks": [{"type": "text", "text": "Hibiki est un whisky japonais emblématique produit par la maison Suntory, célèbre pour son art de l'assemblage. Le nom \"Hibiki\" signifie \"résonance\" en japonais, reflétant l'harmonie entre la nature et le savoir-faire artisanal. Ce whisky est un blend de whiskies de malt et de grain provenant des distilleries Yamazaki, Hakushu et Chita, vieillis dans divers types de fûts, y compris le rare chêne japonais Mizunara."}, {"type": "heading", "text": "Profil aromatique"}, {"type": "text", "text": "Au nez : Notes florales, miel, agrumes et une touche de romarin."}, {"type": "text", "text": "En bouche : Saveurs de lychee, miel, bois de santal et une subtile douceur fruitée."}, {"type": "text", "text": "Finale : Longue et élégante, avec des nuances de chêne et de vanille."}, {"type": "text", "text": "Avec un taux d'alcool de 43 %, ce whisky est idéal pour être dégusté pur ou sur glace. Sa bouteille à 24 facettes représente les 24 saisons du calendrier lunaire japonais, un hommage à la nature et à la culture japonaise."}]}, {"id": 152, "name": "Jameson", "category": "Whisky", "abv": 40.0, "blocks": [{"type": "text", "text": "Jameson Irish Whiskey est l'un des whiskies irlandais les plus emblématiques et les plus vendus au monde. Produit par John Jameson & Son, il est distillé à Midleton, en Irlande, et est connu pour sa triple distillation, qui lui confère une douceur et une pureté exceptionnelles."}, {"type": "heading", "text": "Points clés"}, {"type": "text", "text": "Profil aromatique : Notes de fleurs, miel, vanille et une touche d'épices."}, {"type": "text", "text": "En bouche : Saveurs
