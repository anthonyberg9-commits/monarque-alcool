e et fruitée.\nProfil aromatique :\nNotes fruitées : Melon charentais, citron et yuzu.\nTouches florales : Subtiles et élégantes.\nFinale équilibrée : Fraîche et légèrement sucrée.\nLe Citadelle Jardin d'Été est parfait pour des cocktails comme le Gin\nTonic ou le French 75, mais il peut également être dégusté pur pour\napprécier pleinement ses arômes. Ce gin a été récompensé par plusieurs\nprix prestigieux, notamment une double médaille d'or au Bartender\nSpirits Awards."}, {"id": 86, "name": "Gin ford's", "category": "Gins", "abv": 45.0, "description": "Le Fords Gin est un gin artisanal de style London Dry, conçu\nspécifiquement pour les cocktails. Créé en collaboration entre Simon\nFord, un expert en spiritueux, et Charles Maxwell, un maître\ndistillateur de la 8e génération, ce gin est produit à Londres par\nThames Distillers. Il est élaboré à partir de 9 plantes botaniques\nsoigneusement sélectionnées, notamment le genièvre, la coriandre, le\njasmin, le pamplemousse et la racine d'angélique.\nProfil aromatique :\nNotes fraîches : Genièvre et agrumes.\nTouches florales : Jasmin pour une élégance subtile.\nFinale équilibrée : Douce et légèrement épicée.\nAvec un taux d'alcool de 45 %, le Fords Gin est parfait pour des\ncocktails classiques comme le Martini, le Negroni, ou le Gin Tonic. Il\nest souvent considéré comme un \"gin de barman\" en raison de sa\npolyvalence et de son équilibre."}, {"id": 87, "name": "Gin Hendrick's", "category": "Gins", "abv": 41.4, "description": "Le Hendrick's Gin est un gin écossais artisanal, produit par la maison\nWilliam Grant & Sons. Ce gin est célèbre pour son infusion unique de\nrose et de concombre, qui lui confère un profil aromatique délicat et\ninhabituel. Élaboré dans de petits alambics, il est distillé avec un\nmélange de plantes botaniques classiques comme le genièvre, la\ncoriandre, et les zestes d'agrumes.\nProfil aromatique :\nNotes florales : Rose pour une élégance subtile.\nTouches fraîches : Concombre et agrumes.\nFinale équilibrée : Douce et légèrement épicée.\nAvec un taux d'alcool de 41,4 %, le Hendrick's Gin est parfait pour\ndes cocktails comme le Gin Tonic, le Martini, ou même des créations plus\naudacieuses. Il peut également être dégusté pur pour apprécier\npleinement ses arômes uniques."}, {"id": 88, "name": "Hendrick's grand cabaret", "category": "Gins", "abv": 43.4, "description": "Le Hendrick's Grand Cabaret est une édition limitée de gin produite par\nla maison Hendrick's, célèbre pour ses créations audacieuses et\ninnovantes. Inspiré par les cabarets parisiens du début du XXe siècle,\nce gin met en avant des saveurs de fruits à noyau comme la pêche,\nl'abricot et la cerise, combinées à des notes florales de rose et des\nherbes douces. Avec un taux d'alcool de 43,4 %, il offre une expérience\nsensorielle riche et élégante.\nProfil aromatique :\nNotes fruitées : Pêche, abricot et cerise.\nTouches florales : Rose pour une élégance subtile.\nFinale équilibrée : Douce et légèrement herbacée.\nCe gin est parfait pour des cocktails sophistiqués comme le Grand\nCabaret Royale, qui combine ce gin avec du jus de canneberge, du jus de\ncitron vert, du sirop simple et du champagne ou vin mousseux pour une\ntouche festive. Il peut également être dégusté avec du tonic pour une\nversion plus classique."}, {"id": 89, "name": "Hendrick's flora adora", "category": "Gins", "abv": 43.4, "description": "Le Hendrick's Flora Adora est une édition limitée de gin écossais,\nproduite par la maison Hendrick's dans le cadre de leur collection\n\"Cabinet of Curiosities\". Ce gin célèbre les arômes floraux inspirés\ndes jardins en fleurs, avec des plantes botaniques soigneusement\nsélectionnées comme la lavande, la rose, l'hibiscus et la camomille.\nAvec un taux d'alcool de 43,4 %, il offre une expérience aromatique\nriche et délicate.\nProfil aromatique :\nNotes florales : Lavande, rose et hibiscus pour une douceur parfumée.\nTouches herbacées : Coriandre et menthe pour un équilibre frais.\nFinale élégante : Légèrement sucrée et herbacée.\nLe Flora Adora est parfait pour des cocktails comme le Wildgarden Cup,\nqui mélange ce gin avec du concombre, des framboises, de la menthe et de\nl'eau gazeuse citronnée. Il peut également être dégusté avec du tonic\net une tranche de concombre pour une version plus classique."}, {"id": 90, "name": "Gin Herbes folles", "category": "Gins", "abv": 43.0, "description": "Le Gin Les Herbes Folles est un gin artisanal québécois produit par la\ndistillerie La Société Secrète, située en Gaspésie. Ce gin est élaboré à\npartir d'une base d'orge et de blé malté québécois, brassé et fermenté\nsur place. Il est infusé avec une dizaine d'herbes sauvages cueillies à\nla main dans la région gaspésienne, ce qui lui confère un profil\naromatique unique et authentique.\nProfil aromatique :\nNotes herbacées : Fraîches et complexes, avec une touche végétale.\nTouches boisées : Subtiles, grâce à l'affinage en barriques de chêne.\nFinale équilibrée : Douce et légèrement épicée.\nAvec un taux d'alcool de 43 %, le Gin Les Herbes Folles est idéal pour\ndes cocktails comme le Gin Tonic ou le Old Fashioned, mais il peut\négalement être dégusté pur pour apprécier pleinement ses arômes."}, {"id": 91, "name": "KM 12", "category": "Gins", "abv": 40.0, "description": "Le KM12 est un gin artisanal québécois produit par la Distillerie du\nFjord, située dans la région des Monts-Valin. Ce gin est inspiré par la\nrichesse de la forêt boréale et est élaboré avec des ingrédients locaux\nsoigneusement cueillis à la main, tels que le bourgeon de sapin baumier,\nle poivre des dunes, le nard des pinèdes, les feuilles de framboisier\nsauvage et le myrique baumier.\nProfil aromatique :\nNotes boisées : Sapin baumier et myrique baumier.\nTouches épicées : Poivre des dunes et nard des pinèdes.\nFinale fraîche et fruitée : Grâce aux feuilles de framboisier sauvage.\nAvec un taux d'alcool de 40 %, le KM12 est parfait pour être dégusté\npur, sur glace, ou dans des cocktails comme le Gin Tonic. Ce gin offre\nune expérience gustative qui évoque une promenade dans la forêt boréale\nquébécoise.\nKoi :\nLe Gin Koï est un gin artisanal québécois produit par la Distillerie La\nManufacture, située à Sainte-Agathe-des-Monts. Ce gin s'inspire de la\ncarpe Koï, symbole d'ambition et de persévérance, et reflète ces\nvaleurs dans sa création. Élaboré à partir de baies de genièvre, de\ngingembre biologique québécois et de citronnelle, il offre un profil\naromatique unique et audacieux.\nProfil aromatique :\nNotes épicées : Gingembre pour une chaleur subtile.\nTouches fraîches : Citronnelle pour une vivacité équilibrée.\nFinale harmonieuse : Douce et légèrement piquante.\nAvec un taux d'alcool de 41 %, le Gin Koï est parfait pour accompagner\ndes mets asiatiques ou pour des cocktails comme le Gin Tonic ou le\nCollins au Gingembre et Citronnelle. Il peut également être dégusté pur\npour apprécier pleinement ses arômes."}, {"id": 92, "name": "Madison breakfast gin", "category": "Gins", "abv": 40.0, "description": "Le Madison Park Breakfast Gin est un gin artisanal québécois produit par\nla Distillerie 1769, située à Montréal. Ce gin unique est distillé avec\nde la bergamote, ce qui lui confère des arômes doux et invitants de\nfleur d'oranger. Il est ensuite infusé avec un mélange de thés,\nnotamment du thé Earl Grey, qui lui donne sa couleur ambrée riche et ses\nnotes aromatiques distinctives.\nProfil aromatique :\nNotes florales : Fleur d'oranger et bergamote.\nTouches herbacées : Thé Earl Grey et coriandre.\nFinale épicée : Cannelle et poivre subtil.\nAvec un taux d'alcool de 40 %, ce gin est parfait pour des cocktails\ncomme le Breakfast 75, qui combine ce gin avec du jus de citron, du\nsirop simple et du vin mousseux. Il peut également être dégusté pur, sur\nglace, ou avec une touche de citron pour apprécier pleinement ses\narômes."}, {"id": 93, "name": "Malfy Rosa", "category": "Gins", "abv": 41.0, "description": "Le Malfy Gin Rosa est un gin italien raffiné, produit par la maison\nMalfy. Ce gin se distingue par son infusion de pamplemousse rose\nsicilien et de citrons italiens, combinée à des plantes botaniques\nsoigneusement sélectionnées, comme le genièvre et la rhubarbe. Avec un\ntaux d'alcool de 41 %, il offre une expérience aromatique fraîche et\nfruitée.\nProfil aromatique :\nNotes fruitées : Pamplemousse rose et citron pour une fraîcheur vive.\nTouches herbacées : Genièvre et rhubarbe pour un équilibre subtil.\nFinale élégante : Douce et légèrement acidulée.\nLe Malfy Gin Rosa est parfait pour des cocktails comme le Gin Tonic ou\nle Amalfi Sunset Spritz, qui combine ce gin avec du prosecco et de\nl'eau gazeuse. Il peut également être dégusté pur, sur glace, pour\napprécier pleinement ses arômes."}, {"id": 94, "name": "Menaud", "category": "Gins", "abv": 42.0, "description": "Le Gin Menaud est un gin artisanal québécois produit par la Distillerie\nMenaud, située dans la région de Charlevoix. Ce gin est élaboré à partir\nd'une base de blé et de seigle cultivés sur l'Isle-aux-Coudres, et il\nest distillé trois fois pour obtenir une pureté exceptionnelle. Lors de\nla troisième distillation, des plantes botaniques locales sont infusées,\nce qui donne au gin son caractère unique.\nProfil aromatique :\nNotes boisées et citronnées : Équilibrées par des arômes salins\nprovenant de la salicorne.\nTouches florales et épicées : Baie de genièvre, coriandre, épinette\nnoire et poivre d'aulne.\nFinale longue et complexe : Avec une fraîcheur boréale.\nAvec un taux d'alcool de 42 %, le Gin Menaud est idéal pour des\ncocktails comme le Gin Tonic ou le Martini, mais il peut également être\ndégusté pur pour apprécier pleinement ses arômes."}, {"id": 95, "name": "Monkey 47", "category": "Gins", "abv": 47.0, "description": "Le Monkey 47 Schwarzwald Dry Gin est un gin artisanal allemand, produit\ndans la région de la Forêt-Noire. Ce gin est célèbre pour sa complexité\naromatique, grâce à l'utilisation de 47 plantes botaniques, dont des\nbaies de genièvre, des agrumes, des herbes et des épices. Avec un taux\nd'alcool de 47 %, il est distillé en petites quantités pour garantir\nune qualité exceptionnelle.\nProfil aromatique :\nNotes herbacées et épicées : Genièvre, coriandre et poivre.\nTouches fruitées : Agrumes et fruits rouges.\nFinale équilibrée : Longue et raffinée, avec une fraîcheur boisée.\nLe Monkey 47 est parfait pour des cocktails comme le Gin Tonic, le\nNegroni, ou même dégusté pur pour apprécier pleinement ses arômes\ncomplexes. Ce gin est souvent considéré comme l'un des meilleurs au\nmonde pour sa richesse et son équilibre."}, {"id": 96, "name": "Ubald vallée", "category": "Gins", "abv": 43.0, "description": "Le Ubald Vallée Herbacé est un gin artisanal québécois produit par la\nDistillerie Ubald, située à Saint-Ubalde, dans la région de Portneuf. Ce\ngin met en avant des ingrédients locaux, notamment le romarin, les baies\nde genièvre et la comptonie voyageuse, qui lui confèrent un profil\naromatique unique et végétal. Avec un taux d'alcool de 43 %, il est\nparfait pour des cocktails ou une dégustation pure.\nProfil aromatique :\nNotes herbacées : Romarin et comptonie voyageuse.\nTouches fraîches : Baies de genièvre pour un équilibre subtil.\nFinale élégante : Douce et légèrement végétale.\nCe gin est idéal pour des cocktails comme le Gin Tonic ou des créations\nplus audacieuses."}, {"id": 97, "name": "Roku", "category": "Gins", "abv": 43.0, "description": "Le Roku Gin est un gin artisanal japonais produit par la maison Suntory,\ncélèbre pour ses spiritueux de qualité. Ce gin se distingue par\nl'utilisation de 6 plantes botaniques japonaises, chacune représentant\nune saison, comme la fleur et la feuille de sakura (printemps), le thé\nsencha et le thé gyokuro (été), le poivre sansho (automne) et le zeste\nde yuzu (hiver). Avec un taux d'alcool de 43 %, il offre une expérience\naromatique équilibrée et raffinée.\nProfil aromatique :\nNotes florales : Fleur de sakura pour une douceur élégante.\nTouches épicées : Poivre sansho pour une chaleur subtile.\nFinale fraîche et citronnée : Grâce au zeste de yuzu.\nLe Roku Gin est parfait pour des cocktails comme le Gin Tonic au\ngingembre ou le Sakura Aperitif, mais il peut également être dégusté pur\npour apprécier pleinement ses arômes."}, {"id": 98, "name": "Gin tanqueray", "category": "Gins", "abv": 43.1, "description": "Le Tanqueray London Dry Gin est un gin classique et emblématique, connu\npour son élégance et son équilibre parfait. Créé en 1830 par Charles\nTanqueray, ce gin est élaboré avec un mélange simple mais exquis de\nplantes botaniques, dont les baies de genièvre, la coriandre, la racine\nd'angélique et la réglisse, ce qui lui confère un profil aromatique\nraffiné.\nProfil aromatique :\nNotes fraîches : Baies de genièvre pour une saveur vive et classique.\nTouches épicées : Coriandre et réglisse pour un équilibre subtil.\nFinale sèche : Élégante et harmonieuse, avec une douceur délicate.\nAvec un taux d'alcool de 43,1 %, le Tanqueray London Dry Gin est\nparfait pour des cocktails classiques comme le Gin Tonic, le Martini\nDry, ou le Negroni. Il peut également être dégusté pur pour apprécier\npleinement ses arômes."}, {"id": 99, "name": "Aupale", "category": "Vodka", "abv": 40.0, "description": "L'Aupale Vodka est une vodka québécoise haut de gamme, produite par la\nBluePearl Distillerie. Ce spiritueux est élaboré à partir d'eau\nprovenant des glaciers du nord du Québec, reconnue pour sa pureté\nexceptionnelle. Distillée 7 fois, elle offre une texture soyeuse et une\ngrande finesse, idéale pour être savourée telle quelle ou utilisée dans\ndes cocktails élégants.\nProfil aromatique :\nNotes délicates : Herbacées et légèrement épicées.\nTouches citronnées : Subtiles et rafraîchissantes.\nFinale douce : Parfaite pour une dégustation pure.\nAvec un taux d'alcool de 40 %, l'Aupale Vodka est un choix\nincontournable pour les amateurs de spiritueux raffinés."}, {"id": 100, "name": "Belvedere", "category": "Vodka", "abv": 40.0, "description": "La Belvedere Vodka est une vodka haut de gamme produite en Pologne, dans\nla plus ancienne distillerie de vodka au monde, située à Zyrardów. Elle\nest élaborée à partir de seigle polonais et d'eau purifiée, sans\nadditifs, ce qui lui confère une pureté exceptionnelle et un profil\naromatique riche. Avec un taux d'alcool de 40 %, elle est distillée\nselon des méthodes traditionnelles pour garantir une qualité supérieure.\nProfil aromatique :\nNotes douces : Vanille et amande.\nTouches épicées : Poivre blanc et gingembre.\nFinale élégante : Longue et soyeuse.\nLa Belvedere Vodka est idéale pour des cocktails sophistiqués comme le\nBelvedere Martini, le Espresso Martini, ou le Cosmopolitan, mais elle\npeut également être dégustée pure, sur glace, pour apprécier pleinement\nses arômes."}, {"id": 101, "name": "Grey Goose", "category": "Vodka", "abv": 40.0, "description": "La Grey Goose Vodka est une vodka française haut de gamme, produite dans\nla région de Cognac. Elle est élaborée à partir de blé tendre d'hiver\nde Picardie et d'eau de source de Gensac-La-Pallue, ce qui lui confère\nune pureté exceptionnelle et un profil aromatique raffiné. Avec un taux\nd'alcool de 40 %, elle est distillée selon des méthodes traditionnelles\npour garantir une qualité supérieure.\nProfil aromatique :\nNotes douces : Vanille et amande.\nTouches épicées : Poivre blanc et gingembre.\nFinale élégante : Longue et soyeuse.\nLa Grey Goose Vodka est idéale pour des cocktails sophistiqués comme le\nEspresso Martini, le Cosmopolitan, ou le Moscow Mule, mais elle peut\négalement être dégustée pure, sur glace, pour apprécier pleinement ses\narômes."}, {"id": 102, "name": "Grey goose la poire", "category": "Vodka", "abv": 40.0, "description": "La Grey Goose La Poire est une vodka aromatisée haut de gamme, produite\nen France par la maison Grey Goose. Elle est infusée avec des poires\nd'Anjou, un ingrédient classique de la gastronomie française, ce qui\nlui confère un profil aromatique délicat et fruité. Avec un taux\nd'alcool de 40 %, cette vodka est parfaite pour des cocktails élégants\nou une dégustation pure.\nProfil aromatique :\nNotes fruitées : Poires d'Anjou pour une douceur naturelle.\nTouches florales : Subtiles et raffinées.\nFinale équilibrée : Large et ronde en bouche.\nLa Grey Goose La Poire est idéale pour des cocktails comme le French\nPear Martini, le La Poire Fabuleaux, ou le Ginger Joy, qui mettent en\nvaleur ses saveurs uniques."}, {"id": 103, "name": "Ketel One", "category": "Vodka", "abv": 40.0, "description": "La Ketel One Vodka est une vodka haut de gamme produite par la famille\nNolet, une distillerie néerlandaise avec plus de 300 ans d'histoire.\nElle est élaborée à partir de blé européen soigneusement sélectionné et\ndistillée dans des alambics en cuivre, ce qui lui confère une texture\ndouce et un goût pur. Avec un taux d'alcool de 40 %, elle est reconnue\npour sa qualité exceptionnelle et sa polyvalence.\nProfil aromatique :\nNotes fraîches : Subtiles touches d'agrumes.\nTexture veloutée : Une douceur en bouche remarquable.\nFinale nette : Longue et élégante.\nLa Ketel One Vodka est idéale pour des cocktails comme le Martini\nclassique, le Bloody Mary, ou le Vodka Tonic, mais elle peut également\nêtre dégustée pure ou sur glace."}, {"id": 104, "name": "Chopin", "category": "Vodka", "abv": 40.0, "description": "La Chopin Potato Vodka est l'une des vodkas les plus raffinées et\nuniques au monde. Produite en Pologne par la distillerie Polmos Siedlce,\nelle est entièrement élaborée à partir de pommes de terre de qualité\nsupérieure, soigneusement cultivées dans la région de Podlasie. Cette\nvodka se distingue par sa richesse et sa texture crémeuse, qui reflètent\nle savoir-faire artisanal de ses créateurs. Elle est distillée quatre\nfois pour garantir une pureté et une qualité exceptionnelles.\nProfil aromatique :\nTexture : Crémeuse et onctueuse, avec une douceur en bouche remarquable.\nNotes douces : Subtiles nuances terreuses et beurrées.\nFinale élégante : Longue, ronde et parfaitement équilibrée.\nAvec un taux d'alcool de 40 %, la Chopin Potato Vodka est idéale pour\nune dégustation pure, sur glace ou en martini pour apprécier pleinement\nsa richesse. Elle est également une excellente base pour des cocktails\nhaut de gamme."}, {"id": 105, "name": "Monarc", "category": "Vodka", "abv": 40.0, "description": "La Monarc Vodka est une vodka québécoise haut de gamme produite par la\nDistillerie Wabasso, située à Trois-Rivières. Elle est élaborée à partir\nde blé 100 % québécois et d'eau de source Radnor, reconnue pour sa\npureté exceptionnelle. Avec un taux d'alcool de 40 %, cette vodka offre\nune expérience raffinée et équilibrée, idéale pour les amateurs de\nspiritueux de qualité.\nProfil aromatique :\nNotes douces : Subtiles et élégantes, avec une texture soyeuse.\nTouches fraîches : Légèrement herbacées et minérales.\nFinale nette : Longue et harmonieuse.\nLa Monarc Vodka est parfaite pour être dégustée pure, sur glace, ou dans\ndes cocktails sophistiqués comme le Martini classique ou le Vodka Tonic."}, {"id": 106, "name": "Stoli", "category": "Vodka", "abv": 40.0, "description": "La Stoli Gluten-Free Vodka est une vodka haut de gamme spécialement\nconçue pour les personnes sensibles au gluten. Elle est élaborée à\npartir de maïs et de sarrasin, ce qui garantit qu'elle est totalement\nsans gluten. Distillée avec soin et filtrée à travers du charbon de bois\net du sable de quartz, elle offre une pureté exceptionnelle et une\ntexture douce. Avec un taux d'alcool de 40 %, elle est idéale pour les\namateurs de spiritueux raffinés.\nProfil aromatique :\nNotes douces : Subtiles et équilibrées.\nTexture veloutée : Une douceur en bouche remarquable.\nFinale nette : Longue et élégante.\nLa Stoli Gluten-Free Vodka est parfaite pour des cocktails comme le\nCosmopolitan, le Vodka Tonic, ou même dégustée pure pour apprécier\npleinement ses arômes."}, {"id": 107, "name": "Casamigos", "category": "Téquila & Mezcal", "abv": 40.0, "description": "La Casamigos Blanco est une tequila ultra-premium produite au Mexique,\ndans la région de Jalisco. Elle est élaborée à partir d'agaves bleus\nWeber 100 % récoltés à la main, cuits lentement pendant 72 heures dans\ndes fours traditionnels en briques, puis fermentés pendant 80 heures, ce\nqui est plus long que la moyenne, pour développer des saveurs riches et\ncomplexes.\nProfil aromatique :\nNotes fraîches : Agrumes et vanille.\nTouches herbacées : Subtiles et équilibrées.\nFinale douce : Légèrement sucrée, avec une texture soyeuse.\nAvec un taux d'alcool de 40 %, la Casamigos Blanco est parfaite pour\nêtre dégustée pure, sur glace, ou dans des cocktails comme la Margarita\nclassique ou le Paloma."}, {"id": 108, "name": "El Jimador", "category": "Téquila & Mezcal", "abv": 40.0, "description": "La El Jimador Blanco est une tequila mexicaine produite par la maison\nCasa Herradura, située dans la région de Jalisco. Cette tequila est\nélaborée à partir d'agaves bleus Weber 100 % récoltés à la main et est\nnon vieillie, ce qui lui confère une fraîcheur et une pureté\nexceptionnelles. Avec un taux d'alcool de 40 %, elle est idéale pour\nles cocktails ou une dégustation pure.\nProfil aromatique :\nNotes fraîches : Agrumes et melon.\nTouches épicées : Subtiles nuances de poivre et d'épices.\nFinale douce : Avec des saveurs de concombre et une texture moelleuse.\nLa El Jimador Blanco est parfaite pour des cocktails comme la Margarita\nclassique, le Paloma, ou même le Tequila Sunrise."}, {"id": 109, "name": "Del maguey vida", "category": "Téquila & Mezcal", "abv": 42.0, "description": "Le Del Maguey Vida Mezcal est un mezcal artisanal produit dans le\nvillage de San Luis del Rio, au Mexique. Ce spiritueux est élaboré à\npartir d'agave Espadín, fermenté naturellement et distillé deux fois\ndans des alambics en cuivre chauffés au bois. Avec un taux d'alcool de\n42 %, il offre un profil aromatique riche et complexe.\nProfil aromatique :\nNotes fruitées : Figues, agrumes et miel.\nTouches épicées : Gingembre et cannelle.\nFinale fumée : Subtile et équilibrée.\nLe Del Maguey Vida Mezcal est idéal pour être dégusté pur, accompagné de\nmets fumés ou épicés, ou utilisé dans des cocktails comme le Vida\nMargarita ou le Oaxaca Old Fashioned."}, {"id": 110, "name": "Don Julio blanco", "category": "Téquila & Mezcal", "abv": 40.0, "description": "La Don Julio Blanco est une tequila mexicaine ultra-premium, produite\ndans la région de Jalisco. Elle est élaborée à partir d'agaves bleus\nWeber 100 % récoltés à la main et distillée deux fois pour garantir une\npureté exceptionnelle. Cette tequila, également connue sous le nom de\n\"tequila argentée\", est non vieillie, ce qui lui confère une fraîcheur\net une vivacité uniques.\nProfil aromatique :\nNotes fraîches : Agrumes comme le citron, la lime et le pamplemousse.\nTouches herbacées : Subtiles et équilibrées.\nFinale douce : Avec une texture soyeuse et une légère touche poivrée.\nAvec un taux d'alcool de 40 %, la Don Julio Blanco est idéale pour être\ndégustée pure, sur glace, ou dans des cocktails comme la Margarita\nclassique ou le Paloma."}, {"id": 111, "name": "Don Julio reposado", "category": "Téquila & Mezcal", "abv": 40.0, "description": "La Don Julio Reposado est une tequila mexicaine ultra-premium, produite\ndans la région de Jalisco. Elle est élaborée à partir d'agaves bleus\nWeber 100 % récoltés à la main et vieillie pendant 8 mois dans des fûts\nde chêne blanc américain, soit quatre fois plus longtemps que la norme\nde l'industrie. Cette maturation lui confère une couleur ambrée dorée\net un profil aromatique riche et velouté.\nProfil aromatique :\nNotes douces : Chocolat noir, vanille et cannelle.\nTouches fruitées : Fruits à noyau mûrs et pomme-caramel.\nFinale chaleureuse : Soyeuse, avec des essences de fruits séchés et de\nnoix.\nAvec un taux d'alcool de 40 %, la Don Julio Reposado est idéale pour\nêtre dégustée pure, sur glace, ou dans des cocktails comme le Paloma ou\nle Tequila Old Fashioned."}, {"id": 112, "name": "Don Julio Anejo", "category": "Téquila & Mezcal", "abv": 40.0, "description": "La Don Julio Añejo est une tequila mexicaine ultra-premium, produite\ndans la région de Jalisco. Elle est vieillie pendant 18 mois dans des\nfûts de chêne blanc américain, ce qui lui confère une richesse et une\ncomplexité exceptionnelles. Cette tequila est une démonstration parfaite\nde l'art de l'élaboration des tequilas vieillies.\nProfil aromatique :\nNotes fruitées : Agrumes comme la lime, le pamplemousse et la mandarine.\nTouches sucrées : Caramel écossais et miel sauvage.\nFinale boisée : Avec des nuances d'épices et de vanille.\nAvec un taux d'alcool de 40 %, la Don Julio Añejo est idéale pour être\ndégustée pure, sur glace, ou dans des cocktails comme le Tequila Old\nFashioned ou le Añejo Sour."}, {"id": 113, "name": "Espolon reposado", "category": "Téquila & Mezcal", "abv": 40.0, "description": "La Espolòn Reposado est une tequila mexicaine artisanale, produite dans\nla région de Los Altos, à Jalisco. Elle est élaborée à partir d'agave\nbleu Weber 100 %, récolté à la main, et vieillie pendant 6 mois dans des\nfûts de chêne américain. Ce vieillissement lui confère une couleur dorée\net un profil aromatique riche et complexe.\nProfil aromatique :\nNotes épicées : Caramel, vanille et cannelle.\nTouches fruitées : Fruits tropicaux mûrs et agave caramélisé.\nFinale douce et épicée : Avec une texture ronde et équilibrée.\nAvec un taux d'alcool de 40 %, la Espolòn Reposado est idéale pour être\ndégustée pure, sur glace, ou dans des cocktails comme la Margarita\népicée ou le Tequila Old Fashioned."}, {"id": 114, "name": "Gran Mayan", "category": "Téquila & Mezcal", "abv": 40.0, "description": "La Gran Mayan Silver est une tequila Blanco ultra-premium, produite\nartisanalement dans la région de Jalisco, au Mexique. Elle est élaborée\nà partir d'agave bleu Weber 100 %, récolté à la main, et distillée\ntrois fois pour garantir une pureté exceptionnelle et une texture douce.\nCette tequila cristalline est parfaite pour les amateurs de spiritueux\nraffinés.\nProfil aromatique :\nNotes fraîches : Agave pur et agrumes.\nTouches légères : Subtiles nuances herbacées.\nFinale nette : Douce et équilibrée.\nAvec un taux d'alcool de 40 %, la Gran Mayan Silver est idéale pour\nêtre dégustée pure, sur glace, ou dans des cocktails comme la Margarita\nclassique ou le Paloma."}, {"id": 115, "name": "Mescalosfera", "category": "Téquila & Mezcal", "abv": null, "description": "Mezcalosfera est une marque de mezcal artisanal produite par\nMezcaloteca, un bar renommé situé à Oaxaca, au Mexique. Ce mezcal est\nconnu pour ses petites productions en lots limités, mettant en valeur\ndes agaves rares et des méthodes de fabrication traditionnelles. Chaque\nbouteille de Mezcalosfera est soigneusement étiquetée avec des\ninformations détaillées sur le type d'agave, le processus de\ndistillation et le maître mezcalier.\nPoints forts :\nAgaves rares : Utilisation d'agaves comme le Tobala, le Madrecuixe et\nd'autres variétés sauvages.\nMéthodes artisanales : Distillation en alambics en cuivre ou en argile,\nfermentation naturelle avec des levures sauvages.\nPetits lots : Chaque production est unique, avec des saveurs distinctes\net complexes.\nMezcalosfera est idéal pour les amateurs de mezcal qui recherchent des\nspiritueux authentiques et uniques."}, {"id": 116, "name": "Serpiente Mezcal", "category": "Téquila & Mezcal", "abv": 45.0, "description": "La Serpiente Emplumada Mezcal est un mezcal artisanal produit au\nMexique, mettant en valeur des méthodes traditionnelles et des\ningrédients de qualité. Ce mezcal est souvent élaboré à partir d'agave\nEspadín, avec des lots limités qui garantissent une attention\nparticulière à chaque étape de la production. Il est apprécié pour son\nprofil aromatique riche et ses notes fumées caractéristiques.\nProfil aromatique :\nNotes fruitées : Pomme verte et agave cuit.\nTouches fumées : Subtiles et équilibrées.\nFinale douce : Avec des nuances de caramel et de chêne.\nAvec un taux d'alcool souvent autour de 45 %, ce mezcal est idéal pour\nêtre dégusté pur ou dans des cocktails comme le Mezcal Margarita ou le\nOaxaca Old Fashioned."}, {"id": 117, "name": "Très generationes", "category": "Téquila & Mezcal", "abv": 40.0, "description": "La Tres Generaciones Plata est une tequila Blanco ultra-premium produite\npar la distillerie La Perseverancia au Mexique. Elle est élaborée à\npartir d'agave bleu Weber 100 % récolté à la main et est distillée\ntrois fois, ce qui lui confère une pureté exceptionnelle et une douceur\nremarquable. Cette tequila non vieillie est idéale pour les amateurs de\nsaveurs fraîches et authentiques.\nProfil aromatique :\nNotes fraîches : Agave pur et agrumes.\nTouches florales : Subtiles et élégantes.\nFinale nette : Douce et équilibrée, sans amertume.\nAvec un taux d'alcool de 40 %, la Tres Generaciones Plata est parfaite\npour être dégustée pure, sur glace, ou dans des cocktails comme la\nMargarita classique ou le Paloma."}, {"id": 118, "name": "Diplomatico mantuano", "category": "Rhums", "abv": 40.0, "description": "Le Diplomatico Mantuano est un rhum brun vénézuélien, produit par\nDestilerias Unidas S.A., et reconnu pour son profil aromatique riche et\néquilibré. Vieilli jusqu'à 8 ans dans des fûts ayant contenu du bourbon\net du malt, ce rhum est un hommage à Don Juancho Nieto Meléndez, un\npassionné de spiritueux et d'exploration.\nProfil aromatique :\nNotes boisées : Chêne et épices.\nTouches fruitées : Fruits secs comme les figues et les abricots.\nFinale douce : Vanille et caramel.\nAvec un taux d'alcool de 40 %, le Diplomatico Mantuano est idéal pour\nêtre dégusté pur, sur glace, ou dans des cocktails comme le Mai Tai ou\nle Dark and Stormy."}, {"id": 119, "name": "Diplomatico reserva exclusiva", "category": "Rhums", "abv": 40.0, "description": "Le Diplomático Reserva Exclusiva est un rhum brun ultra-premium, produit\nau Venezuela par Destilerías Unidas S.A.. Ce rhum est élaboré à partir\nde mélasse de haute qualité et distillé dans des alambics en cuivre,\npuis vieilli jusqu'à 12 ans dans des fûts de chêne ayant contenu du\nbourbon et du whisky. Il est reconnu pour son profil aromatique riche et\nsa douceur exceptionnelle, en faisant un choix idéal pour les amateurs\nde rhums à déguster.\nProfil aromatique :\nNotes sucrées : Toffee, caramel et vanille.\nTouches fruitées : Zeste d'orange et fruits secs.\nFinale complexe : Avec des nuances de réglisse et de chêne.\nAvec un taux d'alcool de 40 %, le Diplomático Reserva Exclusiva est\nparfait pour être dégusté pur, sur glace, ou dans des cocktails\nsophistiqués comme le Old Fashioned ou le Mai Tai."}, {"id": 120, "name": "Flor de cana 12", "category": "Rhums", "abv": 40.0, "description": "Le Flor de Caña 12 est un rhum ambré ultra-premium produit au Nicaragua\npar la distillerie Compañía Licorera de Nicaragua. Ce rhum est vieilli\npendant 12 ans selon la méthode unique \"Slow Aged\", qui garantit un\nvieillissement naturel sans accélération artificielle. Il est reconnu\npour son profil aromatique complexe et sa qualité exceptionnelle.\nProfil aromatique :\nNotes sucrées : Vanille et caramel.\nTouches fruitées : Fruits secs et zeste d'orange.\nFinale boisée : Avec des nuances de chocolat noir et de clou de girofle.\nAvec un taux d'alcool de 40 %, le Flor de Caña 12 est parfait pour être\ndégusté pur, sur glace, ou dans des cocktails sophistiqués comme le Rum\nOld Fashioned ou le Mai Tai."}, {"id": 121, "name": "Havana club 3 ans", "category": "Rhums", "abv": 40.0, "description": "Le Havana Club 3 Años est un rhum blanc cubain emblématique, vieilli\npendant 3 ans pour développer un profil aromatique équilibré et\ncomplexe. Produit à partir de mélasses de canne à sucre locales, il est\ndistillé et vieilli à Cuba, ce qui lui confère une authenticité unique.\nProfil aromatique :\nNotes fraîches : Canne à sucre et agrumes.\nTouches fruitées : Subtiles nuances de banane et de poire.\nFinale douce : Avec des notes de vanille et de chêne léger.\nAvec un taux d'alcool de 40 %, le Havana Club 3 Años est parfait pour\ndes cocktails classiques comme le Mojito, le Daiquiri, ou le Piña\nColada, mais il peut également être dégusté pur pour apprécier ses\nsaveurs."}, {"id": 122, "name": "Leblon", "category": "Rhums", "abv": 40.0, "description": "La Leblon Cachaça est une eau-de-vie brésilienne artisanale, produite\ndans la région de Minas Gerais, au Brésil. Elle est élaborée à partir de\ncanne à sucre fraîchement pressée, distillée en petits lots dans des\nalambics en cuivre, et vieillie jusqu'à 6 mois dans des fûts de cognac\nXO français. Cette méthode lui confère une douceur exceptionnelle et un\nprofil aromatique complexe.\nProfil aromatique :\nNotes fruitées : Agrumes et fruits tropicaux.\nTouches herbacées : Subtiles et fraîches.\nFinale douce : Avec des nuances de vanille et de caramel.\nAvec un taux d'alcool de 40 %, la Leblon Cachaça est idéale pour des\ncocktails comme la Caïpirinha, le Batida de Coco, ou même dégustée pure\npour apprécier ses saveurs uniques."}, {"id": 123, "name": "Noroi esprit des caraïbes", "category": "Rhums", "abv": 0.5, "description": "Le Noroi Esprit des Caraïbes est un spiritueux sans alcool produit par\nla Distillerie Noroi, située au Québec. Ce produit unique est conçu\ngrâce à une technologie de distillation innovante qui permet de capturer\nles arômes subtils des ingrédients, souvent perdus dans une distillation\nclassique. Il offre des saveurs délicates de mélasse et un mélange\nd'épices maison, rappelant les caractéristiques d'un rhum brun.\nPoints forts :\nSans alcool : Avec un taux d'alcool de seulement 0,5 %, il est parfait\npour les mocktails.\nProfil aromatique : Mélasse, épices douces et une touche vanillée.\nPolyvalence : Idéal pour des cocktails sans alcool ou à savourer pur."}, {"id": 124, "name": "Plantation barbados 5 ans", "category": "Rhums", "abv": 40.0, "description": "Le Plantation Barbados 5 ans est un rhum ambré de qualité supérieure,\nproduit à la Barbade par la maison Maison Ferrand. Ce rhum est vieilli\npendant 5 ans dans des fûts de bourbon à la Barbade, puis affiné en\nFrance dans des fûts de cognac, ce qui lui confère une complexité et une\nrichesse uniques.\nProfil aromatique :\nNotes fruitées : Fruits tropicaux et banane mûre.\nTouches sucrées : Vanille, caramel et miel.\nFinale boisée : Avec des nuances d'épices et de chêne.\nAvec un taux d'alcool de 40 %, le Plantation Barbados 5 ans est parfait\npour être dégusté pur, sur glace, ou dans des cocktails comme le Mai Tai\nou le Rum Old Fashioned."}, {"id": 125, "name": "Plantation 3\\*", "category": "Rhums", "abv": 41.2, "description": "Le Plantation 3 Stars est un rhum blanc d'assemblage, produit par la\nmaison Maison Ferrand. Ce rhum unique réunit des rhums provenant de\ntrois régions des Caraïbes : la Barbade, la Jamaïque et Trinidad. Chaque\nîle apporte ses caractéristiques distinctes : la Barbade pour\nl'équilibre, la Jamaïque pour la structure et Trinidad pour\nl'élégance. Avec un taux d'alcool de 41,2 %, il est idéal pour les\namateurs de rhums polyvalents.\nProfil aromatique :\nNotes fruitées : Banane mûre, ananas confit et fruits tropicaux.\nTouches sucrées : Sucre roux et vanille.\nFinale épicée : Subtiles nuances florales et épicées.\nLe Plantation 3 Stars est parfait pour des cocktails comme le Mojito, le\nDaiquiri, ou même le Piña Colada."}, {"id": 126, "name": "Plantation OFTD", "category": "Rhums", "abv": 69.0, "description": "Le Plantation O.F.T.D. (Old Fashioned Traditional Dark) est un rhum\noverproof exceptionnellement puissant, produit par la maison Maison\nFerrand. Ce rhum est un assemblage de rhums provenant de la Barbade, de\nla Jamaïque et de la Guyane, soigneusement sélectionnés pour leur\ncaractère unique. Avec un taux d'alcool impressionnant de 69 %, il est\nconçu pour les amateurs de rhums intenses et les cocktails audacieux.\nProfil aromatique :\nNotes sucrées : Caramel, vanille et mélasse.\nTouches épicées : Cannelle et clou de girofle.\nFinale puissante : Avec des nuances de chocolat noir et d'agrumes.\nLe Plantation O.F.T.D. est parfait pour des cocktails comme le Zombie,\nle Mai Tai, ou tout autre mélange nécessitant un rhum riche et corsé."}, {"id": 127, "name": "Plantation original dark", "category": "Rhums", "abv": 40.0, "description": "Le Plantation Original Dark est un rhum ambré riche et complexe, produit\npar la maison Maison Ferrand. Ce rhum est un assemblage de rhums\nprovenant de la Jamaïque et de la Barbade, vieillis d'abord sous le\nclimat tropical des Caraïbes, puis affinés en France dans des fûts de\nchêne, selon la méthode unique de double maturation.\nProfil aromatique :\nNotes sucrées : Caramel, vanille et mélasse.\nTouches épicées : Cannelle, noix de muscade et clou de girofle.\nFinale chaleureuse : Avec des nuances de chocolat noir et de fruits\nsecs.\nAvec un taux d'alcool de 40 %, le Plantation Original Dark est idéal\npour des cocktails comme le Mai Tai, le Dark 'n' Stormy, ou même\ndégusté pur pour apprécier ses saveurs profondes."}, {"id": 128, "name": "Plantation peru", "category": "Rhums", "abv": 43.1, "description": "Le Plantation Peru Millésime 2006 est un rhum exceptionnel produit au\nPérou, dans la région de Chicama Valley. Ce rhum est élaboré à partir de\nmélasse et distillé en colonne, puis vieilli pendant 12 ans dans des\nfûts de bourbon au Pérou. Ensuite, il est affiné pendant 2 ans en France\ndans des fûts Ferrand, ce qui lui confère une complexité et une richesse\nuniques.\nProfil aromatique :\nNotes sucrées : Chocolat noir et vanille.\nTouches fruitées : Fruits exotiques et agrumes.\nFinale épicée : Avec des nuances de cannelle et de fruits secs.\nAvec un taux d'alcool de 43,1 %, le Plantation Peru est idéal pour être\ndégusté pur ou dans des cocktails sophistiqués."}, {"id": 129, "name": "Stiggins pineapple", "category": "Rhums", "abv": 40.0, "description": "Le Plantation Stiggins' Fancy Pineapple Rum est un rhum artisanal\nunique, produit par la maison Maison Ferrand. Ce rhum est élaboré en\ninfusant des écorces d'ananas Victoria dans du rhum Plantation Original\nDark, puis en distillant la chair d'ananas dans du rhum blanc. Le\nrésultat est un rhum riche et aromatique, parfait pour les cocktails ou\nà déguster pur.\nProfil aromatique :\nNotes fruitées : Ananas mûr et agrumes.\nTouches sucrées : Vanille et caramel.\nFinale épicée : Avec des nuances de cannelle et de clou de girofle.\nAvec un taux d'alcool de 40 %, ce rhum est idéal pour des cocktails\ncomme le Pineapple Daiquiri, le Mai Tai, ou même un Rum Old Fashioned."}, {"id": 130, "name": "Plantation XO", "category": "Rhums", "abv": 40.0, "description": "Le Plantation XO 20th Anniversary est un rhum ultra-premium produit par\nla maison Maison Ferrand pour célébrer les 20 ans d'excellence de leur\nmaître assembleur, Alexandre Gabriel. Ce rhum est un assemblage de rhums\nde la Barbade, vieillis entre 12 et 20 ans dans des fûts de bourbon sous\nle climat tropical, puis affinés en France dans des fûts de cognac\nFerrand, ce qui lui confère une richesse et une complexité\nexceptionnelles.\nProfil aromatique :\nNotes sucrées : Vanille, caramel et chocolat au lait.\nTouches fruitées : Fruits tropicaux et noix de coco.\nFinale épicée : Avec des nuances de cannelle et de chêne.\nAvec un taux d'alcool de 40 %, le Plantation XO est parfait pour être\ndégusté pur, sur glace, ou dans des cocktails sophistiqués comme le Rum\nOld Fashioned."}, {"id": 131, "name": "Trois rivières cuvée océan", "category": "Rhums", "abv": 42.0, "description": "Le Trois Rivières Cuvée de l'Océan est un rhum blanc agricole unique,\nproduit en Martinique par la célèbre distillerie Trois Rivières. Ce rhum\nest élaboré à partir de cannes à sucre cultivées sur la parcelle d'Anse\nTrabaud, située en bordure de l'océan Atlantique. Ce terroir\nexceptionnel confère à ce rhum des caractéristiques iodées et minérales\ndistinctives.\nProfil aromatique :\nNotes salines : Une touche iodée qui rappelle l'air marin.\nTouches végétales : Subtiles nuances herbacées.\nFinale fraîche : Avec des saveurs minérales et une belle légèreté.\nAvec un taux d'alcool de 42 %, le Trois Rivières Cuvée de l'Océan est\nidéal pour des cocktails comme le Ti'Punch ou pour accompagner des\nfruits de mer et des plats à base de poisson."}, {"id": 132, "name": "Zacapa 23 solera", "category": "Rhums", "abv": 40.0, "description": "Le Zacapa 23 Solera est un rhum brun ultra-premium produit au Guatemala,\ncélèbre pour son système de vieillissement unique appelé Sistema Solera.\nCe processus combine des rhums âgés de 6 à 23 ans, vieillis dans une\nsuccession de fûts ayant contenu du whisky américain, du xérès et du vin\nPedro Ximénez, ce qui lui confère une complexité et une richesse\nexceptionnelles.\nProfil aromatique :\nNotes sucrées : Caramel, vanille et miel.\nTouches fruitées : Raisins secs, abricots et zeste d'orange.\nFinale épicée : Cannelle, noix de muscade et chocolat noir.\nAvec un taux d'alcool de 40 %, le Zacapa 23 Solera est parfait pour\nêtre dégusté pur, sur glace, ou dans des cocktails sophistiqués comme le\nZacapa Old Fashioned ou le Espresso Martini."}, {"id": 133, "name": "Auchentoshan 12 ans", "category": "Whisky", "abv": 40.0, "description": "L'Auchentoshan 12 ans est un single malt écossais emblématique, produit\ndans les Lowlands. Ce whisky est triplement distillé, une\ncaractéristique rare en Écosse, et vieilli pendant 12 ans dans des fûts\nde bourbon et de xérès, ce qui lui confère une douceur et une complexité\nremarquables.\nProfil aromatique :\nAu nez : Notes de crème brûlée, agrumes et une touche de noisette.\nEn bouche : Saveurs douces de mandarine, caramel et une subtile\nfraîcheur herbacée.\nFinale : Gingembre léger et une agréable touche de noix.\nAvec un taux d'alcool de 40 %, l'Auchentoshan 12 ans est parfait pour\nêtre dégusté pur ou dans des cocktails comme le Glasgow Mule ou le\nAuchentoshan Manhattan ( rob roy )."}, {"id": 134, "name": "Ardbeg 10 ans", "category": "Whisky", "abv": 46.0, "description": "L'Ardbeg 10 ans est un single malt emblématique de l'île d'Islay, en\nÉcosse, réputé pour son caractère intensément tourbé et fumé. Ce whisky\nest non filtré à froid, ce qui préserve toute sa richesse aromatique et\nsa texture. Avec un taux d'alcool de 46 %, il est parfait pour les\namateurs de whiskies puissants et complexes.\nProfil aromatique :\nAu nez : Notes de fumée de tourbe, citron, et une touche de sel marin.\nEn bouche : Saveurs intenses de fumée, de poivre noir, et une douceur\nmaltée équilibrée.\nFinale : Longue et persistante, avec des nuances de café torréfié et de\nréglisse.\nL'Ardbeg 10 ans est idéal pour être dégusté pur ou avec quelques\ngouttes d'eau pour révéler ses arômes."}, {"id": 135, "name": "Basil Hayden's", "category": "Whisky", "abv": 40.0, "description": "Basil Hayden's Kentucky Straight Bourbon est un bourbon premium du\nKentucky, produit par Beam Suntory. Il est connu pour sa douceur, son\nélégance et sa teneur élevée en seigle, qui lui confère des notes\népicées distinctes et un profil aromatique raffiné. Ce bourbon est\nvieilli en fûts de chêne carbonisés et embouteillé avec un taux\nd'alcool de 40 %, ce qui le rend facile à déguster pour les\nconnaisseurs comme pour les novices.\nProfil aromatique :\nAu nez : Notes de caramel, vanille, chêne et une touche d'épices.\nEn bouche : Saveurs équilibrées de miel, épices douces (comme la\ncannelle) et agrumes.\nFinale : Subtile, lisse, avec des nuances poivrées et herbacées.\nLe Basil Hayden's Kentucky Straight Bourbon est parfait pour être\ndégusté pur, sur glace, ou dans des cocktails classiques comme le Old\nFashioned ou le Manhattan. Ce bourbon se distingue également par son\nstyle, avec une bande de cuivre emblématique autour de la bouteille."}, {"id": 136, "name": "Basil hayden's dark rye", "category": "Whisky", "abv": 40.0, "description": "Basil Hayden's Dark Rye est un whisky unique qui combine du seigle du\nKentucky, du seigle canadien de l'Alberta Distillery, et une touche de\nporto californien. Ce mélange audacieux crée un profil aromatique riche\net fruité, parfait pour les amateurs de whiskies complexes. Avec un taux\nd'alcool de 40 %, il est idéal pour les dégustations ou les cocktails\nsophistiqués.\nProfil aromatique :\nAu nez : Notes de fruits noirs comme les cerises et les prunes, avec une\ntouche de mélasse.\nEn bouche : Saveurs de caramel, fruits secs et une subtile épice de\nseigle.\nFinale : Persistante, avec des nuances de fruits séchés et une douceur\néquilibrée.\nCe whisky est parfait pour des cocktails comme le Boulevardier, le\nManhattan, ou même dégusté pur pour apprécier ses saveurs uniques."}, {"id": 137, "name": "Bearface 7 ans", "category": "Whisky", "abv": 42.5, "description": "Le Bearface 7 ans Triple Oak est un whisky canadien unique, produit en\nColombie-Britannique. Ce whisky est élaboré à partir d'un spiritueux de\nmaïs vieilli pendant 7 ans et subit un processus de maturation en trois\nétapes, utilisant trois types de fûts différents :\nFûts de chêne américain ex-bourbon : Pour des notes de vanille et de\ncaramel.\nFûts de chêne français ayant contenu du vin rouge : Apportant des\nsaveurs de fruits secs et une touche tannique.\nFûts de chêne hongrois vierges : Offrant des épices complexes et une\nlégère fumée.\nProfil aromatique :\nAu nez : Notes de miel, fruits secs et vanille.\nEn bouche : Saveurs de caramel, épices douces et une touche de fruits\nrouges.\nFinale : Longue et épicée, avec des nuances boisées.\nAvec un taux d'alcool de 42,5 %, le Bearface 7 ans est idéal pour être\ndégusté pur, sur glace, ou dans des cocktails comme le Old Fashioned."}, {"id": 138, "name": "Blanton's", "category": "Whisky", "abv": 46.5, "description": "Blanton's est un bourbon emblématique, produit dans le Kentucky, aux\nÉtats-Unis. Il est célèbre pour être le premier bourbon embouteillé à\npartir d'un fût unique, ce qui signifie que chaque bouteille provient\nd'un seul fût soigneusement sélectionné. Ce processus garantit une\nqualité exceptionnelle et des saveurs uniques à chaque lot.\nPoints clés :\nOrigine : Distillé à la distillerie Buffalo Trace, à Frankfort,\nKentucky.\nProfil aromatique : Notes de caramel, vanille, épices douces et une\ntouche de fruits secs.\nTeneur en alcool : Environ 46,5 %, offrant une expérience riche et\nveloutée.\nBouteille iconique : Chaque bouteille est ornée d'un bouchon en forme\nde cheval de course, un clin d'œil à la culture du Kentucky.\nBlanton's est parfait pour être dégusté pur ou avec une goutte d'eau\npour révéler ses arômes."}, {"id": 139, "name": "Bowmore 15 ans", "category": "Whisky", "abv": 43.0, "description": "Le Bowmore 15 ans est un single malt écossais produit sur l'île\nd'Islay, célèbre pour ses whiskies tourbés et fumés. Ce whisky est\nvieilli dans des fûts de bourbon et de xérès Oloroso, ce qui lui confère\nune richesse aromatique et une complexité exceptionnelle.\nProfil aromatique :\nAu nez : Raisins secs, cerises, et une touche de fumée.\nEn bouche : Saveurs de chocolat noir, fruits secs, et une subtile épice\nboisée.\nFinale : Longue et chaleureuse, avec des nuances de fumée et de sel\nmarin.\nAvec un taux d'alcool de 43 %, le Bowmore 15 ans est idéal pour être\ndégusté pur ou avec une goutte d'eau pour révéler ses arômes."}, {"id": 140, "name": "Buffalo trace", "category": "Whisky", "abv": 45.0, "description": "Buffalo Trace est un bourbon emblématique produit dans le Kentucky, aux\nÉtats-Unis, par la célèbre Buffalo Trace Distillery, l'une des plus\nanciennes distilleries en activité. Ce bourbon est connu pour son\néquilibre parfait entre douceur et complexité, ce qui en fait un favori\nparmi les amateurs de whisky.\nProfil aromatique :\nAu nez : Notes de caramel, vanille et une touche de menthe.\nEn bouche : Saveurs de miel, épices douces et fruits rouges.\nFinale : Longue et chaleureuse, avec des nuances boisées et légèrement\npoivrées.\nAvec un taux d'alcool de 45 %, le Buffalo Trace est idéal pour être\ndégusté pur, sur glace, ou dans des cocktails comme le Old Fashioned ou\nle Manhattan."}, {"id": 141, "name": "Canadian club 100% rye", "category": "Whisky", "abv": 40.0, "description": "Le Canadian Club 100% Rye est un whisky canadien exceptionnel, conçu\npour les amateurs de seigle. Produit dans la région de l'Alberta, il\nest élaboré à partir de seigle 100 % canadien, ce qui lui confère un\ncaractère épicé et complexe. Avec un taux d'alcool de 40 %, il est\nparfait pour les dégustations ou les cocktails.\nProfil aromatique :\nAu nez : Notes de caramel, chêne et vanille, avec une touche de grains\ngrillés.\nEn bouche : Saveurs équilibrées de seigle épicé, caramel et une douceur\ncrémeuse.\nFinale : Longue et nette, avec des nuances de clou de girofle et de\nchêne.\nCe whisky est idéal pour des cocktails comme le Manhattan ou le Whisky\nSour, mais il peut aussi être apprécié pur pour découvrir toute sa\nrichesse."}, {"id": 142, "name": "Cirka Monarque", "category": "Whisky", "abv": 43.0, "description": "Le Cirka Monarque est un whisky canadien artisanal produit par la\ndistillerie Cirka, située à Montréal, Québec. Ce whisky est élaboré à\npartir d'un assemblage de grains soigneusement sélectionnés et vieilli\npendant 6 ans, ce qui lui confère une richesse et une complexité\nuniques.\nProfil aromatique :\nAu nez : Notes de pain grillé, fruits confits et épices savoureuses.\nEn bouche : Saveurs de caramel au beurre salé, fruits d'automne (comme\nla pomme et la poire) et noix délicatement grillées.\nFinale : Fraîche et lumineuse, avec des nuances de pomme croquante et de\nmelon miel.\nAvec un taux d'alcool de 43 %, le Cirka Monarque est idéal pour être\ndégusté pur ou dans des cocktails sophistiqués."}, {"id": 143, "name": "Cirka n 3", "category": "Whisky", "abv": 46.0, "description": "Le Cirka No.3 est un whisky canadien artisanal produit par la\ndistillerie Cirka, située à Montréal. Ce whisky est le troisième de leur\nsérie en petits lots et se distingue par son caractère unique et son\nprocessus de fabrication méticuleux.\nPoints clés :\nComposition : 93 % de seigle québécois local (de Yamachiche) et 7 % de\nseigle allemand malté au chocolat.\nVieillissement : Âgé de 4 ans et affiné dans des fûts de sherry Oloroso\nde 30 ans importés d'Espagne.\nNon filtré à froid : Ce qui préserve toute sa richesse aromatique.\nTeneur en alcool : 46 %.\nProfil aromatique :\nAu nez : Notes de cuir, noisette grillée et figue.\nEn bouche : Saveurs de cacao, raisin sec, caramel et noisette.\nFinale : Persistante et chaleureuse, avec des nuances d'épices et de\ncaramel."}, {"id": 144, "name": "Chivas 12 ans", "category": "Whisky", "abv": 40.0, "description": "Le Chivas Regal 12 ans est un blended scotch whisky emblématique,\nproduit en Écosse par Chivas Brothers Ltd. Ce whisky est un assemblage\nde whiskies de malt et de grain soigneusement sélectionnés, vieillis\npendant au moins 12 ans, ce qui lui confère un équilibre parfait entre\ndouceur et complexité.\nProfil aromatique :\nAu nez : Notes de fleurs, miel et poire.\nEn bouche : Saveurs de vanille, noisette et caramel, avec une texture\nronde et crémeuse.\nFinale : Longue et riche, avec des nuances de toffee et de fruits secs.\nAvec un taux d'alcool de 40 %, le Chivas Regal 12 ans est idéal pour\nêtre dégusté pur, sur glace, ou dans des cocktails comme le Rusty Nail\nou le Scotch Highball."}, {"id": 145, "name": "Dalwhinnie 15 ans", "category": "Whisky", "abv": 43.0, "description": "Le Dalwhinnie 15 ans est un single malt écossais emblématique, produit\ndans les Highlands. Il est connu pour son caractère doux et floral,\nainsi que pour son processus de maturation dans des fûts de chêne\naméricain pendant 15 ans, ce qui lui confère une richesse et une\ncomplexité remarquables.\nProfil aromatique :\nAu nez : Notes de miel, bruyère et une touche de fumée\nlégère.\nEn bouche : Saveurs de vanille, agrumes et malt, avec\nune texture veloutée.\nFinale : Longue et persistante, avec des nuances de\nfeu de bois et de réglisse.\nAvec un taux d'alcool de 43 %, le Dalwhinnie 15 ans est idéal pour être\ndégusté pur ou avec une goutte d'eau pour révéler ses arômes."}, {"id": 146, "name": "Elijah Craig", "category": "Whisky", "abv": 47.0, "description": "Elijah Craig est un bourbon emblématique produit par Heaven Hill\nDistilleries dans le Kentucky, aux États-Unis. Ce whisky est souvent\nsurnommé le \"Père du Bourbon\" en hommage au révérend Elijah Craig, qui\naurait été l'un des premiers à utiliser des fûts de chêne carbonisés\npour vieillir le whisky, une technique qui donne au bourbon sa couleur\net ses saveurs distinctives. Ce bourbon est célèbre pour son équilibre\nparfait entre douceur et complexité, grâce à son vieillissement dans des\nfûts de chêne carbonisés de niveau 3. Avec un taux d'alcool de 47 %, il\nest apprécié des amateurs de bourbon pour sa richesse aromatique.\nProfil aromatique :\nAu nez : Notes de vanille, fruits sucrés et menthe\nfraîche.\nEn bouche : Saveurs boisées, avec des accents\nd'épices, de fumée et de noix de muscade.\nFinale : Longue, douce et légèrement grillée.\nCe bourbon est idéal pour être dégusté pur, sur glace, ou dans des\ncocktails comme le Old Fashioned."}, {"id": 147, "name": "Glenfarclas 1998", "category": "Whisky", "abv": 54.2, "description": "Le Glenfarclas 1998 est un single malt écossais produit par la\ndistillerie Glenfarclas, située dans la région du Speyside. Ce whisky\nest souvent apprécié pour sa richesse et sa complexité, grâce à son\nvieillissement en fûts de sherry.\nPoints clés :\nType de fût : Souvent vieilli dans des fûts de sherry\nOloroso, parfois de remplissage multiple (comme le 4ème remplissage pour\ncertaines éditions).\nTeneur en alcool : Varie selon les éditions, mais peut\naller jusqu'à 54,2 % ou plus pour des versions cask strength.\nProfil aromatique : Notes de fruits secs, caramel,\nchocolat au lait, agrumes et épices chaleureuses.\nÉditions spéciales : Certaines versions, comme celles\nde la série \"Family Casks\", sont très recherchées par les\ncollectionneurs."}, {"id": 148, "name": "Glenfiddich 12 ans", "category": "Whisky", "abv": 40.0, "description": "Le Glenfiddich 12 ans est un single malt écossais emblématique, produit\ndans la région du Speyside. Ce whisky est soigneusement vieilli pendant\n12 ans dans une combinaison de fûts de chêne américain ayant contenu du\nbourbon et de fûts de xérès espagnols, ce qui lui confère un équilibre\nparfait entre douceur et complexité.\nProfil aromatique :\nAu nez : Notes de poire fraîche, miel et une touche\nflorale.\nEn bouche : Saveurs de vanille, malt sucré et une\nsubtile influence boisée.\nFinale : Longue et douce, avec des nuances de fruits\net de chêne.\nAvec un taux d'alcool de 40 %, le Glenfiddich 12 ans est idéal pour\nêtre dégusté pur, sur glace, ou dans des cocktails comme le Scotch\nHighball."}, {"id": 149, "name": "Glenmorangie nectar d'or", "category": "Whisky", "abv": 46.0, "description": "Le Glenmorangie Nectar d'Or est un single malt écossais exceptionnel,\nproduit dans les Highlands. Ce whisky est vieilli dans des fûts de chêne\naméricain ayant contenu du bourbon, puis affiné dans des fûts de vin de\nSauternes, un vin blanc doux français. Ce processus lui confère une\nrichesse aromatique et une douceur unique.\nProfil aromatique :\nAu nez : Notes de citron, vanille, et une touche de\ngingembre.\nEn bouche : Saveurs de miel, fruits tropicaux, et une\ntexture soyeuse.\nFinale : Longue et élégante, avec des nuances de\npâtisserie et d'épices.\nAvec un taux d'alcool de 46 %, le Nectar d'Or est idéal pour être\ndégusté pur ou avec une goutte d'eau pour révéler ses arômes."}, {"id": 150, "name": "Glenmorangie original 12", "category": "Whisky", "abv": 40.0, "description": "Le Glenmorangie Original 12 ans est une version revisitée du célèbre\nGlenmorangie Original, avec un vieillissement prolongé pour atteindre\nune complexité et une douceur encore plus remarquables. Ce single malt\ndes Highlands est vieilli pendant 12 ans dans des fûts de chêne\naméricain ayant contenu du bourbon, ce qui lui confère une richesse\naromatique exceptionnelle.\nProfil aromatique :\nAu nez : Notes d'agrumes, pêche, vanille et une\ntouche de miel.\nEn bouche : Saveurs de fruits tropicaux, caramel et\nune texture soyeuse.\nFinale : Longue et élégante, avec des nuances de noix\nde coco et de pâtisserie.\nAvec un taux d'alcool de 40 %, ce whisky est idéal pour être dégusté\npur ou avec une goutte d'eau pour révéler ses arômes."}, {"id": 151, "name": "Hibiki", "category": "Whisky", "abv": 43.0, "description": "Hibiki est un whisky japonais emblématique produit par la maison\nSuntory, célèbre pour son art de l'assemblage. Le nom \"Hibiki\"\nsignifie \"résonance\" en japonais, reflétant l'harmonie entre la\nnature et le savoir-faire artisanal. Ce whisky est un blend de whiskies\nde malt et de grain provenant des distilleries Yamazaki, Hakushu et\nChita, vieillis dans divers types de fûts, y compris le rare chêne\njaponais Mizunara.\nProfil aromatique :\nAu nez : Notes florales, miel, agrumes et une touche\nde romarin.\nEn bouche : Saveurs de lychee, miel, bois de santal et\nune subtile douceur fruitée.\nFinale : Longue et élégante, avec des nuances de chêne\net de vanille.\nAvec un taux d'alcool de 43 %, ce whisky est idéal pour être dégusté\npur ou sur glace. Sa bouteille à 24 facettes représente les 24 saisons\ndu calendrier lunaire japonais, un hommage à la nature et à la culture\njaponaise."}, {"id": 152, "name": "Jameson", "category": "Whisky", "abv": 40.0, "description": "Jameson Irish Whiskey est l'un des whiskies irlandais les plus\nemblématiques et les plus vendus au monde. Produit par John Jameson &\nSon, il est distillé à Midleton, en Irlande, et est connu pour sa triple\ndistillation, qui lui confère une douceur et une pureté exceptionnelles.\nPoints clés :\nProfil aromatique : Notes de fleurs, miel, vanille et\nune touche d'épices.\nEn bouche : Saveurs équilibrées de fruits mûrs,\ncaramel et noisette.\nFinale : Douce et légèrement boisée.\nAvec un taux d'alcool de 40 %, Jameson est parfait pour être dégusté\npur, sur glace, ou dans des cocktails comme l'Irish Coffee ou le\nJameson Ginger & Lime."}, {"id": 153, "name": "Johnny walker double black", "category": "Whisky", "abv": 40.0, "description": "Johnnie Walker Double Black est un blended scotch whisky inspiré du\ncélèbre Johnnie Walker Black Label, mais avec une intensité accrue. Ce\nwhisky est vieilli dans des fûts de chêne intensément carbonisés, ce qui\nlui confère un caractère fumé et corsé.\nProfil aromatique :\nAu nez : Notes de clou de girofle, fumée, raisins secs\net pomme.\nEn bouche : Saveurs de vanille, orange, épices et une\ntouche de caramel.\nFinale : Riche, douce et fumée, avec des nuances\nboisées.\nAvec un taux d'alcool de 40 %, le Double Black est idéal pour les\namateurs de whiskies au profil audacieux. Il peut être dégusté pur, sur\nglace, ou dans un cocktail comme le Highball avec soda, citron et\nromarin."}, {"id": 154, "name": "Johnnie walker green", "category": "Whisky", "abv": 43.0, "description": "Johnnie Walker Green Label est un blended malt scotch whisky unique,\ncomposé exclusivement de whiskies de malt provenant de différentes\nrégions d'Écosse, notamment le Speyside, les Highlands, les Lowlands et\nles îles. Chaque whisky utilisé dans cet assemblage est vieilli pendant\nau moins 15 ans, ce qui lui confère une complexité et une profondeur\nremarquables.\nProfil aromatique :\nAu nez : Notes de fruits frais, herbe coupée, fumée\nlégère et vanille.\nEn bouche : Saveurs équilibrées de miel, agrumes,\népices et une touche de tourbe.\nFinale : Longue et douce, avec des nuances boisées et\nfumées.\nAvec un taux d'alcool de 43 %, le Green Label est idéal pour les\namateurs de whiskies complexes et harmonieux."}, {"id": 155, "name": "Johnnie walker red", "category": "Whisky", "abv": 40.0, "description": "Johnnie Walker Red Label est un blended scotch whisky emblématique,\nconnu pour son caractère vibrant et audacieux. C'est le whisky le plus\nvendu de la gamme Johnnie Walker, apprécié pour sa polyvalence et sa\ncapacité à se marier parfaitement dans des cocktails.\nProfil aromatique :\nAu nez : Notes de clou de girofle, cannelle et une\ntouche de fruits frais.\nEn bouche : Saveurs épicées, avec des nuances de\npoivre noir, caramel et une légère fumée.\nFinale : Chaleureuse et persistante, avec des accents\nboisés.\nAvec un taux d'alcool de 40 %, le Red Label est idéal pour les\ncocktails comme le Scotch Highball ou le Rusty Nail, mais il peut aussi\nêtre dégusté sur glace."}, {"id": 156, "name": "Lagavulin 16 ans", "category": "Whisky", "abv": 43.0, "description": "Le Lagavulin 16 ans est un single malt écossais emblématique, produit\nsur l'île d'Islay, réputée pour ses whiskies tourbés et fumés. Ce\nwhisky est vieilli pendant 16 ans dans des fûts de chêne, ce qui lui\nconfère une profondeur et une complexité remarquables.\nProfil aromatique :\nAu nez : Notes de tourbe intense, algues marines, et\nune touche de fruits secs.\nEn bouche : Saveurs riches de fumée, vanille, figues\net épices.\nFinale : Longue et persistante, avec des nuances\nboisées et iodées.\nAvec un taux d'alcool de 43 %, le Lagavulin 16 ans est idéal pour être\ndégusté pur ou avec une goutte d'eau pour révéler ses arômes."}, {"id": 157, "name": "Lagavulin distiller's edition", "category": "Whisky", "abv": 43.0, "description": "Le Lagavulin Distiller's Edition est une version spéciale du célèbre\nLagavulin 16 ans, offrant une expérience encore plus riche et complexe\ngrâce à une double maturation. Ce whisky est vieilli dans des fûts de\nchêne, puis affiné dans des fûts de sherry Pedro Ximénez, ce qui lui\nconfère des saveurs sucrées et profondes qui complètent parfaitement son\ncaractère tourbé.\nProfil aromatique :\nAu nez : Tourbe intense, fruits secs, raisins et une\ntouche de vanille.\nEn bouche : Saveurs de fumée côtière, caramel salé,\ntoffee et une douceur fruitée.\nFinale : Longue et persistante, avec des nuances\népicées et boisées.\nAvec un taux d'alcool de 43 %, le Lagavulin Distiller's Edition est\nidéal pour les amateurs de whiskies tourbés et équilibrés."}, {"id": 158, "name": "Laphroaig lore", "category": "Whisky", "abv": 48.0, "description": "Laphroaig Lore est un single malt écossais produit sur l'île d'Islay,\nconnu pour être l'une des expressions les plus riches et complexes de\nla distillerie Laphroaig. Ce whisky est un assemblage de malts vieillis\nentre 7 et 21 ans, utilisant des fûts de chêne européen, des fûts de\nbourbon et des fûts de sherry Oloroso, ainsi que des quarter casks.\nProfil aromatique :\nAu nez : Tourbe intense, embruns marins, chocolat noir\net une touche de cendre.\nEn bouche : Saveurs vives de chocolat amer, cendre,\népices et une pointe de piment.\nFinale : Courte et sèche, avec une douceur persistante\nen arrière-goût.\nAvec un taux d'alcool de 48 %, ce whisky est idéal pour les amateurs de\nsaveurs tourbées et audacieuses."}, {"id": 159, "name": "Laphroaig quarter cask", "category": "Whisky", "abv": 48.0, "description": "Le Laphroaig Quarter Cask est un single malt écossais produit sur l'île\nd'Islay, célèbre pour ses whiskies tourbés et fumés. Ce whisky est\nunique grâce à sa double maturation : il est vieilli dans des fûts de\nchêne américain ayant contenu du bourbon, puis transféré dans des\n\"Quarter Casks\", des petits fûts qui augmentent le contact avec le\nbois, intensifiant ainsi ses saveurs.\nProfil aromatique :\nAu nez : Tourbe intense, vanille, noix de coco et une\ntouche de banane.\nEn bouche : Saveurs riches de fumée, caramel, épices\net une douceur fruitée.\nFinale : Longue et persistante, avec des nuances\nboisées et fumées.\nAvec un taux d'alcool de 48 %, ce whisky est idéal pour les amateurs de\nsaveurs audacieuses et complexes."}, {"id": 160, "name": "Lot 40", "category": "Whisky", "abv": 43.0, "description": "Lot No. 40 est un whisky canadien emblématique, produit par la\ndistillerie Hiram Walker à Windsor, en Ontario. Ce whisky est élaboré à\npartir de 100 % de seigle, distillé dans un alambic en cuivre\ntraditionnel, et vieilli dans des fûts de chêne blanc vierge. Il est\nsouvent considéré comme l'une des meilleures expressions de whisky de\nseigle en Amérique du Nord.\nProfil aromatique :\nAu nez : Notes de fruits noirs, épices de boulangerie,\nvanille et toffee.\nEn bouche : Saveurs audacieuses de fruits secs, épices\nchaudes et une touche florale\nFinale : Douce et persistante, avec des nuances de\nfruits séchés et d'épices.\nAvec un taux d'alcool de 43 %, Lot No. 40 est idéal pour être dégusté\npur, sur glace, ou dans des cocktails comme le Manhattan ou le Whisky\nSour."}, {"id": 161, "name": "Macallan double cask 12 ans", "category": "Whisky", "abv": 40.0, "description": "Le Macallan Double Cask 12 ans est un single malt écossais produit dans\nla région du Speyside. Ce whisky est vieilli pendant 12 ans dans une\ncombinaison de fûts de chêne américain et européen ayant contenu du\nxérès, ce qui lui confère un équilibre parfait entre douceur et\ncomplexité.\nProfil aromatique :\nAu nez : Notes de vanille, caramel et agrumes.\nEn bouche : Saveurs de fruits secs, miel et épices\ndouces.\nFinale : Longue et chaleureuse, avec des nuances\nboisées et légèrement sucrées.\nAvec un taux d'alcool de 40 %, ce whisky est idéal pour être dégusté\npur ou avec une goutte d'eau pour révéler ses arômes."}, {"id": 162, "name": "Michter's rye", "category": "Whisky", "abv": null, "description": "Michter's US★1 Kentucky Straight Rye est un whisky américain haut de\ngamme produit avec soin au Kentucky. Ce rye est élaboré à partir de\ngrains de seigle soigneusement sélectionnés, et vieilli dans des fûts de\nchêne blanc américain flambés. Chaque bouteille provient d'un fût\nunique, garantissant un profil aromatique unique."}, {"id": 163, "name": "Détails clés", "category": "Whisky", "abv": 42.4, "description": "Degré d'alcool : 42,4 % (84,8 proof).\nNotes de dégustation : Épices marquées avec des\nnuances poivrées, agrumes, caramel au beurre et chêne.\nProduction : Distillé et mis en bouteille au Kentucky,\navec un vieillissement dans des entrepôts chauffés pour une extraction\noptimale des saveurs.\nIdéal pour être savouré pur ou dans des cocktails classiques comme\nl'Old Fashioned ou le Manhattan."}, {"id": 164, "name": "Monkey shoulder", "category": "Whisky", "abv": 40.0, "description": "Monkey Shoulder est un blended malt scotch whisky produit par William\nGrant & Sons en Écosse. Ce whisky est unique car il est composé\nuniquement de whiskies de malt provenant de distilleries du Speyside,(\nun assemblage de trois single malts provenant des distilleries Balvenie,\nGlenfiddich et Kininvie,) toutes situées dans la région du Speyside en\nÉcosse ce qui lui confère un profil riche et équilibré. Il est conçu\npour être polyvalent, parfait pour les cocktails ou dégusté pur.\nProfil aromatique :\nAu nez : Notes de vanille, marmelade d'orange et\ncrème brûlée.\nEn bouche : Saveurs de malt doux, fruits secs, épices\nlégères et une touche de chêne.\nFinale : Douce et persistante, avec des nuances de\ncaramel et de noisette.\nAvec un taux d'alcool de 40 %, Monkey Shoulder est idéal pour des\ncocktails comme le Whisky Sour ou le Old Fashioned."}, {"id": 165, "name": "Nikka Taketsuru pure malt", "category": "Whisky", "abv": 43.0, "description": "Le Nikka Taketsuru Pure Malt est un whisky japonais emblématique, nommé\nen l'honneur de Masataka Taketsuru, le fondateur de la maison Nikka et\npionnier du whisky japonais. Ce whisky est un assemblage de malts\nprovenant des distilleries Yoichi et Miyagikyo, offrant un équilibre\nparfait entre douceur et complexité.\nProfil aromatique :\nAu nez : Notes de fruits mûrs, vanille, et une touche\nde chocolat noir.\nEn bouche : Saveurs de caramel, épices douces, et une\nsubtile influence boisée.\nFinale : Longue et élégante, avec des nuances de\nfruits secs et de chêne.\nAvec un taux d'alcool de 43 %, ce whisky est idéal pour être dégusté\npur ou avec une goutte d'eau pour révéler ses arômes."}, {"id": 166, "name": "Nikka myiagikyo", "category": "Whisky", "abv": 45.0, "description": "Le Nikka Miyagikyo Single Malt est un whisky japonais raffiné, produit\ndans la vallée de Miyagi, au nord de l'île de Honshu. Cette région est\nréputée pour son air pur et ses eaux de source de qualité, qui\ncontribuent à la finesse de ce whisky.\nProfil aromatique :\nAu nez : Notes de banane, réglisse, miel, chocolat et\népices de boulangerie.\nEn bouche : Saveurs équilibrées de fruits mûrs,\ncaramel, gingembre et une touche de bois brûlé.\nFinale : Longue et élégante, avec des nuances de tabac\nfrais, noix grillées et fruits compotés.\nAvec un taux d'alcool de 45 %, ce whisky est idéal pour être dégusté\npur ou avec des glaçons. Il est souvent vieilli dans des fûts de sherry,\nce qui lui confère une profondeur aromatique unique."}, {"id": 167, "name": "Oban 14", "category": "Whisky", "abv": 43.0, "description": "Le Oban 14 ans est un single malt écossais emblématique, produit dans la\nrégion des Highlands, à la distillerie Oban, située près de la côte\nouest de l'Écosse. Ce whisky est apprécié pour son équilibre entre des\nsaveurs fruitées et fumées, avec une touche maritime qui reflète son\nemplacement côtier.\nProfil aromatique :\nAu nez : Notes de bruyère, fumée légère, sel marin et\nagrumes.\nEn bouche : Saveurs riches de figues séchées, orange,\nmalt sucré et une pointe de fumée.\nFinale : Longue et élégante, avec des nuances de sel\net de bois.\nAvec un taux d'alcool de 43 %, le Oban 14 ans est idéal pour être\ndégusté pur ou avec une goutte d'eau pour révéler ses arômes."}, {"id": 168, "name": "Oban double maturation", "category": "Whisky", "abv": 43.0, "description": "L'Oban Double Maturation, également connue sous le nom de Distillers\nEdition, est une version spéciale du célèbre Oban 14 ans. Ce whisky\nsubit une double maturation, avec une finition dans des fûts de xérès\nFino Montilla, ce qui lui confère une complexité et une richesse\nsupplémentaires.\n( Le Fino Montilla est un vin fortifié emblématique de la région de\nMontilla-Moriles, située en Andalousie, Espagne. Ce vin est élaboré\nprincipalement à partir du cépage Pedro Ximénez .)\nProfil aromatique :\nAu nez : Notes d'agrumes, de fumée légère, et une\ntouche de fruits secs.\nEn bouche : Saveurs équilibrées de caramel, épices, et\nune douceur fruitée provenant du xérès.\nFinale : Longue et élégante, avec des nuances boisées\net légèrement salées.\nAvec un taux d'alcool de 43 %, ce whisky est idéal pour les amateurs de\nsingle malts complexes et raffinés."}, {"id": 169, "name": "Sazerac Rye", "category": "Whisky", "abv": 45.0, "description": "Sazerac Rye est un whisky emblématique américain, souvent surnommé \"The\nOne and Only New Orleans Original\". Ce rye whiskey est profondément\nenraciné dans l'histoire de la Nouvelle-Orléans, où il a joué un rôle\nclé dans la création du cocktail Sazerac, considéré comme le premier\ncocktail américain.\nProfil aromatique :\nAu nez : Notes de clou de girofle, vanille, anis et\npoivre.\nEn bouche : Saveurs subtiles d'épices, d'agrumes\nconfits et une touche de réglisse.\nFinale : Douce et persistante, avec des nuances de\nbonbons épicés.\nAvec un taux d'alcool de 45 %, le Sazerac Rye est idéal pour être\ndégusté pur ou dans des cocktails classiques comme le Sazerac Cocktail."}, {"id": 170, "name": "Tobermory", "category": "Whisky", "abv": 46.3, "description": "Le Tobermory 12 ans est un single malt écossais raffiné, produit par la\ndistillerie Tobermory, située sur l'île de Mull en Écosse. Ce whisky\nnon tourbé reflète le caractère floral et fruité de la région, tout en\najoutant une complexité subtile grâce à son vieillissement dans des fûts\nde chêne.\nProfil aromatique :\nAu nez : Notes de miel, agrumes, pommes vertes et un\nsoupçon de vanille.\nEn bouche : Saveurs de malt sucré, caramel, épices\ndouces et une touche de chêne.\nFinale : Longue et équilibrée, avec des nuances\nboisées et légèrement épicées.\nAvec un taux d'alcool de 46,3 %, le Tobermory 12 ans est parfait pour\nêtre dégusté pur ou avec une goutte d'eau."}, {"id": 171, "name": "Waterford argot", "category": "Whisky", "abv": 47.0, "description": "Le Waterford Argot est un single malt irlandais produit par la\ndistillerie Waterford, connue pour son approche innovante et axée sur le\nterroir. Ce whisky est surnommé le \"petit frère\" de The Cuvée, une\nautre expression emblématique de la distillerie. Le nom \"Argot\" fait\nréférence à un langage secret, réservé aux initiés, et reflète le\ncaractère audacieux et créatif de ce whisky.\nCaractéristiques principales :\nVieillissement : Maturation dans quatre types de fûts\ndifférents :\n37 % de fûts de chêne américain de premier remplissage.\n19 % de fûts de chêne américain vierge.\n19 % de fûts de chêne français supérieur.\n23 % de fûts ayant contenu du vin doux naturel.\nProfil aromatique :\nAu nez : Notes d'amande, écorce d'orange, pomme\ncompotée, chocolat blanc et toffee.\nEn bouche : Saveurs de poivre blanc, granola,\npamplemousse, barbecue fumé et peau de pomme verte.\nFinale : Longue et gourmande, avec des épices séchées\net une douce chaleur.\nAvec un taux d'alcool de 47 %, le Waterford Argot est vibrant et\naccessible, tout en conservant la complexité typique des single malts de\nla distillerie."}, {"id": 172, "name": "Wild turkey", "category": "Whisky", "abv": 40.5, "description": "Wild Turkey est un bourbon américain produit par la distillerie Wild\nTurkey à Lawrenceburg, Kentucky. Ce whisky est embouteillé à 40,5 %\nd'alcool et est conçu pour offrir une expérience plus douce et\naccessible par rapport au célèbre Wild Turkey 101.\nProfil aromatique :\nAu nez : Notes de vanille, caramel, sucre d'orge et\ncerise.\nEn bouche : Saveurs de miel, épices douces, et une\ntouche de chêne brûlé.\nFinale : Longue et épicée, avec des nuances boisées et\nlégèrement sucrées.\nLe Wild Turkey est idéal pour les cocktails comme le Kentucky Mule ou le\nWhiskey Sour, mais il peut également être dégusté pur."}, {"id": 173, "name": "Woodford reserve", "category": "Whisky", "abv": 45.2, "description": "Woodford Reserve est un bourbon américain emblématique, produit dans la\ndistillerie historique de Woodford County, Kentucky. Ce bourbon est\nréputé pour son équilibre parfait et sa complexité, avec plus de 200\nnotes aromatiques détectables, allant des grains audacieux et du bois\naux arômes sucrés, épicés, fruités et floraux.\nProfil aromatique :\nAu nez : Notes de vanille, caramel, fruits secs et une\ntouche de cacao.\nEn bouche : Saveurs riches de miel, épices douces,\nagrumes et chêne.\nFinale : Longue et chaleureuse, avec des nuances\nboisées et légèrement sucrées.\nAvec un taux d'alcool de 45,2 %, le Woodford Reserve est idéal pour\nêtre dégusté pur, sur glace ou dans des cocktails classiques comme\nl'Old Fashioned ou le Mint Julep."}, {"id": 174, "name": "Calvados pays d'auge Boulard", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": null, "description": "Le Calvados Pays d'Auge Boulard est une référence prestigieuse parmi\nles calvados, produit exclusivement dans la région du Pays d'Auge en\nNormandie. Ce calvados est élaboré à partir des meilleurs cidres, puis\ndistillé deux fois pour obtenir une complexité et une authenticité\nremarquables.\nCaractéristiques principales :\nAppellation : AOC Calvados Pays d'Auge.\nProcessus : Double distillation pour une richesse\naromatique.\nProfil aromatique :\nAu nez : Notes de pomme mûre, vanille et une touche\nboisée.\nEn bouche : Saveurs équilibrées de fruits frais,\népices douces et caramel.\nFinale : Longue et élégante, avec des nuances de chêne\net de pomme.\nLa maison Boulard, fondée en 1825, est pionnière dans l'art du calvados\net propose également des éditions limitées innovantes, affinées dans des\nfûts de bourbon, de whisky américain ou même de chêne japonais Mizunara."}, {"id": 175, "name": "Roger groult 3 ans", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "description": "Le Roger Groult 3 ans est un calvados AOC Pays d'Auge, produit en\nNormandie par la célèbre maison Roger Groult, reconnue pour son\nsavoir-faire artisanal transmis depuis cinq générations. Ce calvados est\nélaboré à partir de pommes à cidre soigneusement sélectionnées, distillé\ndeux fois au feu de bois, puis vieilli pendant 3 ans dans des fûts de\nchêne.\nProfil aromatique :\nAu nez : Notes fraîches et fruitées de pomme acidulée,\navec une touche crémeuse.\nEn bouche : Saveurs tendres de pomme cuite, vanille et\nune pointe de noisette.\nFinale : Douce et légèrement mentholée, avec une belle\nfraîcheur.\nAvec un taux d'alcool de 40 %, ce calvados est idéal pour être dégusté\npur, en digestif, ou utilisé dans des cocktails."}, {"id": 176, "name": "Roger groult 8 ans", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 41.0, "description": "Le Roger Groult 8 ans est un calvados AOC Pays d'Auge, produit en\nNormandie par la maison Roger Groult, reconnue pour son savoir-faire\nartisanal transmis depuis cinq générations. Ce calvados est élaboré à\npartir de pommes à cidre soigneusement sélectionnées, distillé deux fois\nau feu de bois, puis vieilli pendant 8 ans dans des fûts de chêne, ce\nqui lui confère une grande complexité aromatique.\nProfil aromatique :\nAu nez : Notes de pomme confite, cannelle, vanille et\nune touche de miel.\nEn bouche : Saveurs riches et rondes de fruits mûrs,\ncaramel et épices douces.\nFinale : Longue et élégante, avec des nuances boisées\net légèrement épicées.\nAvec un taux d'alcool de 41 %, ce calvados est idéal pour être dégusté\npur, en digestif, ou utilisé dans des cocktails sophistiqués."}, {"id": 177, "name": "Roger groult 12 ans", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 41.0, "description": "Le Roger Groult 12 ans est un calvados AOC Pays d'Auge, produit en\nNormandie par la maison Roger Groult, reconnue pour son savoir-faire\nartisanal et son respect des traditions. Ce calvados est élaboré à\npartir de pommes à cidre soigneusement sélectionnées, distillé deux fois\nau feu de bois, puis vieilli pendant 12 ans dans des fûts de chêne, ce\nqui lui confère une grande richesse aromatique.\nProfil aromatique :\nAu nez : Notes florales, fruits à chair blanche, et\népices douces.\nEn bouche : Saveurs équilibrées de fruits mûrs,\ncaramel, et une touche boisée.\nFinale : Longue et élégante, avec des nuances\nlégèrement confites.\nAvec un taux d'alcool de 41 %, ce calvados est idéal pour être dégusté\npur, en digestif, ou accompagné de desserts au chocolat."}, {"id": 178, "name": "Roger groult hydromel", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 44.6, "description": "Le Roger Groult Hydromel est une édition spéciale de calvados AOC Pays\nd'Auge, produite par la maison Roger Groult en Normandie. Ce calvados\nest unique car il est affiné dans des fûts ayant contenu de l'hydromel,\nce qui lui confère des saveurs distinctives et une grande rondeur.\nCaractéristiques principales :\nVieillissement : Affinage en fûts d'hydromel après\nplusieurs années en fûts de chêne.\nProfil aromatique :\nAu nez : Notes de fruits secs, pomme mûre, miel et une\ntouche florale.\nEn bouche : Saveurs riches de pommeau, caramel, et une\ndouceur miellée.\nFinale : Longue et gourmande, avec des nuances boisées\net légèrement épicées.\nAvec un taux d'alcool de 44,6 %, cette expression est idéale pour les\namateurs de calvados recherchant une expérience unique."}, {"id": 179, "name": "Lauriston fine Domfrontais", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": null, "description": "Le Lauriston Fine Domfrontais est un calvados produit dans la région du\nDomf
