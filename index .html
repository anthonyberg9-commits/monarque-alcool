rontais, en Normandie. Ce calvados se distingue par l'utilisation\nd'un mélange de pommes et de poires, ce qui lui confère une douceur et\nune complexité uniques. La maison Comte Louis de Lauriston, qui produit\nce calvados, est réputée pour son respect des traditions et son\nsavoir-faire artisanal.\nCaractéristiques principales :\nAppellation : AOC Calvados Domfrontais.\nComposition : Mélange de pommes et de poires. ( cidre\n)\nProfil aromatique :\nAu nez : Notes fruitées de pomme et de poire, avec une\ntouche florale.\nEn bouche : Saveurs fraîches et équilibrées, avec une\ndouceur naturelle et une pointe d'épices.\nFinale : Légère et élégante, avec des nuances boisées.\nCe calvados est idéal pour être dégusté pur, en apéritif ou en digestif,\net peut également être utilisé dans des cocktails."}, {"id": 180, "name": "Lauriston 100% poire", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "description": "Le Lauriston 100% Poire est une eau-de-vie unique produite dans la\nrégion du Domfrontais, en Normandie, sous l'appellation Calvados\nDomfrontais. Ce spiritueux est élaboré exclusivement à partir de poiré\n(cidre de poire), distillé en alambic à colonne, ce qui lui confère une\nfraîcheur et une élégance remarquables.\nCaractéristiques principales :\nCouleur : Or clair.\nAu nez : Arômes frais et fruités de poires mûres et de\nfruits blancs comme la pêche.\nEn bouche : Saveurs délicates, juteuses et\néquilibrées, avec une belle vivacité.\nFinale : Élégante et persistante, avec une touche\nlégèrement acidulée.\nAvec un taux d'alcool de 40 %, cette eau-de-vie est idéale pour être\ndégustée pure, en apéritif ou en digestif."}, {"id": 181, "name": "Marie Jo Rosemont", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 42.0, "description": "La Marie-Jo Rosemont est une eau-de-vie de pomme produite par la\nDistillerie de Montréal, située au Québec. Cette eau-de-vie est élaborée\nà partir de pommes soigneusement sélectionnées, offrant une expérience\ngustative unique et raffinée. 42%.\nProfil aromatique :\nAu nez : Notes fruitées de pomme fraîche et une touche\nflorale.\nEn bouche : Saveurs équilibrées de pomme mûre, caramel\net une pointe de vanille.\nFinale : Douce et élégante, avec des nuances boisées.\nLa Marie-Jo Rosemont est idéale pour être dégustée pure ou utilisée dans\ndes cocktails créatifs."}, {"id": 182, "name": "Cognac 1^er^ cru ambré pierre ferrand", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "description": "Le Pierre Ferrand 1er Cru Ambré est un cognac raffiné produit dans la\nrégion de la Grande Champagne, considérée comme le terroir le plus\nprestigieux pour le cognac. Ce spiritueux est élaboré à partir de\nraisins Ugni Blanc et vieilli pendant environ 10 ans dans des fûts de\nchêne français, ce qui lui confère une complexité et une douceur\nremarquables.\nProfil aromatique :\nAu nez : Notes d'orange, de fleurs (rose, violette)\net une touche de vanille.\nEn bouche : Saveurs équilibrées de fruits secs, miel,\ncaramel et une pointe boisée.\nFinale : Longue et élégante, avec des nuances florales\net légèrement épicées.\nAvec un taux d'alcool de 40 %, ce cognac est idéal pour être dégusté\npur ou utilisé dans des cocktails sophistiqués."}, {"id": 183, "name": "Cognac beaulon XO", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "description": "Le Château de Beaulon XO Premier est un cognac d'exception, produit\ndans la région des Fins Bois en France. Ce cognac est élaboré à partir\nde cépages rares tels que la Folle Blanche, le Colombard, et le Montils,\nqui apportent une richesse aromatique unique. Vieilli pendant 12 ans, il\ndépasse les exigences minimales pour un XO, offrant une profondeur et\nune complexité remarquables.\nProfil aromatique :\nAu nez : Notes de pain grillé, amande, pêche de vigne\net cannelle.\nEn bouche : Saveurs riches et fruitées d'orange\nfraîche, avec une finale longue et élégante.\nFinale : Complexe et séduisante, avec une touche\nboisée et épicée.\nAvec un taux d'alcool de 40 %, ce cognac est idéal pour être dégusté\npur, en digestif, ou accompagné de desserts raffinés."}, {"id": 184, "name": "Cognac camus ile de ré", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "description": "Le Camus Île de Ré est un cognac unique, produit par la maison Camus,\nqui met en valeur le terroir exceptionnel de l'Île de Ré, située au\nlarge de la côte ouest de la France. Ce cognac se distingue par son\ncaractère maritime, influencé par le climat océanique et les sols\ncalcaires de l'île. Il est élaboré principalement à partir du cépage\nUgni Blanc, qui est le cépage dominant utilisé pour la production de\ncognac\nProfil aromatique :\nAu nez : Notes fraîches et marines, avec des touches\nde fruits secs et de vanille.\nEn bouche : Saveurs équilibrées de fruits mûrs,\ncaramel, et une subtile salinité.\nFinale : Longue et élégante, avec des nuances boisées\net légèrement iodées.\nLe Camus Île de Ré est disponible en plusieurs expressions, comme le\nFine Island ou le Double Matured, chacune offrant une expérience\ngustative unique. Avec un taux d'alcool de 40 %, il est idéal pour être\ndégusté pur ou accompagné de fruits de mer."}, {"id": 185, "name": "Cognac reviseur XO", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "description": "Le Réviseur XO est un cognac raffiné, produit dans la région de la\nPetite Champagne, en France. Ce cognac est élaboré à partir de raisins\nUgni Blanc, distillés dans de petits alambics pour préserver la richesse\naromatique, puis vieilli pendant 10 ans dans des fûts de chêne, ce qui\nlui confère une grande complexité et profondeur.\nProfil aromatique :\nAu nez : Notes de vanille, fruits secs, et une touche\nboisée.\nEn bouche : Saveurs équilibrées de caramel, réglisse,\net une pointe de rancio.\nFinale : Longue et élégante, avec des nuances épicées\net boisées.\nAvec un taux d'alcool de 40 %, ce cognac est idéal pour être dégusté\npur, en digestif, ou accompagné d'un cigare pour une expérience encore\nplus sophistiquée."}, {"id": 186, "name": "Cognac Naud VSOP", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "description": "Le Naud VSOP est un cognac raffiné produit par la maison Famille Naud,\nsituée dans la région de Poitou-Charentes, en France. Ce cognac est\nélaboré à partir de raisins ugni blanc soigneusement sélectionnés,\ndistillés dans de petits alambics en cuivre, puis vieilli dans des fûts\nde chêne français pour développer une richesse aromatique et une rondeur\nexceptionnelle.\nProfil aromatique :\nAu nez : Notes élégantes de vanille, fruits secs, et\népices douces comme la cannelle et la muscade.\nEn bouche : Saveurs fruitées d'orange et de pêche,\navec une touche boisée subtile.\nFinale : Souple et séduisante, parfaite pour les\namateurs de cognacs équilibrés.\nAvec un taux d'alcool de 40 %, le Naud VSOP peut être dégusté pur ou\nutilisé dans des cocktails classiques comme le side car ou le Sazerac."}, {"id": 187, "name": "Cognac Montifaud XO", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "description": "Le Château de Montifaud XO est un cognac d'exception, produit dans la\nrégion de la Petite Champagne, en France. Ce cognac est élaboré à partir\nde raisins Ugni Blanc, distillés avec soin, puis vieillis pendant\nenviron 30 ans dans des fûts de chêne, ce qui lui confère une grande\ncomplexité et une profondeur aromatique unique.\nProfil aromatique :\nAu nez : Notes de fruits secs, amandes grillées,\népices douces comme la muscade, et une touche de safran.\nEn bouche : Saveurs équilibrées de fruits confits,\ncaramel, et une pointe de rancio charentais.\nFinale : Longue et élégante, avec des nuances boisées\net légèrement épicées.\nAvec un taux d'alcool de 40 %, ce cognac est idéal pour être dégusté\npur, en digestif, ou accompagné de desserts comme une crème brûlée ou\ndes pralines."}, {"id": 188, "name": "Cognac segonzac VSOP", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": null, "description": "Le Cognac Pierre de Segonzac VSOP est un cognac raffiné provenant de la\nrégion de la Grande Champagne, classée comme 1er Cru de Cognac. Ce\ncognac est élaboré à partir du cépage Ugni Blanc, distillé sur lies\nfines pour préserver la richesse aromatique, puis vieilli dans des fûts\nde chêne Limousin.\nProfil aromatique :\nAu nez : Notes de mandarine fraîche, vanille, et une\ntouche florale.\nEn bouche : Saveurs équilibrées d'agrumes, d'amande\net de bois de chêne.\nFinale : Douce et agréable, avec une belle longueur en\nbouche.\nCe cognac est idéal pour être dégusté pur ou utilisé dans des cocktails\nsophistiqués."}, {"id": 189, "name": "Cognac segonzac XO", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": null, "description": "Le Cognac Pierre de Segonzac XO est un cognac d'exception provenant de\nla région de la Grande Champagne, classée 1er Cru de Cognac. Ce cognac\nest élaboré exclusivement à partir du cépage Ugni Blanc, distillé sur\nlies fines pour préserver une richesse aromatique unique, puis vieilli\ndans des fûts de chêne Limousin.\nProfil aromatique :\nCouleur : Acajou profond.\nAu nez : Arômes intenses de figue, abricot, jasmin,\nnoix et coing, avec des notes de pain grillé et de chocolat.\nEn bouche : Saveurs riches et complexes de fruits\nsecs, rancio charentais, et une touche boisée.\nFinale : Longue et persistante, avec une élégance\ntypique des vieux cognacs de Grande Champagne.\nCe cognac est idéal pour être dégusté pur, en digestif, ou accompagné de\ndesserts comme une tarte tatin ou une glace à la vanille."}, {"id": 190, "name": "Cognac Courvoisier VS", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "description": "Le Courvoisier VS (Very Special) est un cognac emblématique, produit\ndans la région de Cognac, en France. Il est élaboré à partir d'un\nassemblage d'eaux-de-vie soigneusement sélectionnées, principalement\nissues des crus de Fins Bois et de Petite Champagne, et vieillies\npendant au moins 2 ans dans des fûts de chêne.\nProfil aromatique :\nAu nez : Notes fruitées de poire et de raisin, avec\nune touche florale et une pointe de vanille.\nEn bouche : Saveurs équilibrées de fruits mûrs,\ncaramel et une subtile influence boisée.\nFinale : Douce et légère, avec une belle fraîcheur.\nAvec un taux d'alcool de 40 %, le Courvoisier VS est idéal pour être\ndégusté pur, sur glace, ou utilisé dans des cocktails classiques comme\nle Sidecar, le French 75au cognac ou un champagne cocktail."}, {"id": 191, "name": "Brandy St Remy VSOP", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "description": "Le St-Rémy VSOP est un brandy français emblématique, produit dans la\nrégion du Sud-Ouest de la France. Ce spiritueux est élaboré à partir de\nraisins soigneusement sélectionnés, distillés avec précision, puis\nvieilli dans des fûts de chêne français pour développer une richesse\naromatique et une douceur veloutée.\nProfil aromatique :\nAu nez : Notes fruitées de prune et de raisin, avec\nune touche florale et des nuances de vanille.\nEn bouche : Saveurs équilibrées de fruits mûrs,\ncaramel et une pointe d'épices.\nFinale : Douce et élégante, avec une belle\npersistance.\nAvec un taux d'alcool de 40 %, le St-Rémy VSOP est polyvalent : il peut\nêtre dégusté pur, sur glace, ou utilisé dans des cocktails classiques\ncomme le Brandy Alexander ou le brandy flip."}, {"id": 192, "name": "Armagnac château de laubade 2004", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "description": "Le Château de Laubade 2004 est un Bas-Armagnac millésimé, produit dans\nla région de Gascogne, en France. Ce spiritueux est élaboré à partir de\ncépages tels que le Baco, l'Ugni Blanc, le Colombard, et la Folle\nBlanche, chacun distillé séparément pour préserver leurs\ncaractéristiques uniques.\nCaractéristiques principales :\nVieillissement : Entre 15 et 50 ans en fûts de chêne\nde Gascogne, offrant une grande finesse et complexité.\nProfil aromatique :\nAu nez : Notes d'agrumes, vanille, et boisées.\nEn bouche : Saveurs élégantes de fruits secs, vanille,\net bois grillé.\nFinale : Longue et sèche, avec une belle acidité et\ndes nuances de raisins secs.\nAvec un taux d'alcool de 40 %, cet Armagnac est idéal pour être dégusté\npur, en digestif, ou accompagné de desserts raffinés."}, {"id": 193, "name": "Armagnac Recapet", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": null, "description": "L'Armagnac Récapet Targuerie VSOP est un spiritueux raffiné provenant\nde la région du Bas-Armagnac, en France. Ce VSOP (Very Special Old Pale)\nest élaboré à partir du cépage Baco Blanc, typique de l'appellation, et\nvieilli dans des fûts de chêne pour développer une richesse aromatique\net une belle complexité.\nProfil aromatique :\nAu nez : Notes d'abricot, vanille bourbon, et des\nnuances pâtissières comme le caramel et les fruits à coque.\nEn bouche : Une texture veloutée avec des saveurs de\npruneau, épices douces, et une touche de cire d'abeille.\nFinale : Longue et équilibrée, avec une belle rondeur.\nCet armagnac est idéal pour être dégusté pur ou accompagné de desserts\ncomme une tarte aux fruits ou des pralines."}, {"id": 194, "name": "Armagnac dartigalongue", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": null, "description": "L'Armagnac Dartigalongue est une maison historique fondée en 1838,\nsituée à Nogaro, dans la région du Bas-Armagnac, en Gascogne. Elle est\nreconnue pour son savoir-faire artisanal transmis depuis plusieurs\ngénérations, et ses armagnacs sont élaborés à partir de cépages typiques\ncomme le Baco, l'Ugni Blanc, et la Folle Blanche.\nCaractéristiques principales :\nDistillation : Réalisée dans des alambics armagnacais\ntraditionnels pour préserver les arômes.\nVieillissement : En fûts de chêne gascon, ce qui\nconfère des notes boisées et une belle complexité.\nProfil aromatique :\nAu nez : Notes de fruits secs, vanille, pruneaux, et\nune touche épicée.\nEn bouche : Saveurs riches de caramel, fruits confits,\net une pointe de rancio.\nFinale : Longue et élégante, avec des nuances boisées\net florales.\nLa maison propose une large gamme, allant des VSOP aux millésimes rares,\ncomme le célèbre millésime 1848, considéré comme l'un des plus anciens\nde la région."}, {"id": 195, "name": "Fine de bourgogne", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": null, "description": "La Fine de Bourgogne est une eau-de-vie prestigieuse issue de la\ndistillation des vins de Bourgogne, plus précisément des lies fines\nprovenant des soutirages des vins. Elle bénéficie d'une Appellation\nd'Origine Contrôlée (AOC) depuis 2011.\nCaractéristiques principales :\nZone géographique : Produite dans 388 communes\nréparties sur les départements de la Côte-d'Or, du Rhône, de la\nSaône-et-Loire et de l'Yonne\nVieillissement : Obligatoirement vieilli pendant au\nmoins 3 ans en fûts de chêne, ce qui lui confère douceur et complexité.\nProfil aromatique :\nAu nez : Notes boisées et fruitées.\nEn bouche : Saveurs élégantes de fruits secs et une\ntouche épicée.\nFinale : Longue et équilibrée.\nLa Fine de Bourgogne est souvent comparée au Marc de Bourgogne, mais\nelle se distingue par son procédé de distillation et ses\ncaractéristiques uniques."}, {"id": 196, "name": "Eau de vie de poire massenez", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": null, "description": "L'Eau-de-Vie de Poire William Massenez est une référence emblématique\ndans le monde des eaux-de-vie de fruits. Produite par la maison\nMassenez, fondée en 1870 en Alsace, cette eau-de-vie met en valeur la\npureté et l'intensité aromatique de la poire Williams.\nCaractéristiques principales :\nArômes : Parfum franc et authentique de poire fraîche,\navec des notes sucrées et légèrement florales.\nEn bouche : Saveurs équilibrées, mêlant la douceur du\nfruit mûr et une légère acidité qui apporte de la vivacité.\nParticularité :\nLa célèbre version \"Poire Prisonnière\" est une variante unique où une\npoire entière est enfermée dans la bouteille pendant sa croissance,\noffrant une expérience visuelle et gustative exceptionnelle.\nCette eau-de-vie est idéale en digestif, mais peut également être\nutilisée pour sublimer des desserts ou des cocktails."}, {"id": 197, "name": "Eau de vie framboise sivo", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": null, "description": "L'Eau-de-Vie de Framboise Sivo, appelée L'Essence de Framboise, est un\nproduit artisanal unique au Québec, élaboré par la Maison Sivo. Cette\neau-de-vie est fabriquée à partir de framboises du terroir québécois,\ncultivées dans la région de Franklin, en Montérégie.\nCaractéristiques principales :\nDistillation : Les framboises sont micro-distillées\ndans un alambic de type Aroma, conçu par la firme allemande Müller\nBrennereianlagen.\nProfil aromatique :\nAu nez : Arômes puissants de framboises fraîches.\nEn bouche : Douceur et intensité, avec une longue\npersistance aromatique.\n<\nUtilisation :\nCette eau-de-vie est idéale pour être dégustée pure, à température\nambiante ou bien froide, selon les préférences. Elle peut également être\nutilisée pour créer des cocktails raffinés ou pour sublimer des\ndesserts."}, {"id": 198, "name": "Eau de vie de poire sab's", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": null, "description": "L'Eau-de-Vie de Poire Williams Sab's, également appelée \"La Poire\",\nest un spiritueux artisanal produit en Bourgogne, France. Cette\neau-de-vie met en valeur la pureté et l'intensité aromatique de la\npoire Williams, grâce à un processus de distillation soigné.\nProfil aromatique :\nAu nez : Arômes puissants de poire mûre, accompagnés\nde notes de fruits frais et d'une touche vanillée.\nEn bouche : Saveurs équilibrées, avec une structure\ndroite et une belle persistance aromatique.\nParticularité : Distillée dans un alambic en cuivre,\nsouvent sur le lieu même des récoltes, pour capturer toute la fraîcheur\net la richesse des fruits.\nCette eau-de-vie est idéale pour être dégustée pure, en digestif, ou\npour accompagner des desserts comme un sorbet à la poire."}, {"id": 199, "name": "Eau de vie framboise zusslin", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 45.0, "description": "L'Eau-de-Vie de Framboise Valentin Zusslin est une création artisanale\ndu Domaine Valentin Zusslin, situé en Alsace, France. Ce domaine est\nréputé pour ses eaux-de-vie de fruits, élaborées avec soin et respect\ndes traditions.\nCaractéristiques principales :\nDegré d'alcool : 45 %.\nProfil aromatique :\nAu nez : Arômes intenses de framboises fraîches, avec\nune touche florale.\nEn bouche : Saveurs riches et équilibrées, offrant une\nbelle persistance aromatique.\nParticularité : Produit biologique, mettant en avant\ndes fruits de haute qualité.\nCette eau-de-vie est idéale pour être dégustée pure, en digestif, ou\nutilisée pour sublimer des desserts et des cocktails."}, {"id": 200, "name": "Eau de vie mirabelle Zusslin", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 45.0, "description": "L'Eau-de-Vie de Mirabelle Valentin Zusslin est une création artisanale\nexceptionnelle, produite en Alsace par le Domaine Valentin Zusslin.\nVoici quelques détails sur cette eau-de-vie raffinée :\nCaractéristiques principales :\nMirabelles issues des vergers du domaine, cultivées en biodynamie.\nDegré d'alcool : 45 %.\nMéthode de production : Les mirabelles sont récoltées\nà la main, fermentées avec soin, puis distillées dans un alambic\nHolstein en une seule passe pour préserver la pureté des arômes.\nL'eau-de-vie est ensuite affinée pendant un an en cuve avant d'être\nmise en bouteille.\nProfil aromatique :\nAu nez : Arômes riches de mirabelles mûres, avec une\ntouche de fruits compotés.\nEn bouche : Une belle rondeur, des saveurs intenses de\nfruits à noyaux, et une texture soyeuse.\nFinale : Longue et élégante, avec une complexité\ntypique des eaux-de-vie de fruits à noyaux.\nCette eau-de-vie est idéale pour être dégustée pure, en digestif, ou\npour accompagner des desserts comme une tarte aux mirabelles."}, {"id": 201, "name": "Grappa poli bassano", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 40.0, "description": "La Grappa Poli Bassano est une eau-de-vie italienne artisanale produite\npar la célèbre Distillerie Poli, située à Bassano del Grappa, dans la\nrégion de la Vénétie. Cette grappa est élaborée à partir de marcs de\nraisin soigneusement sélectionnés, distillés dans des alambics\ntraditionnels en cuivre.\nCaractéristiques principales :\nDegré d'alcool : 40 %.\nProfil aromatique :\nAu nez : Notes fruitées et florales, avec une touche\nde raisin frais.\nEn bouche : Saveurs équilibrées, avec une belle\nrondeur et une légère note boisée.\nParticularité :\nLa Distillerie Poli est reconnue pour son savoir-faire artisanal depuis\n1898, et elle propose également un musée dédié à la grappa à Bassano del\nGrappa, où l'on peut découvrir l'histoire et les techniques de\nproduction de ce spiritueux unique."}, {"id": 202, "name": "Grappa domus", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": null, "description": "La Grappa Domus Ruché DOCG est une grappa artisanale exceptionnelle,\nproduite à partir du cépage rare Ruché DOCG, cultivé dans les collines\nautour de Castagnole Monferrato, dans le Piémont, au nord-ouest de\nl'Italie. Cette grappa est une édition limitée, avec seulement 500\nbouteilles produites, ce qui en fait un spiritueux très recherché.\nProfil aromatique :\nAu nez : Notes de pêche blanche, aloe vera, et une\ntouche subtile de fleur de rose et de zeste de citron.\nEn bouche : Texture huileuse avec des saveurs de pain\ngrillé, amandes rôties, et une légère douceur chocolatée.\nFinale : Longue et persistante, avec des nuances de\npain grillé et d'eau de rose.\nParticularité :\nCette grappa est produite par la Distilleria Dellavalle, et son design\nest signé par une artiste italienne, ajoutant une touche esthétique à\nson exclusivité."}, {"id": 203, "name": "Marc de chambertin", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": null, "description": "Le Marc de Chambertin est une eau-de-vie prestigieuse produite à partir\ndes marcs de raisin issus des vignobles de Chambertin, un célèbre Grand\nCru de Bourgogne. Cette spécialité bourguignonne est souvent associée à\ndes domaines renommés comme le Domaine Trapet Père & Fils, qui\nperpétuent la tradition de distillation artisanale.\nCaractéristiques principales :\nOrigine : Les marcs proviennent exclusivement des\nraisins de Pinot Noir cultivés dans les parcelles du Grand Cru\nChambertin.\nProfil aromatique :\nAu nez : Notes complexes de fruits secs, pruneaux,\nfigues, et une touche boisée.\nEn bouche : Saveurs riches et moelleuses, avec des\nnuances de kirsch et de rancio.\nFinale : Longue et persistante, avec une élégance\ntypique des eaux-de-vie de Bourgogne. Finale : Longue et persistante,\navec une élégance typique des eaux-de-vie de Bourgogne.\nLe Domaine Trapet Père & Fils est l'un des producteurs emblématiques de\ncette eau-de-vie, avec des millésimes rares comme le Marc de Chambertin\n1995 ou 1996, disponibles en éditions limitées."}, {"id": 204, "name": "Grappa Millia marolo", "category": "Cognacs, Armagnacs et Eaux-de-vie", "abv": 35.0, "description": "La Grappa Milla Marolo est une liqueur italienne unique, produite par la\ncélèbre Distilleria Marolo, située dans la région du Piémont. Cette\ngrappa se distingue par son infusion de fleurs de camomille, ce qui lui\nconfère un profil aromatique doux et floral.\nCaractéristiques principales :\nDegré d'alcool : 35 %.\nProfil aromatique :\nAu nez : Notes délicates de camomille, pêche et\nabricot.\nEn bouche : Saveurs équilibrées de fruits mûrs, avec\nune touche sucrée et épicée.\nFinale : Douce et persistante, avec une élégance\nflorale.\nParticularité :\nLa Milla est une réinterprétation moderne d'une recette traditionnelle\ndu Piémont, où les fleurs de camomille sont infusées dans la grappa\npendant plusieurs mois pour en extraire /* ---------- normalisation & synonymes ---------- */
function stripAccents(s){
  return s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'');
}
function norm(s){
  return stripAccents((s||'').toLowerCase()).replace(/[^a-z0-9%.,\s]/g,' ').replace(/\s+/g,' ').trim();
}

const STOPWORDS = new Set(['le','la','les','un','une','des','de','du','et','ou','pour','avec','sans','qui','que','dans','sur','au','aux','en','a','plus','moins','tres','peu','ce','cette','ces','je','cherche','veux','voudrais','quelque','chose','svp','stp']);

// groupes de synonymes : chaque mot de la requête est étendu par son groupe
const SYNONYMS = [
  ['sucre','doux','douce','sucree','sirupeux'],
  ['amer','amertume','bitter'],
  ['fruite','fruits','fruitee','fruits rouges','fruits secs'],
  ['epice','epicee','epices','chaud','chaude'],
  ['floral','florale','fleurs','fleur'],
  ['herbace','herbacee','herbes','vegetal'],
  ['boise','boisee','bois','chene','fut'],
  ['fume','fumee','tourbe','tourbee'],
  ['agrumes','citron','orange','pamplemousse','citronne'],
  ['leger','legere','faible','doux en alcool','peu alcoolise'],
  ['fort','puissant','corse','costaud'],
  ['rhum','rhums','rum'],
  ['whisky','whiskey','scotch','bourbon','rye'],
  ['gin','gins'],
  ['vodka','vodkas'],
  ['tequila','mezcal','agave'],
  ['cognac','armagnac','eau de vie','brandy'],
  ['vermouth','xeres','sherry'],
  ['anise','anisee','pastis','ouzo','absinthe'],
  ['liqueur','liqueurs','digestif','apero','aperitif'],
  ['vanille','vanillee'],
  ['caramel','toffee'],
  ['cacao','chocolat'],
  ['epicee','poivre','poivree','cannelle'],
];
function expandTerm(t){
  const out = new Set([t]);
  for(const group of SYNONYMS){
    if(group.some(g => g.includes(t) || t.includes(g))){
      group.forEach(g=>out.add(g));
    }
  }
  return [...out];
}

/* ---------- contraintes numériques (abv) ---------- */
function parseConstraints(q){
  const c = { maxAbv:null, minAbv:null };
  let m;
  if(m = q.match(/(?:moins de|sous|inferieur a|max)\s*(\d{1,2})\s*%?/)) c.maxAbv = parseFloat(m[1]);
  if(m = q.match(/(?:plus de|au dessus de|superieur a|min)\s*(\d{1,2})\s*%?/)) c.minAbv = parseFloat(m[1]);
  if(/faible en alcool|peu alcoolis|leger en alcool/.test(q)) c.maxAbv = c.maxAbv ?? 20;
  if(/fort en alcool|tres alcoolis|puissant/.test(q)) c.minAbv = c.minAbv ?? 35;
  return c;
}

/* ---------- catégories ---------- */
const CATEGORIES = [...new Set(PRODUCTS.map(p=>p.category))];

/* préparation index de recherche */
const indexed = PRODUCTS.map(p=>({
  ...p,
  nName: norm(p.name),
  nCategory: norm(p.category),
  nDesc: norm(p.description)
}));

/* ---------- scoring ---------- */
function escapeRe(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
}
// regex sur mots entiers uniquement : "gin" ne doit pas matcher "gingembre"
function termRegex(term, flags){
  const t = term.trim();
  const hasSpace = t.includes(' ');
  const esc = escapeRe(t).replace(/ +/g,'\\s+');
  const suffix = hasSpace ? '' : 's?'; // tolère un pluriel simple sur un terme d'un seul mot
  return new RegExp('\\b' + esc + suffix + '\\b', flags || '');
}
function wordMatch(text, term){
  return termRegex(term).test(text);
}

function score(product, terms){
  let s = 0;
  for(const t of terms){
    if(!t || t.length < 2) continue;
    const nameHit = wordMatch(product.nName, t);
    if(nameHit) s += product.nName.startsWith(t) ? 8 : 5;
    if(wordMatch(product.nCategory, t)) s += 3;
    if(wordMatch(product.nDesc, t)) s += 1;
  }
  return s;
}

function highlight(text, terms){
  let out = text;
  const uniq = [...new Set(terms.filter(t=>t.length>2))].sort((a,b)=>b.length-a.length);
  for(const t of uniq){
    const re = termRegex(t, 'gi');
    out = out.replace(re, '<mark>$&</mark>');
  }
  return out;
}

/* ---------- état ---------- */
let activeCategory = null;
let query = '';

function render(){
  const q = norm(query);
  const rawTerms = q.split(' ').filter(t => t && !STOPWORDS.has(t));
  const constraints = parseConstraints(q);
  let terms = [];
  rawTerms.forEach(t => expandTerm(t).forEach(e => terms.push(e)));
  if(terms.length===0 && q) terms = [q];

  let list = indexed.slice();

  if(activeCategory){
    list = list.filter(p => p.category === activeCategory);
  }
  if(constraints.maxAbv !== null){
    list = list.filter(p => p.abv === null || p.abv <= constraints.maxAbv);
  }
  if(constraints.minAbv !== null){
    list = list.filter(p => p.abv === null || p.abv >= constraints.minAbv);
  }

  if(terms.length){
    list = list.map(p => ({p, s: score(p, terms)}))
               .filter(x => x.s > 0)
               .sort((a,b)=> b.s - a.s)
               .map(x=>x.p);
  } else {
    list = list.sort((a,b)=> a.name.localeCompare(b.name, 'fr'));
  }

  const resultsEl = document.getElementById('results');
  const emptyEl = document.getElementById('empty');
  const countEl = document.getElementById('count');

  countEl.textContent = list.length + (list.length>1 ? ' résultats' : ' résultat');

  if(list.length===0){
    resultsEl.innerHTML='';
    emptyEl.style.display='block';
    return;
  }
  emptyEl.style.display='none';

  resultsEl.innerHTML = list.map(p=>{
    const nameH = terms.length ? highlight(p.name, terms) : p.name;
    const descH = terms.length ? highlight(p.description, terms) : p.description;
    const abvLabel = p.abv !== null ? p.abv + '%' : '—';
    return `<div class="card" data-id="${p.id}">
      <div class="card-top">
        <div class="card-name">${nameH}</div>
        <div class="card-meta"><span class="abv">${abvLabel}</span></div>
      </div>
      <div class="category">${p.category}</div>
      <div class="card-desc">${descH}</div>
    </div>`;
  }).join('');

  resultsEl.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('click', ()=> el.classList.toggle('expanded'));
  });
}

function renderChips(){
  const chipsEl = document.getElementById('chips');
  chipsEl.innerHTML = ['Toutes', ...CATEGORIES].map(c=>{
    const isActive = (c==='Toutes' && !activeCategory) || c===activeCategory;
    return `<button class="chip ${isActive?'active':''}" data-cat="${c}">${c}</button>`;
  }).join('');
  chipsEl.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      const cat = el.dataset.cat;
      activeCategory = (cat==='Toutes') ? null : cat;
      renderChips();
      render();
    });
  });
}

document.getElementById('search').addEventListener('input', (e)=>{
  query = e.target.value;
  render();
});

renderChips();
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
