<style>
  :root{
    --bg: #17110d;
    --bg-elevated: #201812;
    --bg-card: #1c1510;
    --line: #3a2c20;
    --line-soft: #2a2019;
    --copper: #c97c4a;
    --amber: #e8a857;
    --text: #f2e9dd;
    --text-muted: #ab9a83;
    --text-faint: #6f6152;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,124,74,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .ui, input, button, .chip, .meta, .count, .empty-state, .hint{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }

  header.top{
    position:sticky; top:0; z-index:10;
    background: linear-gradient(180deg, var(--bg) 60%, rgba(23,17,13,0.94) 100%);
    backdrop-filter: blur(6px);
    border-bottom:1px solid var(--line);
    padding: 22px 20px 16px;
  }
  .header-inner{ max-width:820px; margin:0 auto; }
  .title-row{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    margin-bottom:16px;
  }
  h1{
    font-size:1.5rem; margin:0; font-weight:600; letter-spacing:0.01em;
    color:var(--text);
  }
  h1 span{ color:var(--copper); }
  .subtitle{ color:var(--text-faint); font-size:0.8rem; margin:2px 0 0; }

  .search-wrap{ position:relative; }
  input#search{
    width:100%;
    background: var(--bg-elevated);
    border:1px solid var(--line);
    color:var(--text);
    font-size:1rem;
    padding: 13px 44px 13px 16px;
    border-radius:10px;
    outline:none;
    transition: border-color .15s ease;
  }
  input#search::placeholder{ color:var(--text-faint); }
  input#search:focus{ border-color:var(--copper); }
  .search-icon{
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    color:var(--text-faint); pointer-events:none; font-size:1rem;
  }

  .hint{
    color:var(--text-faint); font-size:0.75rem; margin-top:8px; line-height:1.5;
  }

  .chips{
    display:flex; gap:8px; overflow-x:auto; margin-top:14px; padding-bottom:2px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-muted);
    padding:6px 13px;
    border-radius:999px;
    font-size:0.78rem;
    cursor:pointer;
    white-space:nowrap;
    transition: all .15s ease;
  }
  .chip:hover{ border-color:var(--copper); color:var(--text); }
  .chip.active{
    background:var(--copper); border-color:var(--copper); color:#1a1108; font-weight:600;
  }

  main{ max-width:820px; margin:0 auto; padding:20px 20px 80px; }

  .count{
    color:var(--text-faint); font-size:0.78rem; margin:4px 4px 16px;
    letter-spacing:0.02em;
  }

  .results{ display:flex; flex-direction:column; gap:2px; }

  .card{
    padding:18px 16px;
    border-bottom:1px solid var(--line-soft);
    cursor:pointer;
  }
  .card:first-child{ border-top:1px solid var(--line-soft); }
  .card-top{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  }
  .card-name{
    font-size:1.12rem; font-weight:600; color:var(--text);
    letter-spacing:0.01em;
  }
  .card-name mark, .card-desc mark{
    background:transparent; color:var(--amber); font-weight:700;
  }
  .card-meta{
    display:flex; align-items:center; gap:8px; flex:0 0 auto;
  }
  .abv{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:0.72rem; color:var(--copper); border:1px solid var(--line);
    padding:2px 8px; border-radius:999px; white-space:nowrap;
  }
  .category{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:0.72rem; color:var(--text-faint); margin-top:3px;
  }
  .card-desc{
    font-size:0.89rem; line-height:1.55; color:var(--text-muted);
    margin-top:8px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card.expanded .card-desc{
    -webkit-line-clamp:unset; overflow:visible; white-space:pre-line;
  }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-faint);
  }
  .empty-state .big{ font-size:2rem; margin-bottom:10px; }
  .empty-state p{ font-size:0.9rem; max-width:360px; margin:6px auto 0; line-height:1.5; }

  @media (max-width:480px){
    h1{ font-size:1.25rem; }
    .card-name{ font-size:1.03rem; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="header-inner">
    <div class="title-row">
      <div>
        <h1>Carte des <span>alcools</span></h1>

      </div>
    </div>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="ex : un amer italien fruité, un gin floral, sous 20% d'alcool…" autocomplete="off">
      <span class="search-icon">⌕</span>
    </div>
    <p class="hint">Décris ce que tu cherches en langage naturel — arômes, type de spiritueux, degré d'alcool, cocktail associé.</p>

</header>

<main>
  <div class="count" id="count"></div>
  <div class="results" id="results"></div>

    <p>Aucun résultat. Essaie une autre formulation, ou un terme plus général — un type de spiritueux, une note aromatique, une région.</p>
  </div>
</main>

<script>
const PRODUCTS = [{"id": 1, "name": "Amermelade", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 18.0, "description": "L'Amermelade est un apéritif québécois unique, créé par Les Subversifs.\nC'est le tout premier apéritif amer fabriqué au Québec, s'inspirant\ndes classiques italiens comme l'Aperol. Il est élaboré à partir de\ngentiane et de quinine, avec une vingtaine d'aromates locaux, tels que\nl'argousier, le vinaigrier et le myrique baumier. Son profil aromatique\nse distingue également par des notes d'agrumes, de rose et de\ngingembre, offrant une saveur à la fois complexe et raffinée.\nAvec un taux d'alcool de 18 %, l'Amermelade se démarque par sa teneur\nen sucre plus modérée que celle de ses homologues italiens. Il peut être\ndégusté pur ou intégré dans des cocktails tels que le Spritz ou le\nNegroni."}, {"id": 2, "name": "Amernoire", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 31.0, "description": "L'Amernoire est une liqueur amère québécoise produite par Les\nSubversifs. Ce spiritueux se distingue par sa couleur noire intense et\nson profil aromatique complexe. Avec un taux d'alcool de 31 %, il offre\nune expérience gustative riche et audacieuse. Son profil aromatique se\ncaractérise par des notes de cacao, de café torréfié, de réglisse et\nd'épices, équilibrées par une légère amertume herbacée. Ces saveurs\nprofondes et intenses en font un choix idéal pour des cocktails\nsophistiqués ou une dégustation pure."}, {"id": 3, "name": "Averna", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 29.0, "description": "L'Averna, ou Amaro Averna, est une liqueur italienne douce-amère\noriginaire de Sicile, produite depuis 1868 par le groupe Fratelli\nAverna. Avec un taux d'alcool de 29 %, cette liqueur est fabriquée à\npartir d'un mélange secret de 33 herbes, racines et écorces d'agrumes,\ndont la gentiane et la cannelle. Elle est également enrichie de caramel,\nce qui lui confère sa couleur brun foncé et son goût légèrement sucré.\nSon profil aromatique se distingue par des notes herbacées, de caramel\net de cannelle, équilibrées par une amertume subtile. L'Averna peut\nêtre dégustée pure, avec des glaçons, ou utilisée dans des cocktails\ncomme le Mojito italien ou le Vertigo."}, {"id": 4, "name": "Carciofo Faccia bruto", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 25.0, "description": "Le Carciofo de Faccia Brutto est une liqueur amère artisanale produite à\nBrooklyn, New York. Inspirée par l'amour des saveurs amères, cette\nliqueur met en valeur l'artichaut dans toute sa splendeur. Elle est\nélaborée à partir d'un mélange de 19 herbes et plantes botaniques, dont\nla cannelle, le piment de la Jamaïque et la racine de pissenlit. Les\nartichauts frais, provenant de la Central Valley en Californie, sont\nmacérés pendant 10 jours avec ces ingrédients, créant un profil\naromatique riche et complexe.\nAvec un taux d'alcool de 25 %, cette liqueur est légèrement sucrée\ngrâce à l'utilisation de sucre de canne biologique. Ses notes de\ncitron, de feuille de laurier et d'épices chaudes en font un choix\nidéal pour des cocktails comme le Carciofo Spritz ou le Bitter Giuseppe."}, {"id": 5, "name": "Lucano", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 28.0, "description": "L'Amaro Lucano est une liqueur italienne emblématique, créée en 1894\npar Pasquale Vena dans la petite ville de Pisticci, en Basilicate. Cette\nliqueur appartient à la catégorie des amari, des digestifs herbacés\ntypiques de l'Italie. Avec un taux d'alcool de 28 %, l'Amaro Lucano\nest élaboré à partir d'une recette secrète combinant plus de 30 herbes\net plantes botaniques soigneusement sélectionnées.\nSon profil aromatique est complexe et équilibré, avec des notes\nherbacées, d'agrumes, de caramel et d'épices douces. Sa saveur est à\nla fois douce-amère, ce qui en fait un excellent choix pour être dégusté\npur, sur glace, ou comme ingrédient dans des cocktails raffinés."}, {"id": 6, "name": "Amaro Meletti", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 32.0, "description": "L'Amaro Meletti est une liqueur amère italienne produite dans la région\ndes Marches, à Ascoli Piceno. Créée par la famille Meletti, cette\nliqueur est élaborée à partir d'une infusion de fruits, d'herbes et\nd'épices soigneusement sélectionnés. Avec un taux d'alcool de 32 %,\nelle se distingue par sa couleur ambrée et son goût équilibré, à la fois\ndoux et légèrement amer.\nSon profil aromatique est riche et complexe, avec des notes de caramel,\nde safran des Sibillini, de clou de girofle, de gentiane et d'écorce\nd'orange. Ces saveurs en font un excellent digestif, souvent dégusté\npur, sur glace, ou même ajouté à des cocktails comme le Spritz ou le\nSharpie Mustache."}, {"id": 7, "name": "Amaro montenegro", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 23.0, "description": "L'Amaro Montenegro est une liqueur amère italienne emblématique, créée\nen 1885 par Stanislao Cobianchi à Bologne, en Italie. Avec un taux\nd'alcool de 23 %, cette liqueur est élaborée à partir d'un mélange\nsecret de 40 plantes botaniques, incluant la vanille, les écorces\nd'orange et l'eucalyptus. Elle a été nommée en l'honneur de la\nprincesse Elena du Monténégro.\nSon profil aromatique est complexe et équilibré, combinant des notes\nherbacées, florales, épicées et légèrement sucrées. L'Amaro Montenegro\nest souvent décrite comme ayant une saveur douce-amère, parfaite pour\nêtre dégustée pure, sur glace, ou dans des cocktails comme le célèbre\n\"Montenegroni\" ou le \"Paper Plane\".( nous utilisons du amaro nonino\npour nos paper plane mais on peut y mettre du montenegro )"}, {"id": 8, "name": "Amaro Nonino", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 35.0, "description": "L'Amaro Nonino Quintessentia est une liqueur amère italienne raffinée,\ncréée en 1992 par Benito Nonino, un distillateur de quatrième\ngénération. Ce spiritueux se distingue par sa base unique de grappa, un\nbrandy italien à base de marc de raisin, qui lui confère des notes\nfruitées distinctives. Avec un taux d'alcool de 35 %, il est élaboré à\npartir d'une infusion de plantes botaniques telles que l'orange amère,\nla gentiane, le safran, le tamarin et l'absinthe.\nSon profil aromatique est complexe et équilibré, combinant des saveurs\nde caramel, d'orange, d'abricot, de vanille et d'épices herbacées.\nL'Amaro Nonino peut être dégusté pur, sur glace, ou intégré dans des\ncocktails comme le célèbre Paper Plane ou l'Amaro Spritz."}, {"id": 9, "name": "Amaro rabarbaro", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 16.0, "description": "Le Rabarbaro Zucca est un amaro italien emblématique, créé en 1845 par\nEttore Zucca à Milan. Contrairement à ce que son nom pourrait suggérer,\nil ne contient pas de courge (\"zucca\" en italien), mais tire son nom\nde son créateur. Cette liqueur est élaborée à partir d'une infusion de\nrhizomes de rhubarbe chinoise, combinée à des écorces d'orange amère,\ndes graines de cardamome, du quinquina et un mélange secret d'herbes\naromatiques.\nAvec un taux d'alcool de 16 %, le Rabarbaro Zucca se distingue par son\nprofil aromatique doux-amer, avec des notes herbacées, terreuses et\nlégèrement épicées. Il est souvent consommé en apéritif, pur, sur glace,\nou allongé avec de l'eau gazeuse. Il peut également être utilisé dans\ndes cocktails pour ajouter une touche amère et équilibrée."}, {"id": 10, "name": "Amaro rucolino", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 30.0, "description": "L'Amaro Rucolino est une liqueur amère unique, originaire de l'île\nd'Ischia, près de Naples, en Italie. Ce spiritueux artisanal est\nélaboré à partir de roquette (rucola en italien), qui lui confère son\ncaractère herbacé distinctif. Avec un taux d'alcool de 30 %, il est\nsouvent apprécié comme digestif après un repas.\nSon profil aromatique est complexe et équilibré, mêlant des notes\nherbacées, légèrement épicées, et une amertume subtile. La roquette est\nmacérée avec des ingrédients tels que le zeste de citron, la cannelle et\nles clous de girofle, créant une saveur à la fois fraîche et intense.\nL'Amaro Rucolino peut être dégusté pur, sur glace, ou utilisé dans des\ncocktails pour une touche originale."}, {"id": 11, "name": "Amaro vecchio del capo", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 35.0, "description": "Le Vecchio Amaro del Capo est une liqueur amère italienne emblématique,\nproduite par la distillerie familiale Caffo depuis 1915, dans la région\nde la Calabre, au sud de l'Italie. Avec un taux d'alcool de 35 %,\ncette liqueur est élaborée à partir d'une infusion de 29 herbes,\nfleurs, fruits et racines locales, soigneusement sélectionnées pour\ncréer un équilibre parfait entre douceur et amertume.\nSon profil aromatique est riche et complexe, avec des notes de\nmandarine, d'orange amère, de réglisse, de menthe poivrée, de camomille\net d'autres plantes aromatiques. Il est recommandé de le déguster\nglacé, à une température de -20 °C, pour en apprécier pleinement les\nsaveurs. Le Vecchio Amaro del Capo peut être consommé pur, en digestif,\nou utilisé dans des cocktails comme le Capo Tonic ou le Capo Spritz."}, {"id": 12, "name": "Amaro Vero", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 30.0, "description": "L'Amaro Vero est une liqueur amère artisanale produite par Caffè Vero\nen Italie. Ce spiritueux est élaboré selon des méthodes traditionnelles,\navec une infusion de plantes botaniques soigneusement sélectionnées.\nAvec un taux d'alcool de 30 %, il se distingue par son profil\naromatique harmonieux et équilibré, enrichi par des notes de café, grâce\nà l'utilisation d'extraits de café de haute qualité.\nL'Amaro Vero est idéal comme digestif après un repas, servi pur ou sur\nglace. Il peut également être utilisé pour personnaliser des cocktails,\najoutant une touche raffinée et amère."}, {"id": 13, "name": "Aperol", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 11.0, "description": "L'Aperol est une célèbre liqueur amère italienne créée en 1919 par les\nfrères Barbieri à Padoue, en Italie. Avec son taux d'alcool\nrelativement faible de 11 %, l'Aperol se distingue par son goût doux et\néquilibré ainsi que sa couleur orange vibrante, qui est devenue\nemblématique.\nSon profil aromatique est dominé par des notes d'orange amère, de\ngentiane, de rhubarbe et d'herbes aromatiques, avec une touche\nsubtilement sucrée. L'Aperol est particulièrement connu comme\ningrédient principal de l'iconique Spritz, un cocktail facile à\npréparer qui marie Prosecco, Aperol et eau gazeuse, servi avec une\ntranche d'orange."}, {"id": 14, "name": "Benedictine", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 40.0, "description": "La Bénédictine est une liqueur française emblématique, créée en 1863 par\nAlexandre Le Grand à Fécamp, en Normandie. Inspirée par des recettes\nmonastiques anciennes, elle est élaborée à partir d'un mélange secret\nde 27 plantes, épices et herbes, dont certaines connues comme\nl'angélique, la cannelle, le clou de girofle, le safran et la vanille.\nAvec un taux d'alcool de 40 %, elle est à la fois riche et complexe.\nSon profil aromatique se distingue par des notes herbacées, épicées et\nsucrées, avec une touche de miel et d'agrumes. La Bénédictine peut être\ndégustée pure, sur glace, ou utilisée dans des cocktails comme le\ncélèbre B&B, qui mélange Bénédictine et brandy."}, {"id": 15, "name": "Byrrh", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 17.0, "description": "Le Byrrh est un apéritif français emblématique, créé en 1866 à Thuir,\ndans les Pyrénées-Orientales, par les frères Pallade et Simon Violet.\nCet apéritif est élaboré à partir d'un mélange de vin rouge, de\nmistelle (moût de raisin non fermenté additionné d'alcool) et de\nquinquina, une écorce connue pour ses propriétés médicinales. Avec un\ntaux d'alcool de 17 %, le Byrrh se distingue par son goût doux-amer et\nses notes herbacées et épicées.\nSon profil aromatique est riche et complexe, avec des touches de fruits\nrouges, de café, de cacao et d'épices douces. Il est souvent consommé\npur, sur glace, ou utilisé dans des cocktails pour une touche rétro et\nélégante."}, {"id": 16, "name": "Campari", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 25.0, "description": "Le Campari est une célèbre liqueur italienne amère, créée en 1860 par\nGaspare Campari à Novara, en Italie. Avec son taux d'alcool de 25 %,\ncette liqueur rouge vif est fabriquée à partir d'une recette secrète\nmêlant infusions d'herbes, fruits et épices. Sa couleur emblématique\nprovient historiquement du carmin, bien que cette pratique ait évolué au\nfil du temps.\nSon profil aromatique est complexe et intense, offrant des notes\nd'orange amère, de pamplemousse, de plantes aromatiques et une amertume\nprononcée. Le Campari est l'un des ingrédients principaux de cocktails\nclassiques tels que le Negroni, l'Americano ou encore le Campari\nSpritz."}, {"id": 17, "name": "Chartreuse jaune", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 43.0, "description": "La Chartreuse Jaune est une liqueur française emblématique, créée en\n1840 par les moines de la Grande Chartreuse, près de Grenoble. Elle est\nélaborée à partir d'une recette secrète contenant 130 plantes, fleurs,\nécorces, racines et épices, soigneusement sélectionnées et macérées pour\nobtenir ses saveurs uniques. Avec un taux d'alcool de 43 %, elle est\nplus douce et moins puissante que la Chartreuse Verte.\nSon profil aromatique est riche et moelleux, avec des notes de miel,\nd'épices douces, de curcuma, d'agrumes et d'anis. Sa couleur jaune\nnaturelle provient de certains ingrédients spécifiques, comme le safran.\nLa Chartreuse Jaune peut être dégustée pure, sur glace, ou utilisée dans\ndes cocktails pour apporter une touche subtile et raffinée."}, {"id": 18, "name": "Chartreuse verte", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 55.0, "description": "La Chartreuse Verte est une liqueur française emblématique, fabriquée\npar les moines de la Grande Chartreuse depuis 1764. Elle est célèbre\npour son intense couleur verte naturelle, obtenue grâce aux plantes\nutilisées dans sa fabrication. Comme sa version jaune, elle est élaborée\nà partir d'une recette secrète contenant 130 plantes, fleurs, écorces,\nracines et épices, maîtrisée uniquement par deux moines à la fois. Avec\nun taux d'alcool de 55 %, elle est plus forte et plus herbacée que la\nChartreuse Jaune.\nSon profil aromatique est puissant et complexe, avec des notes\nherbacées, mentholées, épicées et légèrement sucrées. La Chartreuse\nVerte peut être dégustée pure, sur glace, ou utilisée dans des cocktails\nclassiques comme le Last Word ou le Bijou, où elle ajoute une profondeur\net une fraîcheur remarquables."}, {"id": 19, "name": "China china", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 40.0, "description": "Le China-China est une liqueur amère française emblématique produite par\nla Maison Bigallet, fondée en 1872 dans les Alpes. Son nom vient du\nquinquina (\"china\" en espagnol) utilisé dans sa recette, un ingrédient\napprécié pour ses propriétés médicinales et sa saveur amère. Avec un\ntaux d'alcool de 40 %, cette liqueur est élaborée à partir d'écorces\nd'orange amère et douce, d'extraits de quinquina et d'un mélange\nsecret de plantes et d'épices.\nSon profil aromatique est à la fois complexe et équilibré, mêlant des\nnotes d'agrumes confits, d'épices chaudes comme la cannelle et la\nmuscade, et une légère amertume herbacée. Le China-China peut être\ndégusté pur, sur glace, ou utilisé dans des cocktails pour ajouter une\nprofondeur aromatique unique."}, {"id": 20, "name": "Cynar", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 16.5, "description": "Le Cynar est une liqueur amère italienne emblématique, créée en 1952 et\nproduite par le groupe Campari. Avec un taux d'alcool de 16,5 %, il se\ndistingue par son ingrédient principal : les feuilles d'artichaut, qui\nlui donnent son nom (inspiré du mot latin Cynara). Cette liqueur est\négalement enrichie par une infusion de 13 herbes et plantes botaniques,\noffrant un profil aromatique unique.\nSon goût est doux-amer, avec des notes végétales, herbacées, et une\ntouche de caramel et de toffee. Le Cynar est souvent consommé pur, sur\nglace, ou utilisé dans des cocktails comme le Cynar Spritz ou le Cynar\nNegroni, où il apporte une profondeur et une amertume équilibrée."}, {"id": 21, "name": "Drambuie", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 40.0, "description": "Le Drambuie est une liqueur écossaise emblématique, riche en histoire et\nen saveurs. Créée au XVIIIᵉ siècle, elle est étroitement liée à\nl'héritage du prince Charles Édouard Stuart, également connu sous le\nnom de Bonnie Prince Charlie. Le nom \"Drambuie\" vient de l'expression\ngaélique An Dram Buidheach, qui signifie \"la boisson qui satisfait\".\nAvec un taux d'alcool de 40 %, cette liqueur est élaborée à partir\nd'un mélange de whisky écossais vieilli, de miel de bruyère, d'herbes\naromatiques et d'épices. Son profil aromatique est doux et complexe,\navec des notes de miel, de caramel, d'agrumes et une touche légèrement\népicée, évoquant la cannelle et la muscade.\nLe Drambuie est souvent dégusté pur, sur glace ou comme ingrédient dans\ndes cocktails classiques tels que le Rusty Nail, où il est mélangé avec\ndu whisky écossais."}, {"id": 22, "name": "Fernet Branca", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 39.0, "description": "Le Fernet-Branca est une liqueur amère italienne emblématique, créée en\n1845 par Bernardino Branca à Milan. Avec un taux d'alcool de 39 %,\ncette liqueur est élaborée à partir d'une recette secrète comprenant 27\nherbes, racines et épices provenant du monde entier, telles que la\ngentiane, la rhubarbe, l'aloès, la camomille, la myrrhe et le safran.\nElle est vieillie pendant un an en foudres de chêne, ce qui contribue à\nson profil aromatique unique.\nSon goût est intense et complexe, avec des notes herbacées, terreuses,\népicées et une amertume prononcée. Le Fernet-Branca est souvent consommé\ncomme digestif, pur ou sur glace, mais il est également utilisé dans des\ncocktails classiques comme le Hanky Panky ou simplement mélangé avec du\ncola, une combinaison particulièrement populaire en Argentine."}, {"id": 23, "name": "Frangelico", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 20.0, "description": "Le Frangelico est une liqueur italienne sucrée et aromatique, fabriquée\ndans la région du Piémont. Avec un taux d'alcool de 20 %, elle est\ncélèbre pour son goût distinctif de noisette grillée. La recette inclut\ndes noisettes Tonda Gentile, originaires de cette région, combinées à\ndes extraits naturels de cacao, de vanille et d'autres plantes\nbotaniques. Le mélange est ensuite adouci avec du sucre et alcoolisé\npour créer une saveur riche et douce.\nSon profil aromatique se caractérise par des notes intenses de noisette,\néquilibrées par des touches de chocolat et de vanille, avec une finition\nlégèrement crémeuse. Le Frangelico peut être dégusté pur, sur glace, ou\nutilisé dans des desserts, ainsi que dans des cocktails tels que le\nNutty Russian ou le Hazelnut Martini."}, {"id": 24, "name": "Galliano", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 42.3, "description": "Le Galliano est une liqueur italienne historique, créée en 1896 par\nArturo Vaccari à Livourne, en Toscane. Avec son taux d'alcool de 42,3\n%, cette liqueur à la couleur dorée emblématique est élaborée à partir\nd'un mélange unique d'herbes, d'épices et de plantes botaniques, dont\nla vanille, la cannelle, le genièvre, la menthe et l'anis. Le résultat\nest un profil aromatique riche et complexe, à la fois sucré et épicé.\nSon goût distinctif de vanille est équilibré par des notes herbacées et\nlégèrement citronnées. Le Galliano est souvent utilisé dans des\ncocktails classiques comme le Harvey Wallbanger (vodka, jus d'orange et\nGalliano) ou le Golden Cadillac (Galliano, crème et liqueur de cacao)."}, {"id": 25, "name": "Jagermeister", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 35.0, "description": "Le Jägermeister est une liqueur allemande emblématique, créée en 1934\npar Curt Mast. Avec un taux d'alcool de 35 %, cette liqueur est\nfabriquée à partir d'une recette secrète comprenant 56 herbes, épices,\nfruits et racines, soigneusement macérés pour en extraire les arômes.\nElle est ensuite vieillie en fût de chêne pendant un an, ce qui lui\nconfère sa profondeur aromatique.\nSon profil gustatif est complexe, combinant des notes herbacées,\népicées, sucrées et légèrement amères. Le Jägermeister est souvent\nconsommé pur, bien glacé, mais il est également populaire dans des\ncocktails ou mélangé avec des boissons comme le Red Bull (dans le\ncélèbre \"Jägerbomb\")."}, {"id": 26, "name": "Lillet", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 17.0, "description": "Le Lillet est un apéritif français classique, produit depuis 1872 dans\nle village de Podensac, près de Bordeaux. Il est élaboré à partir d'un\nmélange de vins de Bordeaux (85 %) et de liqueurs de fruits (15 %),\nainsi que de quinquina, qui lui confère une légère amertume. Avec un\ntaux d'alcool de 17 %, le Lillet se décline en trois versions : Blanc,\nRosé et Rouge, chacune ayant son propre profil aromatique.\nLillet Blanc : Notes d'oranges confites, de miel et de fruits\nexotiques.\nLillet Rosé : Fraîcheur vive avec des arômes de fruits rouges et de\npamplemousse.\nLillet Rouge : Saveurs puissantes d'oranges fraîches, de fruits rouges\nmûrs et d'épices.\nLe Lillet est souvent consommé bien frais, pur ou sur glace, mais il est\négalement utilisé dans des cocktails comme le Lillet Spritz ou le Vesper\nMartini."}, {"id": 27, "name": "Mandarine Napoleon", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 38.0, "description": "La Mandarine Napoléon est une liqueur d'agrumes raffinée, créée en\nBelgique en 1892. Elle est élaborée à partir d'un mélange unique de\nmandarines siciliennes macérées et de cognac de haute qualité, enrichi\nd'un mélange secret de plantes aromatiques. Avec un taux d'alcool de\n38 %, cette liqueur offre un profil aromatique riche et complexe.\nSon goût est dominé par des notes d'agrumes confits, de marmelade, de\ncannelle et de noix de muscade, avec une touche subtile de réglisse. La\nMandarine Napoléon peut être dégustée pure, sur glace, ou utilisée dans\ndes cocktails sophistiqués pour ajouter une profondeur aromatique\nunique."}, {"id": 28, "name": "Maraschino Luxardo", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 32.0, "description": "Le Luxardo Maraschino Originale est une liqueur italienne emblématique,\nproduite depuis 1821 par la maison Luxardo. Elle est fabriquée à partir\nde cerises marasca, une variété rare et acidulée, cultivée dans les\nvergers de la marque. Ces cerises sont macérées avec leurs feuilles et\nbranches , les noyaux des cerises marasca sont intégrés dans le\nprocessus de fabrication du Luxardo Maraschino. Pendant la macération\ndes cerises entières (y compris les noyaux), les noyaux libèrent une\npetite quantité de composés aromatiques, notamment le benzaldéhyde, qui\nconfère à la liqueur son parfum caractéristique d'amande., puis\ndistillées dans des alambics en cuivre traditionnels. Le distillat est\nensuite vieilli dans des fûts de bois de frêne avant d'être adouci avec\nun sirop simple, pour atteindre un taux d'alcool de 32 %.\nSon profil aromatique est unique, avec des notes de cerise, de chocolat\nnoir, de vanille et une légère touche d'orange confite. Le Luxardo\nMaraschino est souvent utilisé dans des cocktails classiques comme le\nLast Word, le Aviation ou le Hemingway Daiquiri, mais il peut également\nêtre dégusté pur ou utilisé pour parfumer des desserts."}, {"id": 29, "name": "Pimm\\`s", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 25.0, "description": "Le Pimm's est une liqueur anglaise emblématique, créée en 1823 par\nJames Pimm. À l'origine, elle était servie comme un digestif à base de\ngin et d'herbes aromatiques. Aujourd'hui, le Pimm's No. 1 Cup, la\nversion la plus connue, est un mélange de gin, de plantes botaniques et\nd'épices, avec un taux d'alcool de 25 %.\nLe Pimm's est particulièrement populaire en été, souvent associé à des\névénements mondains britanniques comme Wimbledon ou les régates de\nHenley. Il est traditionnellement servi en cocktail, mélangé avec de la\nlimonade, des glaçons, et garni de fruits frais (fraises, oranges,\nconcombres) et de menthe. Ce cocktail est connu sous le nom de Pimm's\nCup."}, {"id": 30, "name": "Quaglia Bergamotto", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 35.0, "description": "Le Quaglia Bergamotto est une liqueur italienne raffinée, produite par\nl'Antica Distilleria Quaglia, située dans le Piémont. Avec un taux\nd'alcool de 35 %, elle est élaborée à partir de zestes et de jus de\nbergamote fraîche, associés à des gousses de vanille Bourbon et du jus\nde pamplemousse.\nSon profil aromatique est vibrant et complexe, mêlant des notes\nd'agrumes confits, de vanille douce et une touche légèrement florale et\nbalsamique. Cette liqueur est idéale en digestif, servie bien fraîche,\nou utilisée dans des cocktails comme le Bergamotto Sour, où elle apporte\nune profondeur aromatique unique."}, {"id": 31, "name": "Quaglia camomilla", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 28.0, "description": "Le Quaglia Camomilla est une liqueur artisanale produite par l'Antica\nDistilleria Quaglia, située dans le Piémont, en Italie. Avec un taux\nd'alcool de 28 %, cette liqueur est élaborée à partir de fleurs de\ncamomille séchées, infusées dans de l'alcool, puis distillées avec des\ningrédients tels que le bois de cèdre, les gousses de vanille et\nd'autres épices. Ce processus donne une liqueur délicatement parfumée\net équilibrée.\nSon profil aromatique est marqué par des notes florales intenses, des\ntouches d'agrumes et une douceur subtile d'épices. La Quaglia\nCamomilla est idéale en digestif, servie pure ou sur glace, et peut\négalement être utilisée pour ajouter une touche florale unique à des\ncocktails."}, {"id": 32, "name": "Quaglia Chinotto", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 35.0, "description": "Le Quaglia Chinotto est une liqueur italienne artisanale produite par\nl'Antica Distilleria Quaglia, située dans le Piémont. Avec un taux\nd'alcool de 35 %, cette liqueur est élaborée à partir d'une infusion\nde chinotto, une petite orange amère typique de la Riviera ligure,\nrécoltée à la main. Le processus de macération met en valeur les saveurs\nuniques de cet agrume, combinées à des notes subtiles de vanille et de\nrhubarbe.\nSon profil aromatique est équilibré, avec une amertume modérée et des\ntouches d'agrumes confits, de fleurs d'oranger et de pissenlit. La\nQuaglia Chinotto est idéale en digestif, servie pure ou sur glace, et\npeut également être utilisée dans des cocktails pour ajouter une\nprofondeur aromatique sophistiquée."}, {"id": 33, "name": "Quaglia Violetta", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 20.0, "description": "Le Quaglia Violetta est une liqueur artisanale produite par l'Antica\nDistilleria Quaglia, située dans le Piémont, en Italie. Avec un taux\nd'alcool de 20 %, cette liqueur est élaborée à partir d'une infusion\nde fleurs de violette, capturant leur parfum délicat et leurs saveurs\nflorales uniques. Elle s'inspire des traditions anciennes où les fleurs\nprintanières étaient récoltées et transformées en sirops ou liqueurs.\nSon profil aromatique est marqué par des notes florales intenses,\nlégèrement sucrées, avec une touche subtilement herbacée. La Quaglia\nVioletta est idéale pour ajouter une touche élégante à des cocktails\ncomme le Violet Aviation, ou pour être dégustée pure, bien fraîche."}, {"id": 34, "name": "Salers", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 16.0, "description": "Le Salers est un apéritif français traditionnel, originaire de la région\nd'Auvergne. Il est élaboré à partir de racines de gentiane jaune, une\nplante alpine qui pousse dans les montagnes du Massif central. Avec un\ntaux d'alcool de 16 %, le Salers est l'un des plus anciens apéritifs à\nbase de gentiane, datant de 1885.\nSon profil aromatique est marqué par une amertume herbacée, des notes\nterreuses et une légère fraîcheur citronnée. Il est souvent consommé\npur, sur glace, ou mélangé avec de l'eau gazeuse ou du tonic pour un\napéritif rafraîchissant. Le Salers est également utilisé dans des\ncocktails pour ajouter une touche amère et complexe."}, {"id": 35, "name": "Strega", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 40.0, "description": "Le Strega est une liqueur italienne emblématique, produite depuis 1860\npar la distillerie Strega Alberti à Bénévent, en Campanie. Son nom, qui\nsignifie \"sorcière\" en italien, fait référence aux légendes locales de\nsorcellerie. Avec un taux d'alcool de 40 %, cette liqueur est élaborée\nà partir d'une recette secrète comprenant environ 70 herbes et épices,\ndont la menthe, le fenouil, la cannelle et le safran, qui lui donne sa\ncouleur jaune caractéristique.\nSon profil aromatique est complexe, avec des notes herbacées, épicées et\nlégèrement sucrées. Le Strega est souvent consommé comme digestif, pur\nou sur glace, mais il est également utilisé pour parfumer des desserts,\ncomme la torta caprese, ou dans des cocktails sophistiqués."}, {"id": 36, "name": "Suze", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 15.0, "description": "La Suze est une liqueur française emblématique, créée en 1889 par Henri\nPorte et Fernand Moureaux. Elle est élaborée à partir de racines de\ngentiane jaune, une plante alpine connue pour ses propriétés amères et\nmédicinales. Avec un taux d'alcool de 15 %, la Suze est appréciée pour\nson goût doux-amer et sa couleur dorée caractéristique.\nSon profil aromatique est marqué par des notes herbacées, terreuses et\nlégèrement citronnées. Elle est souvent consommée pure, sur glace, ou\nutilisée dans des cocktails comme le Suze Tonic ou le Suze Spritz, où\nelle apporte une touche amère et rafraîchissante."}, {"id": 37, "name": "Teara Hojicha", "category": "Liqueurs de plantes et apéritifs à base de vin", "abv": 20.0, "description": "Le Teara Hojicha est une liqueur japonaise unique, élaborée à partir de\nthé vert rôti (hojicha). Avec un taux d'alcool de 20 %, cette liqueur\nmet en valeur les arômes distinctifs du hojicha, qui se caractérisent\npar des notes grillées, légèrement boisées et une douceur subtile. Elle\nest produite sans conservateurs ni colorants artificiels, ce qui en fait\nun produit naturel et authentique.\nNotes grillées : Grâce à la torréfaction des feuilles à haute\ntempérature, le hojicha développe un arôme fumé et boisé, souvent\ncomparé à celui des noisettes ou du caramel brûlé.\nDouceur naturelle : Contrairement à certains thés verts qui peuvent être\namers, le hojicha a une douceur subtile et réconfortante, idéale pour\nles palais sensibles.\nArômes terreux : Il présente des notes chaleureuses, presque terreuses,\nqui ajoutent de la profondeur à sa saveur.\nToucher légèrement malté : Parfois, le hojicha peut rappeler des grains\ntorréfiés ou du pain grillé, avec une touche légère qui évoque le café.\nLe Teara Hojicha est idéal pour être dégusté pur, sur glace, ou utilisé\ndans des cocktails pour apporter une touche originale et raffinée."}, {"id": 38, "name": "Avril", "category": "Liqueurs de fruits", "abv": 26.0, "description": "La liqueur Avril est un amaretto québécois produit par la Distillerie\nMariana. Elle se distingue par son mélange unique de saveurs, combinant\ndes noyaux d'abricots, du sirop d'érable, des noix forestières, de la\nnoix de coco et du myrique baumier. Avec un taux d'alcool de 26 %,\ncette liqueur offre un profil aromatique riche et complexe.\nProfil aromatique :\nNotes sucrées : Le sirop d'érable apporte une douceur typiquement\nquébécoise.\nAccents de noix : Les noix forestières et la noix de coco ajoutent une\nprofondeur chaleureuse.\nBouquet caramélisé : Une touche de caramel et de café torréfié en\nfinale.\nL'Avril peut être dégustée pure, sur glace, ou utilisée dans des\ncocktails pour ajouter une touche originale et raffinée. Elle est\négalement idéale pour sublimer des desserts."}, {"id": 39, "name": "Bailey s", "category": "Liqueurs de fruits", "abv": 17.0, "description": "Le Baileys Original Irish Cream est une liqueur irlandaise emblématique,\ncréée en 1974. Elle est fabriquée à partir d'un mélange de whisky\nirlandais, de crème fraîche, de cacao et de vanille, ce qui lui confère\nune texture veloutée et un goût doux et sucré. Avec un taux d'alcool de\n17 %, elle est idéale pour être dégustée pure, sur glace, ou utilisée\ndans des cocktails et desserts.\nLe Baileys est également très apprécié en cuisine, notamment pour\nparfumer des desserts comme les cheesecakes, les brownies ou les mousses\nau chocolat."}, {"id": 40, "name": "Barista", "category": "Liqueurs de fruits", "abv": null, "description": "La liqueur Barista est une liqueur de café artisanale produite au\nQuébec, mettant en valeur un mélange unique de café infusé à froid et de\nrhum ambré des Caraïbes. Cette liqueur est élaborée avec des grains de\ncafé arabica soigneusement sélectionnés, torréfiés artisanalement, et\ninfusés pendant 24 heures pour en extraire toute la richesse aromatique.\nProfil aromatique :\nNotes de café torréfié : Un goût intense et velouté, parfait pour les\namateurs de café.\nTouches de chocolat noir : Une douceur subtile qui équilibre l'amertume\ndu café.\nFinale longue et satisfaisante : Grâce à l'ajout de rhum ambré, qui\napporte une profondeur chaleureuse.\nLa liqueur Barista est idéale pour être dégustée pure, sur glace, ou\nutilisée dans des cocktails comme le Martini Espresso ou le Black\nRussian"}, {"id": 41, "name": "Belle de Brillet", "category": "Liqueurs de fruits", "abv": 30.0, "description": "La Belle de Brillet est une liqueur française raffinée, produite par la\nMaison Brillet. Elle est le résultat d'un assemblage harmonieux de\npoires Williams et de cognac Brillet, offrant un profil aromatique riche\net fruité. Avec un taux d'alcool de 30 %, cette liqueur est idéale pour\nêtre dégustée pure, sur glace, ou utilisée dans des cocktails\nsophistiqués.\nProfil aromatique :\nNotes de poires mûres : Douces et sucrées, avec une fraîcheur naturelle.\nTouches de cognac : Apportant une profondeur et une chaleur élégante.\nFinale subtilement épicée : Avec une légère complexité qui ravit le\npalais.\nLa Belle de Brillet est également utilisée pour parfumer des desserts ou\naccompagner des plats gourmands."}, {"id": 42, "name": "Cassis Monna", "category": "Liqueurs de fruits", "abv": null, "description": "La Cassis Monna & Filles est une entreprise québécoise renommée, située\nsur l'Île d'Orléans. Depuis 1992, elle transforme le cassis (ou\ngroseille noire) en produits de haute qualité, notamment la célèbre\nCrème de Cassis, qui a remporté une médaille d'or en 1995 lors d'un\nconcours européen prestigieux. En plus de cette liqueur, la maison\nproduit des vins apéritifs, des gelées, des sirops et même des moutardes\nà base de cassis.\nLe domaine offre également une expérience gourmande avec son restaurant\nLa Monnaguette, où les visiteurs peuvent déguster des plats mettant en\nvaleur le cassis, tout en profitant d'une vue spectaculaire sur le pont\nde l'Île. C'est un lieu incontournable pour découvrir les mille et une\nfaçons d'apprécier le cassis."}, {"id": 43, "name": "Cointreau", "category": "Liqueurs de fruits", "abv": 40.0, "description": "Le Cointreau est une liqueur française emblématique, créée en 1849 à\nAngers par Édouard Cointreau. C'est un triple sec, une liqueur\nd'orange élaborée à partir d'écorces d'oranges douces et amères\nsoigneusement sélectionnées. Avec un taux d'alcool de 40 %, il est\nréputé pour son équilibre parfait entre douceur et amertume, ainsi que\npour sa transparence cristalline.\nProfil aromatique :\nNotes d'agrumes éclatantes : Oranges douces et amères.\nToucher sucré : Subtil, sans être envahissant.\nFinale vive et rafraîchissante : Idéale pour les cocktails.\nLe Cointreau est un ingrédient clé dans de nombreux cocktails\nclassiques, tels que la Margarita, le Cosmopolitan, le Sidecar et le\nWhite Lady. Il peut également être dégusté pur ou sur glace."}, {"id": 44, "name": "Dry Curacao", "category": "Liqueurs de fruits", "abv": 40.0, "description": "Le Dry Curaçao est une liqueur d'agrumes classique, souvent utilisée\ndans les cocktails. Elle est élaborée à partir d'écorces d'oranges\namères, généralement de l'île de Curaçao, macérées avec des épices et\nmélangées à une base d'alcool, comme du brandy ou du cognac. Avec un\ntaux d'alcool typique de 30 à 40 %, cette liqueur est connue pour son\néquilibre entre douceur et amertume.\nProfil aromatique :\nNotes d'orange amère : Intenses et légèrement sucrées.\nTouches épicées : Parfois avec des nuances de cannelle ou de clou de\ngirofle.\nFinale chaleureuse : Grâce à la base alcoolisée, souvent enrichie de\ncognac.\nLe Dry Curaçao Pierre Ferrand, par exemple, est une version française\nhaut de gamme, conçue selon une recette du XIXe siècle, qui met en\nvaleur des saveurs complexes et raffinées."}, {"id": 45, "name": "Dry curacao yuzu", "category": "Liqueurs de fruits", "abv": 40.0, "description": "Le Dry Curaçao Yuzu Late Harvest est une liqueur innovante créée par\nMaison Ferrand, en collaboration avec David Wondrich. Cette version\nunique du curaçao classique met en avant le yuzu, un agrume japonais\nprisé pour ses arômes complexes et sa fraîcheur. Avec un taux d'alcool\nde 40 %, cette liqueur est élaborée à partir de zestes de yuzu récoltés\ntardivement, ce qui concentre leurs saveurs et leurs sucres naturels.\nProfil aromatique :\nArômes dominants : Notes vives de yuzu, rappelant un mélange de\npamplemousse et de mandarine.\nTouches subtiles : Nuances florales et épicées, avec une base\nchaleureuse de cognac.\nFinale : Équilibre entre douceur et amertume, avec une légère touche\nboisée.\nCette liqueur est idéale pour des cocktails comme le Yuzu Meringue Sour\nou pour être dégustée pure, afin de savourer toute sa complexité."}, {"id": 46, "name": "Grand Marnier", "category": "Liqueurs de fruits", "abv": 40.0, "description": "Le Grand Marnier est une liqueur française prestigieuse, créée en 1880\npar Louis-Alexandre Marnier-Lapostolle. Elle est le fruit d'un mélange\nunique de cognac français et d'oranges amères, ce qui lui confère un\nprofil aromatique riche et sophistiqué. Avec un taux d'alcool de 40 %,\ncette liqueur est souvent utilisée dans des cocktails, des desserts ou\ndégustée pure.\nProfil aromatique :\nNotes d'agrumes : Oranges amères et zestes d'orange.\nTouches de cognac : Profondes et chaleureuses, avec\nune légère complexité boisée.\nFinale douce et équilibrée : Parfaite pour sublimer\ndes créations culinaires ou des boissons.\nLe Grand Marnier est un ingrédient clé dans des cocktails classiques\ncomme la Grand Margarita ou le Sidecar, et il est également célèbre pour\nson utilisation dans les crêpes Suzette."}, {"id": 47, "name": "Abricot Du roulot", "category": "Liqueurs de fruits", "abv": 25.0, "description": "L'Abricot du Roulot est une liqueur artisanale française produite par\nle Domaine Jean-Marc Roulot, situé à Meursault, en Bourgogne. Cette\nliqueur est élaborée à partir d'abricots Bergeron, une variété réputée\npour sa richesse aromatique, cultivés dans la Vallée du Rhône. Les\nfruits sont soigneusement sélectionnés et travaillés selon des méthodes\ntraditionnelles pour capturer toute leur essence.\nProfil aromatique :\nNotes d'abricots mûrs : Intenses et sucrées, rappelant les fruits\ngorgés de soleil.\nTouches miellées et florales : Apportant une douceur subtile et\nélégante.\nFinale légèrement acidulée : Équilibrant la richesse du fruit.\nAvec un taux d'alcool de 25 %, cette liqueur est idéale pour être\ndégustée pure, sur glace, ou utilisée dans des cocktails sophistiqués.\nElle se marie également très bien avec des desserts, comme une tarte aux\nabricots ou une panna cotta."}, {"id": 48, "name": "Liqueur de poire terre et pierre", "category": "Liqueurs de fruits", "abv": 23.5, "description": "La liqueur de poire Terre et Pierre est un produit artisanal québécois,\nélaboré par la micro-cidrerie et distillerie Entre Pierre et Terre,\nsituée à Franklin, au Québec. Cette liqueur met en valeur des poires\nancestrales cultivées localement, transformées avec soin pour capturer\ntoute leur essence.\nProfil aromatique :\nNotes de poires mûres : Douces et fruitées, avec une fraîcheur\nnaturelle.\nTouches florales et épicées : Subtiles, ajoutant une complexité\nélégante.\nFinale veloutée : Avec une belle persistance en bouche.\nAvec un taux d'alcool de 23,5 %, cette liqueur est idéale pour être\ndégustée pure, sur glace, ou utilisée dans des cocktails raffinés. Elle\nest également parfaite pour accompagner des desserts ou des fromages."}, {"id": 49, "name": "Liqueur de pèche Sivo", "category": "Liqueurs de fruits", "abv": 23.0, "description": "La liqueur de pêche Sivo, produite par la Maison Sivo au Québec, est une\ncréation artisanale qui met en valeur les saveurs naturelles des pêches\nfraîches. Avec un taux d'alcool de 23 %, cette liqueur est le fruit\nd'une macération minutieuse, offrant un profil aromatique doux et\nfruité.\nProfil aromatique :\nNotes de pêche mûre : Intenses et sucrées, rappelant les fruits d'été.\nTouches florales : Subtiles, ajoutant une élégance délicate.\nFinale rafraîchissante : Parfaite pour des cocktails ou une dégustation\npure.\nC'est la liqueur utilisée dans le Monarque.\nElle est idéale pour agrémenter des cocktails classiques comme le Sex on\nthe Beach ou des sangrias blanches, et peut également être savourée\nseule, bien fraîche."}, {"id": 50, "name": "Limoncello 3 lacs", "category": "Liqueurs de fruits", "abv": 28.0, "description": "Le Limoncello 3 Lacs est une liqueur artisanale québécoise produite par\nla Distillerie 3 Lacs. C'est le premier limoncello québécois, élaboré à\npartir de zestes de citrons biologiques pelés à la main directement à la\ndistillerie. Avec un taux d'alcool de 28 %, il offre un équilibre\nparfait entre l'acidité du citron, la douceur de la mandarine et une\ntouche subtile de mélilot, souvent appelé \"vanille québécoise\".\nProfil aromatique :\nNotes citronnées éclatantes : Fraîches et acidulées.\nDouceur équilibrée : Grâce à l'ajout de mandarine.\nComplexité subtile : Avec une touche de mélilot qui apporte une\nprofondeur unique.\nLe Limoncello 3 Lacs est idéal pour être dégusté pur, sur glace, ou\nutilisé dans des cocktails comme le Limoncello Spritz ou le Limone Fizz.\nIl est parfait pour ajouter une touche festive à vos moments spéciaux,\nque ce soit en été ou en hiver."}, {"id": 51, "name": "Lore & legends menthe boreale", "category": "Liqueurs de fruits", "abv": 26.0, "description": "La Grande Menthe Boréale de Lore & Legends est une liqueur artisanale\nquébécoise, élaborée avec des ingrédients locaux soigneusement\nsélectionnés. Avec un taux d'alcool de 26 %, elle met en avant des\nsaveurs uniques grâce à l'utilisation de menthe cultivée localement, de\nsapin baumier et de thé du Labrador, récoltés à la main dans les régions\nsauvages du nord du Québec.\nProfil aromatique :\nNotes fraîches de menthe : Intenses et vivifiantes.\nTouches boisées : Apportées par le sapin baumier.\nComplexité florale : Grâce au thé du Labrador.\nCette liqueur est idéale pour être dégustée pure, sur glace, ou utilisée\ndans des cocktails pour ajouter une touche boréale et rafraîchissante."}, {"id": 52, "name": "Blue curacao marie brizard", "category": "Liqueurs de fruits", "abv": 23.0, "description": "Le Marie Brizard Blue Curaçao est une liqueur d'agrumes emblématique,\nfabriquée en France. Elle est élaborée à partir d'écorces d'oranges\namères d'Haïti et d'oranges douces du sud de l'Espagne, avec l'ajout\nde plantes aromatiques pour enrichir son profil gustatif. Avec un taux\nd'alcool de 23 %, cette liqueur se distingue par sa couleur bleu\nprofond et son goût caractéristique.\nProfil aromatique :\nNotes d'orange amère : Intenses et légèrement sucrées.\nTouches florales : Subtiles, ajoutant une complexité élégante.\nFinale équilibrée : Peu sucrée, avec une belle fraîcheur.\nLe Blue Curaçao Marie Brizard est idéal pour être dégusté avec des\nglaçons ou utilisé dans des cocktails comme le Blue Lagoon ou le Blue\nMargarita."}, {"id": 53, "name": "Aperitivo Menaud", "category": "Liqueurs de fruits", "abv": 22.9, "description": "L'Apéritivo Menaud est une création artisanale québécoise inspirée des\naperitivi italiens. Produit par la distillerie Menaud, située dans la\nrégion de Charlevoix, cet apéritif met en valeur des ingrédients locaux\ntels que l'argousier, la camerise, l'épine-vinette et l'absinthe,\nmacérés dans un alcool neutre de grains. Avec un taux d'alcool de 22,9\n%, il offre un équilibre parfait entre acidité et sucrosité.\nProfil aromatique :\nNotes fruitées nordiques : Argousier et camerise apportent une fraîcheur\nunique.\nTouches herbacées : Grâce à l'absinthe et aux plantes locales.\nFinale légèrement amère : Parfaite pour les amateurs de saveurs\ncomplexes.\nCet apéritif est idéal pour être dégusté sur glace, en spritz, en\nnegroni ou dans d'autres cocktails sophistiqués."}, {"id": 54, "name": "Noa Amaretto", "category": "Liqueurs de fruits", "abv": null, "description": "Le Noa Amaretto est une liqueur sans alcool québécoise, produite par\nMonsieur Cocktail. Inspirée de l'amaretto classique, cette version\noffre une alternative parfaite pour ceux qui souhaitent savourer les\nsaveurs riches et complexes de l'amaretto, sans alcool. Avec des notes\nde cerise, de sirop d'érable, d'amande grillée et de vanille, il\nrecrée l'expérience gustative de l'amaretto traditionnel.\nProfil aromatique :\nCerise et amande grillée : Des arômes typiques de l'amaretto classique.\nSirop d'érable : Une touche québécoise unique.\nVanille subtile : Pour une douceur équilibrée.\nLe Noa Amaretto est idéal pour préparer des cocktails sans alcool, comme\nle Amaretto Sour ou le Noa Spritz, ou simplement pour être dégusté avec\ndu jus de citron ou d'orange."}, {"id": 55, "name": "Pistacis", "category": "Liqueurs de fruits", "abv": null, "description": "La Pistacis est une liqueur de pistache italienne qui incarne\nl'élégance et la gourmandise. Elle est souvent élaborée à partir de\npistaches de haute qualité, infusées dans de l'alcool neutre, puis\nmélangées avec du sucre et parfois de la crème pour obtenir une texture\nonctueuse et une saveur riche.\nProfil aromatique :\nNotes de pistache grillée : Intenses et authentiques.\nDouceur subtile : Équilibrée par une légère amertume.\nTexture veloutée : Parfaite pour une dégustation pure ou en dessert.\nCette liqueur est idéale pour être savourée seule, sur glace, ou\nutilisée dans des cocktails et des desserts raffinés."}, {"id": 56, "name": "Prunelle de bourgogne", "category": "Liqueurs de fruits", "abv": null, "description": "La Prunelle de Bourgogne est une liqueur française traditionnelle,\nsouvent associée à la région de Bourgogne. Elle est fabriquée à partir\ndes fruits du prunellier, également appelés \"prunelles\" ou\n\"plosses,\" qui sont récoltés après les premières gelées pour adoucir\nleur amertume naturelle. Les noyaux des fruits sont ensuite cassés et\nmacérés dans de l'alcool pendant une longue période, parfois plus d'un\nan, pour extraire leurs arômes riches et complexes.\nProfil aromatique :\nNotes d'amande : Issues des noyaux des prunelles, avec une touche\nsubtile de frangipane.\nSaveurs fruitées : Douces et légèrement acidulées.\nFinale chaleureuse : Parfaite pour un digestif.\nLa Prunelle de Bourgogne est souvent dégustée pure, en digestif, ou\nutilisée dans des cocktails pour apporter une touche unique. Elle peut\négalement être allongée avec du crémant ou du vin blanc pour un apéritif\nélégant."}, {"id": 57, "name": "Sureau Rosemont", "category": "Liqueurs de fruits", "abv": 23.5, "description": "La Rosemont Sureau est une liqueur artisanale québécoise produite par la\nDistillerie de Montréal. Elle est élaborée à partir de fleurs et de\nbaies de sureau soigneusement récoltées en Estrie. Les fleurs sont\ninfusées dans une base d'alcool neutre pendant 48 heures pour préserver\nleur fraîcheur et leurs arômes, tandis que les baies sont fermentées et\ndistillées séparément avant d'être assemblées avec une touche de sucre\nde canne.\nProfil aromatique :\nNotes florales : Douces et acidulées, grâce aux fleurs de sureau.\nSaveurs fruitées : Apportées par les baies, avec une rondeur légère.\nFinale subtile : Aux accents de sucre d'orge, peu sucrée.\nAvec un taux d'alcool de 23,5 %, cette liqueur est idéale pour être\ndégustée seule, en apéritif, ou utilisée dans des cocktails originaux\ncomme le Spritz au sureau ou le Sure O'Tonic."}, {"id": 58, "name": "Umeshu Choya", "category": "Liqueurs de fruits", "abv": 15.0, "description": "Le Choya Umeshu est une liqueur japonaise traditionnelle, fabriquée à\npartir de prunes japonaises (ume). Cette liqueur est réputée pour son\néquilibre parfait entre douceur et acidité, ainsi que pour ses arômes\nfruités et floraux. Avec un taux d'alcool typique de 10 à 15 %, elle\nest souvent consommée pure, sur glace, ou mélangée à de l'eau\npétillante pour un apéritif rafraîchissant.\nProfil aromatique :\nNotes fruitées : Prunes mûres avec une touche acidulée.\nDouceur subtile : Parfaitement équilibrée.\nFinale florale : Avec une légère complexité.\nLe Choya propose également des variantes comme le Choya Extra Years, le\nChoya Royal Honey, et le Choya Shiso, chacune offrant des saveurs\nuniques."}, {"id": 59, "name": "Luxardo abricot", "category": "Liqueurs de fruits", "abv": 30.0, "description": "Luxardo Abricot est une liqueur italienne raffinée, produite par la\ncélèbre maison Luxardo depuis 1935. Elle est élaborée à partir de la\npulpe d'abricots infusée dans de l'alcool de betterave sucrière, ce\nqui lui confère une saveur riche et complexe. Cette liqueur a été primée\nlors d'une compétition à Rome et porte le titre de \"Liquore della\nLupa\" (Liqueur de la Louve romaine), en hommage à la capitale\nitalienne.\nProfil aromatique :\nNotes fruitées : Abricots mûrs et confiture d'abricot.\nFinale douce et persistante : Avec une subtile nuance boisée.\nAvec un taux d'alcool de 30 %, elle est idéale pour être dégustée pure,\nsur glace, ou utilisée dans des cocktails sophistiqués comme le Apricot\nSour."}, {"id": 60, "name": "Pastis Ricard", "category": "Anisés", "abv": 45.0, "description": "Le Pastis Ricard, également connu sous le nom de Ricard Pastis de\nMarseille, est une liqueur anisée emblématique créée en 1932 par Paul\nRicard à Marseille. Ce pastis est élaboré à partir d'un mélange d'anis\nétoilé, de réglisse et d'herbes de Provence, ce qui lui confère un\nprofil aromatique unique et typiquement méditerranéen. Avec un taux\nd'alcool de 45 %, il est conçu pour être dilué avec de l'eau, ce qui\ntransforme sa couleur dorée en une teinte laiteuse caractéristique.\nProfil aromatique :\nNotes d'anis étoilé : Intenses et rafraîchissantes.\nDouceur réglissée : Apportant une rondeur agréable.\nHerbes provençales : Subtiles, ajoutant une complexité aromatique.\nLe Pastis Ricard est un incontournable des apéritifs à la française. Il\nest traditionnellement servi avec cinq volumes d'eau pour un volume de\npastis, accompagné de glaçons. Il peut également être utilisé dans des\ncocktails ou pour parfumer des plats méditerranéens."}, {"id": 61, "name": "Pastis henri bardouin", "category": "Anisés", "abv": 45.0, "description": "Le Pastis Henri Bardouin est un pastis haut de gamme, souvent qualifié\nde \"Grand Cru\" des pastis. Produit par les Distilleries et Domaines de\nProvence à Forcalquier, en France, il se distingue par sa recette\ncomplexe, composée de plus de 65 plantes et épices provenant de Provence\net d'autres régions du monde. Avec un taux d'alcool de 45 %, il offre\nune expérience gustative riche et raffinée.\nProfil aromatique :\nNotes anisées : Intenses et équilibrées.\nTouches herbacées et épicées : Thym, romarin, sauge, réglisse, et bien\nplus.\nFinale complexe et persistante : Avec une douceur subtile et une\namertume maîtrisée.\nLe Pastis Henri Bardouin est idéal pour être dégusté en apéritif, dilué\navec 6 à 10 volumes d'eau, ou utilisé dans des cocktails sophistiqués.\nIl est également apprécié pour accompagner des plats méditerranéens ou\ndes mets épicés."}, {"id": 62, "name": "Absente", "category": "Anisés", "abv": 55.0, "description": "L'Absente est une liqueur d'absinthe produite par les Distilleries et\nDomaines de Provence, située à Forcalquier, en France. Elle est inspirée\nde la légendaire absinthe, également connue sous le nom de \"Fée\nVerte,\" mais avec une teneur en thuyone (un composé naturel de\nl'absinthe) strictement contrôlée pour respecter les réglementations\nmodernes. Avec un taux d'alcool de 55 %, elle offre une expérience\ngustative riche et complexe.\nProfil aromatique :\nNotes anisées : Intenses et rafraîchissantes.\nTouches herbacées : Mélisse, menthe et armoise.\nFinale légèrement épicée : Avec une douceur subtile.\nL'Absente peut être dégustée selon le rituel traditionnel de\nl'absinthe : versez lentement de l'eau glacée sur un sucre posé sur\nune cuillère à absinthe, au-dessus du verre. Elle peut également être\nutilisée dans des cocktails pour ajouter une touche unique."}, {"id": 63, "name": "Absinthe fleur bleue", "category": "Anisés", "abv": 53.0, "description": "L'Absinthe Fleur Bleue est une absinthe artisanale québécoise produite\npar l'Absintherie des Cantons, située dans les Cantons-de-l'Est.\nInspirée d'une recette franco-suisse du XIXe siècle, cette absinthe\nblanche est distillée dans la plus pure tradition, mettant en valeur des\ningrédients locaux et une douzaine de plantes, dont l'Artemisia\nabsinthium (grande absinthe), le fenouil et l'anis.\nProfil aromatique :\nNotes anisées : Douces et équilibrées.\nTouches herbacées : Subtiles, avec une fraîcheur caractéristique.\nFinale délicate : Moins amère que les absinthes vertes, idéale pour une\ndégustation pure ou en cocktail.\nAvec un taux d'alcool de 53 %, elle est parfaite pour les amateurs\nd'absinthe à la recherche d'une expérience raffinée."}, {"id": 64, "name": "Anicetta meletti", "category": "Anisés", "abv": 34.0, "description": "L'Anisetta Meletti est une liqueur italienne emblématique, produite\ndepuis 1870 par la maison Meletti, située à Ascoli Piceno, dans la\nrégion des Marches. Cette liqueur est élaborée à partir de graines\nd'anis vert méditerranéen, soigneusement sélectionnées pour leur\nqualité, et distillées selon une méthode traditionnelle. Avec un taux\nd'alcool de 34 %, elle est reconnue pour son goût délicat et son arôme\nraffiné.\nProfil aromatique :\nNotes d'anis : Intenses et fraîches.\nDouceur subtile : Avec une légère touche sucrée.\nFinale élégante : Parfaite pour une dégustation pure ou en\naccompagnement.\nL'Anisetta Meletti peut être dégustée de différentes façons : pure, sur\nglace, ou avec trois grains de café (appelée \"anisette con la mosca\").\nElle est également utilisée pour parfumer des desserts ou enrichir des\ncocktails."}, {"id": 65, "name": "Cocchi americano bianco", "category": "Vermouths et Xérès", "abv": 16.5, "description": "Le Cocchi Americano Bianco est un apéritif italien classique, créé en\n1891 par Giulio Cocchi. Il est élaboré à partir de vin blanc aromatisé\navec des herbes et des épices, notamment la gentiane, l'armoise, la\nquinine et des zestes d'agrumes. Avec un taux d'alcool de 16,5 %, il\nest souvent considéré comme le lien parfait entre le vin et les\nliqueurs.\nProfil aromatique :\nNotes d'agrumes : Fraîches et légèrement amères.\nTouches herbacées : Subtiles, avec une complexité élégante.\nFinale douce et équilibrée : Parfaite pour les cocktails ou une\ndégustation pure.\nLe Cocchi Americano Bianco est idéal pour des cocktails comme le Vesper\nMartini, le Corpse Reviver #2, ou simplement servi avec de l'eau\npétillante et un zeste d'orange. Il est également utilisé comme\nsubstitut du Kina Lillet dans certaines recettes classiques."}, {"id": 66, "name": "Cocchi Rosa", "category": "Vermouths et Xérès", "abv": 16.5, "description": "Le Cocchi Rosa est un apéritif italien raffiné, produit par la maison\nGiulio Cocchi dans la région du Piémont. Élaboré à partir de vins rouges\nlocaux, il est aromatisé avec des herbes, des épices et des extraits\nnaturels, notamment de la gentiane, de la quinine, des zestes d'agrumes\net des pétales de rose. Avec un taux d'alcool de 16,5 %, il se\ndistingue par sa couleur rouge naturelle et ses saveurs complexes.\nProfil aromatique :\nNotes florales : Pétales de rose et nuances délicates.\nTouches herbacées : Gentiane et quinine pour une légère amertume.\nSaveurs fruitées : Agrumes et une douceur subtile.\nLe Cocchi Rosa est idéal pour des cocktails comme le Cocchi Rosa Spritz\n(mélangé avec du vin pétillant et un zeste de pamplemousse rose) ou\nsimplement servi avec de l'eau pétillante et une tranche d'orange. Il\nest également parfait pour les amateurs de cocktails à faible teneur en\nalcool."}, {"id": 67, "name": "Cocchi torino rouge", "category": "Vermouths et Xérès", "abv": null, "description": "Le Cocchi Vermouth di Torino Rosso est un vermouth italien classique,\nproduit dans la région du Piémont. Élaboré selon une recette\ntraditionnelle datant de 1891, il est fabriqué à partir de vin Moscato\net aromatisé avec des plantes et des épices, notamment du cacao, de la\nrhubarbe, des agrumes et du gingembre.\nProfil aromatique :\nNotes d'agrumes : Fraîches et légèrement amères.\nTouches épicées : Cacao, gingembre et rhubarbe pour une complexité\nunique.\nFinale équilibrée : Douce et amère, parfaite pour les cocktails.\nCe vermouth est idéal pour des cocktails classiques comme le Negroni ou\nle Manhattan, mais il peut également être dégusté pur ou avec de l'eau\npétillante pour un apéritif élégant."}, {"id": 68, "name": "Cocchi extra dry", "category": "Vermouths et Xérès", "abv": 17.0, "description": "Le Cocchi Vermouth di Torino Extra Dry est un vermouth italien élégant,\nproduit dans la région du Piémont. Créé pour célébrer le 130e\nanniversaire de la maison Cocchi, il est élaboré à partir de raisins\nCortese, les mêmes utilisés pour le Gavi DOCG, et d'un mélange\nd'herbes et d'épices locales, comme la menthe piémontaise, le zeste de\ncitron, la coriandre et l'absinthe.\nProfil aromatique :\nNotes fraîches : Pomme, melon et fleurs blanches provenant du vin.\nTouches herbacées : Menthe, coriandre et absinthe pour une complexité\néquilibrée.\nFinale vive et lumineuse : Grâce au zeste de citron et à la menthe.\nAvec un taux d'alcool de 17 %, ce vermouth est parfait pour enrichir\ndes cocktails classiques comme le Martini ou le Bamboo, mais il peut\négalement être dégusté avec de l'eau tonique ou sur glace."}, {"id": 69, "name": "Carpano antica formula", "category": "Vermouths et Xérès", "abv": 16.5, "description": "Le Carpano Antica Formula est un vermouth italien prestigieux, souvent\nconsidéré comme le \"roi des vermouths.\" Créé en 1786 par Antonio\nBenedetto Carpano à Turin, il est élaboré à partir de vins blancs comme\nle Trebbiano, le Catarratto et le Chardonnay, et aromatisé avec des\nherbes, des épices et des racines selon une recette secrète. Avec un\ntaux d'alcool de 16,5 %, il se distingue par ses notes complexes et son\nprofil unique.\nProfil aromatique :\nNotes de vanille : Douces et chaleureuses.\nTouches épicées : Cacao, rhubarbe et agrumes.\nFinale équilibrée : Douce-amère, parfaite pour les cocktails ou une\ndégustation pure.\nLe Carpano Antica Formula est idéal pour des cocktails classiques comme\nle Negroni, le Manhattan, ou simplement servi sur glace en apéritif."}, {"id": 70, "name": "La Copa vermouth gonzales byass", "category": "Vermouths et Xérès", "abv": 15.5, "description": "La Copa Rojo de González Byass est un vermouth rouge espagnol, élaboré\ndans la région de Jerez, en Andalousie. Ce vermouth est créé à partir de\nvins de xérès, notamment l'Oloroso et le Pedro Ximénez, et aromatisé\navec un mélange d'herbes et d'épices selon une recette historique\ndatant de 1896.\nProfil aromatique :\nNotes épicées : Cannelle, clou de girofle et noix de muscade.\nSaveurs fruitées : Raisins secs et agrumes.\nFinale élégante : Avec une touche de cola et une amertume équilibrée.\nAvec un taux d'alcool de 15,5 %, le La Copa Rojo est idéal pour être\ndégusté pur, sur glace, ou utilisé dans des cocktails comme le Negroni\nou le Manhattan"}, {"id": 71, "name": "Lucano Cavaliere", "category": "Vermouths et Xérès", "abv": 18.0, "description": "Le Lucano Vermouth del Cavaliere Rosso est un vermouth italien\nprestigieux, produit par la maison Lucano 1894, située dans la région de\nBasilicate. Ce vermouth rouge est élaboré à partir de vin rouge, enrichi\nd'un mélange d'herbes et d'épices, notamment l'absinthe, l'origan,\nla coriandre, l'orange et l'angélique. Avec un taux d'alcool de 18 %,\nil offre une expérience gustative complexe et intense.\nProfil aromatique :\nNotes herbacées : Absinthe et coriandre pour une amertume équilibrée.\nSaveurs épicées : Origan et angélique pour une profondeur aromatique.\nTouches fruitées : Orange pour une douceur subtile.\nCe vermouth est idéal pour être dégusté pur, sur glace, ou utilisé dans\ndes cocktails sophistiqués comme le Negroni ou le Manhattan."}, {"id": 72, "name": "Martini vibrante", "category": "Vermouths et Xérès", "abv": null, "description": "Le Martini Vibrante est un apéritif sans alcool italien, conçu pour\noffrir une alternative raffinée et savoureuse aux boissons alcoolisées.\nÉlaboré à partir de vins désalcoolisés et infusé avec des plantes et des\nagrumes, notamment la bergamote et l'armoise, il se distingue par son\nprofil aromatique complexe et rafraîchissant.\nProfil aromatique :\nNotes d'agrumes : Bergamote et zestes d'orange pour une fraîcheur\nvive.\nTouches herbacées : Subtiles, avec une légère amertume.\nFinale équilibrée : Douce et légèrement acidulée.\nLe Martini Vibrante est parfait pour des cocktails comme le Vibrante\nSpritz, où il est mélangé avec de l'eau tonique et garni d'une tranche\nd'orange. Il peut également être dégusté pur, sur glace, pour un\napéritif léger et élégant."}, {"id": 73, "name": "Noilly prat dry", "category": "Vermouths et Xérès", "abv": 18.0, "description": "Le Noilly Prat Original Dry est un vermouth français emblématique,\nréputé pour son équilibre et sa complexité. Produit à Marseillan, dans\nle sud de la France, il est élaboré à partir de vins blancs, notamment\nde cépages Picpoul et Clairette, qui sont vieillis en plein air dans des\nfûts de chêne pendant 12 mois. Ce procédé unique développe des arômes\nriches et raffinés.\nProfil aromatique :\nNotes herbacées et épicées : Absinthe, camomille et coriandre.\nToucher boisé : Résultant de la maturation en fût.\nFinale sèche et minérale : Avec une légère amertume.\nAvec un taux d'alcool de 18 %, le Noilly Prat Original Dry est parfait\npour des cocktails classiques comme le Martini Dry, ou simplement\ndégusté pur avec un zeste de citron. Il est aussi très apprécié en\ncuisine pour sublimer des plats de fruits de mer ou des sauces."}, {"id": 74, "name": "Vermouth rouge gorge blanc", "category": "Vermouths et Xérès", "abv": 18.0, "description": "Le Rouge Gorge Blanc est un vermouth québécois unique, produit par le\nDomaine Lafrance à partir de pommes cultivées localement. Ce vermouth de\ncidre blanc est infusé avec une variété d'herbes et d'épices,\nnotamment l'absinthe, la fleur de sureau, le fenouil, la sarriette et\nla racine de gentiane, parmi plus de 100 autres ingrédients.\nProfil aromatique :\nNotes fruitées : Pomme fraîche et nuances végétales.\nTouches épicées : Cannelle et autres épices subtiles.\nFinale douce et équilibrée : Avec une légère amertume.\nAvec un taux d'alcool de 18 %, il est parfait pour être dégusté sur\nglace avec une tranche de citron, ou utilisé dans des cocktails comme le\nDirty Martini ou le Clover Club. Ce vermouth met en valeur le\nsavoir-faire québécois et la richesse des produits locaux."}, {"id": 75, "name": "Nectar PX gonzales byass", "category": "Vermouths et Xérès", "abv": 15.0, "description": "Le PX Nectar est un vin doux naturel espagnol produit par la maison\nGonzález Byass, dans la région de Jerez. Ce vin est élaboré à partir de\nraisins de cépage Pedro Ximénez, qui sont séchés au soleil avant la\nvinification pour concentrer leurs sucres. Il est ensuite vieilli\npendant environ 9 ans dans des fûts de chêne américain, selon le système\ntraditionnel de solera.\nProfil aromatique :\nNotes de fruits secs : Raisins, figues et dattes.\nTouches sucrées : Miel et caramel.\nFinale veloutée : Avec une acidité subtile qui équilibre le tout.\nAvec un taux d'alcool de 15 %, le PX Nectar est idéal pour accompagner\ndes desserts comme la crème brûlée, les glaces ou les gâteaux aux noix.\nIl peut également être dégusté seul, comme un véritable dessert liquide."}, {"id": 76, "name": "Vermouth vergano", "category": "Vermouths et Xérès", "abv": 17.0, "description": "Le Vermouth Vergano est une création artisanale italienne, produite par\nMauro Vergano dans la région du Piémont, à Asti. Ce vermouth est élaboré\nà partir de vins locaux, comme le Moscato et le Cortese, et aromatisé\navec un mélange d'herbes et d'épices soigneusement sélectionnées,\nnotamment la marjolaine, le thym, le basilic, l'origan, et le zeste de\ncitron.\nProfil aromatique :\nNotes herbacées : Fraîches et complexes, avec une touche\nméditerranéenne.\nSaveurs fruitées : Agrumes et une douceur subtile.\nFinale équilibrée : Douce-amère, parfaite pour les cocktails ou une\ndégustation pure.\nAvec un taux d'alcool de 17 %, le Vermouth Vergano est idéal pour des\ncocktails comme le White Negroni, ou simplement servi sur glace avec une\ntranche de citron. Ce vermouth est produit en petites quantités, ce qui\nle rend rare et très recherché."}, {"id": 77, "name": "Barr Hill", "category": "Gins", "abv": 45.0, "description": "Le Barr Hill Gin est un gin artisanal américain produit par Caledonia\nSpirits, dans le Vermont. Ce gin est unique grâce à l'ajout de miel\nbrut en fin de distillation, ce qui lui confère une douceur florale et\nune profondeur aromatique exceptionnelle. Avec un taux d'alcool de 45\n%, il est souvent considéré comme l'un des gins les plus primés aux\nÉtats-Unis.\nProfil aromatique :\nNotes de genièvre : Prononcées et équilibrées.\nTouches florales : Apportées par le miel brut, avec une complexité\nnaturelle.\nFinale douce et élégante : Parfaite pour une dégustation pure ou en\ncocktail.\nLe Barr Hill Gin est idéal pour des cocktails comme le Bee's Knees ou\nle Gin Tonic, mais il peut également être dégusté pur pour apprécier\npleinement ses arômes uniques."}, {"id": 78, "name": "Barr hill tom cat", "category": "Gins", "abv": 43.0, "description": "Le Barr Hill Tom Cat Gin est une version vieillie du célèbre Barr Hill\nGin, produite par Caledonia Spirits dans le Vermont. Ce gin est vieilli\nen fûts de chêne américain, ce qui lui confère des saveurs boisées et\nune profondeur aromatique unique. Avec un taux d'alcool de 43 %, il est\nsouvent apprécié par les amateurs de gin et de whisky pour son profil\nriche et complexe.\nProfil aromatique :\nNotes boisées : Vanille et épices douces provenant du vieillissement en\nfût.\nTouches florales : Apportées par le miel brut utilisé dans la recette.\nFinale équilibrée : Douce et légèrement épicée.\nLe Barr Hill Tom Cat Gin est idéal pour des cocktails comme le Old\nFashioned ou le Negroni, mais il peut également être dégusté pur pour\napprécier pleinement ses arômes."}, {"id": 79, "name": "Bols Genever", "category": "Gins", "abv": 42.0, "description": "Le Bols Genever est un genièvre hollandais emblématique, produit par la\nmaison Lucas Bols, l'une des plus anciennes distilleries au monde,\nfondée en 1575. Ce spiritueux est élaboré selon une recette\ntraditionnelle datant de 1820, qui combine des malts de céréales et des\nplantes aromatiques, notamment le genièvre. Avec un taux d'alcool de 42\n%, il est souvent considéré comme l'ancêtre du gin moderne.\nProfil aromatique :\nNotes maltées : Riche et douce, avec une texture veloutée.\nTouches herbacées : Subtiles, avec une légère amertume.\nFinale équilibrée : Parfaite pour les cocktails ou une dégustation pure.\nLe Bols Genever est idéal pour des cocktails classiques comme le\nMartinez, le Dutch Negroni, ou simplement servi sur glace."}, {"id": 80, "name": "Bombay Sapphire", "category": "Gins", "abv": 40.0, "description": "Le Bombay Sapphire est un gin emblématique de style London Dry, connu\npour sa douceur et son équilibre. Il est produit en Angleterre par la\nBombay Spirits Company et se distingue par son processus unique de\ndistillation à la vapeur, qui permet d'extraire délicatement les arômes\nde ses 10 plantes botaniques soigneusement sélectionnées, comme les\nbaies de genièvre, la coriandre, les graines de paradis et l'écorce de\ncitron.\nProfil aromatique :\nNotes fraîches : Genièvre et agrumes.\nTouches épicées : Coriandre et poivre.\nFinale équilibrée : Douce et florale.\nAvec un taux d'alcool de 40 %, le Bombay Sapphire est parfait pour des\ncocktails classiques comme le Gin Tonic, le Martini Dry, ou même des\ncréations plus audacieuses."}, {"id": 81, "name": "Botanist gin", "category": "Gins", "abv": 46.0, "description": "Le Botanist Islay Dry Gin est un gin artisanal écossais, produit par la\ncélèbre distillerie Bruichladdich, située sur l'île d'Islay. Ce gin se\ndistingue par l'utilisation de 22 plantes indigènes de l'île,\ncueillies à la main, en plus des 9 plantes botaniques classiques comme\nle genièvre, la coriandre et l'angélique. Avec un taux d'alcool de 46\n%, il offre une expérience aromatique complexe et unique.\nProfil aromatique :\nNotes herbacées : Menthe, thym et camomille.\nTouches florales : Bruyère et fleurs sauvages.\nFinale équilibrée : Fraîche et légèrement citronnée.\nLe Botanist est parfait pour des cocktails comme le Gin Tonic ou le\nBotanist Collins, mais il peut également être dégusté pur pour apprécier\npleinement ses arômes."}, {"id": 82, "name": "Gin Brockman's", "category": "Gins", "abv": 40.0, "description": "Le Brockmans Gin est un gin artisanal anglais, réputé pour son profil\naromatique unique et sa douceur exceptionnelle. Élaboré à partir\nd'ingrédients naturels, il se distingue par l'utilisation de baies\nnoires comme la mûre et la myrtille, en plus des plantes botaniques\nclassiques telles que le genièvre, la coriandre, et les zestes\nd'agrumes.\nProfil aromatique :\nNotes fruitées : Mûre, myrtille et framboise pour une douceur intense.\nTouches herbacées : Genièvre et coriandre pour un équilibre parfait.\nFinale douce et veloutée : Idéale pour une dégustation pure ou en\ncocktail.\nAvec un taux d'alcool de 40 %, le Brockmans Gin est parfait pour des\ncocktails comme le Gin Tonic ou le Martini, mais il peut également être\ndégusté pur, sur glace, pour apprécier pleinement ses arômes fruités."}, {"id": 83, "name": "Cirka sauvage", "category": "Gins", "abv": 44.0, "description": "Le Cirka Sauvage est un gin artisanal québécois, produit par la\ndistillerie Cirka, située à Montréal. Ce gin est une célébration des\ntrésors aromatiques des forêts boréales du Québec. Élaboré avec 33\nplantes botaniques, il offre un profil complexe et équilibré, mettant en\nvaleur des ingrédients locaux comme le pin, la menthe et des notes\nflorales.\nProfil aromatique :\nNotes boisées : Pin et conifères pour une fraîcheur sauvage.\nTouches florales : Élégantes et harmonieuses.\nFinale veloutée : Avec une chaleur subtile qui enveloppe le palais.\nAvec un taux d'alcool de 44 %, le Cirka Sauvage est idéal pour des\ncocktails sophistiqués ou une dégustation pure."}, {"id": 84, "name": "Gin citadelle", "category": "Gins", "abv": 44.0, "description": "Le Citadelle Gin est un gin artisanal français produit par la maison\nMaison Ferrand, située dans le sud-ouest de la France, près de Cognac.\nCréé en 1996, il est considéré comme l'un des pionniers des gins\n\"craft\" et se distingue par son processus d'infusion progressive,\nutilisant 19 plantes botaniques soigneusement sélectionnées, comme le\ngenièvre, la coriandre, le poivre cubèbe, et la cardamome.\nProfil aromatique :\nNotes fraîches : Genièvre et agrumes.\nTouches épicées : Poivre, cardamome et cannelle.\nFinale équilibrée : Douce et florale, avec une complexité élégante.\nAvec un taux d'alcool de 44 %, le Citadelle Gin est parfait pour des\ncocktails classiques comme le Gin Tonic, le Martini Dry, ou même des\ncréations plus audacieuses. Il peut également être dégusté pur pour\napprécier pleinement ses arômes."}, {"id": 85, "name": "Gin citadelle jardin d'été", "category": "Gins", "abv": 41.5, "description": "Le Citadelle Jardin d'Été est un gin artisanal français, produit par la\nmaison Maison Ferrand. Inspiré par le jardin du Château de Bonbonnet, ce\ngin célèbre les saveurs estivales avec une recette unique intégrant des\ningrédients comme le melon charentais, le yuzu, le citron et l'orange.\nAvec un taux d'alcool de 41,5 %, il offre une expérience aromatique\nfraîch
